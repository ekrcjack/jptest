<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#6b7078; --line:#e3dfd6;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
    --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
  --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","PingFang TC","Noto Sans TC",sans-serif}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.bar h1{font-size:18px;margin:0;flex:1 1 auto;white-space:nowrap}

.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.score{font-size:14px;color:var(--muted)}
.score b{color:var(--ink)}
select.btn{padding:5px 8px}
main{padding:16px 0 120px}
.notes{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}

.mondai{margin:22px 0 10px}
.mondai h3{font-size:16px;margin:0 0 4px;color:var(--accent)}
.instr{font-size:14px;color:var(--muted);margin:0 0 10px}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}

.group img{max-width:100%;height:auto;display:block;margin:4px auto 12px;border-radius:6px;background:#fff}
.q{padding:10px 0;border-top:1px dashed var(--line)}
.group .q:first-of-type{border-top:0}
.stem{margin:0 0 8px}
.qn{display:inline-block;min-width:28px;padding:0 6px;margin-right:8px;border:1.5px solid var(--ink);border-radius:4px;text-align:center;font-weight:700;font-size:14px;line-height:22px}
.stem u{text-decoration-thickness:1.5px;text-underline-offset:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.choices.long{grid-template-columns:1fr}
.ch{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.ch:hover{border-color:var(--muted)}
.ch .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-top:3px}
.ch.picked{border-color:var(--ink);background:var(--chip)}
.ch.picked .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{border-color:var(--ng);background:var(--ng-soft)}
.ch.wrong .k{background:var(--ng);border-color:var(--ng);color:#fff}
.fb{margin-top:8px;font-size:14.5px;border-left:3px solid var(--line);padding:4px 0 4px 10px;display:none}
.fb.show{display:block}
.fb .verdict{font-weight:700}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.ng{color:var(--ng)}
details.script{margin-top:6px}
details.script summary{cursor:pointer;color:var(--muted);font-size:14px}
details.script div{background:var(--chip);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:14.5px}
.audio{position:sticky;top:var(--hdr,96px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.audio audio{flex:1 1 260px;width:100%}
.audio .hint{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.result{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin:20px 0}
.result table{border-collapse:collapse;width:100%;font-size:14.5px}
.result td,.result th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.result td.num{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.choices{grid-template-columns:1fr 1fr}.bar h1{font-size:16px}}
</style>

": 4, "explain": "沸かす（わかす）＝把水燒開，「お湯を沸かす」是固定說法。讓身體、房間變暖用「温める」。"}, {"n": 27, "stem": "しょうたい", "choices": ["木村さんをけっこんしきに<u>しょうたい<\/u>しました。", "ねこをかぞくに<u>しょうたい<\/u>しました。", "すずしいかぜをへやに<u>しょうたい<\/u>しました。", "本に書いてあったことをレポートに<u>しょうたい<\/u>しました。"], "answer": 1, "explain": "招待（しょうたい）＝邀請（人）參加活動，如「結婚式に招待する」。"}, {"n": 28, "stem": "やむ", "choices": ["としょかんがもう<u>やんで<\/u>いて、本がかりられませんでした。", "かいぎが<u>やんだら<\/u>、わたしにしらせてください。", "雨はおひるごろに<u>やんで<\/u>、今ははれています。", "なつやすみが<u>やんだら<\/u>、すぐにテストがあります。"], "answer": 3, "explain": "止む（やむ）＝雨、雪、風等自然現象停止。圖書館「閉まる」、會議或暑假「終わる」。"}]}]}]}, {"name": "言語知識（文法）・読解", "mondai": [{"no": 1, "instruction": "（　　）に何を入れますか。1・2・3・4からいちばんいいものを一つえらんでください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "わたしはよく仕事（　　）飛行機に乗ります。", "choices": ["と", "で", "が", "を"], "answer": 2, "explain": "句意：我常因工作搭飛機。「で」表示原因、理由或目的情境（因為工作）。"}, {"n": 2, "stem": "今朝、いなかにいる母（　　）荷物がとどきました。", "choices": ["で", "と", "を", "から"], "answer": 4, "explain": "句意：今天早上收到住在鄉下的媽媽寄來的包裹。「から」表示來源、起點。"}, {"n": 3, "stem": "（教室で）<br>先生「じゃあ、一人（　　）じこしょうかいをしてください。」", "choices": ["など", "ずつ", "しか", "も"], "answer": 2, "explain": "句意：那麼，請每個人輪流自我介紹。「数量＋ずつ」＝每～、各～。"}, {"n": 4, "stem": "田中「山下さん、好きな食べ物はなんですか。」<br>山下「ハンバーグです。1週間に3回ぐらい食べます。」<br>田中「え、1週間に3回（　　）食べるんですか。大好きなんですね。」", "choices": ["も", "で", "を", "が"], "answer": 1, "explain": "句意：一週吃3次那麼多？「数量＋も」表示說話者覺得數量多、出乎意料。"}, {"n": 5, "stem": "いっしょうけんめい勉強して、（　　）外国の大学に行きたいです。", "choices": ["すっかり", "たぶん", "やっと", "いつか"], "answer": 4, "explain": "句意：努力讀書，希望將來有一天去國外的大學。「いつか」＝總有一天，常與願望「～たい」連用。"}, {"n": 6, "stem": "青木「林さんはいつも会社まで（　　）行っていますか。」<br>林「バスと地下鉄で行っています。」", "choices": ["どれを", "どこに", "どうやって", "どのぐらい"], "answer": 3, "explain": "句意：你都怎麼去公司？回答是交通方式（公車和地鐵），所以用「どうやって」（如何、用什麼方法）。"}, {"n": 7, "stem": "毎日じゅぎょうは（　　）ごろ終わります。", "choices": ["3時", "3時に", "3時間", "3時間に"], "answer": 1, "explain": "句意：每天的課大約3點結束。「時刻＋ごろ」表示大約的時間點，中間不加「に」；「3時間」是時間長度，不能接「ごろ」表示時刻。"}, {"n": 8, "stem": "庭のさくらは去年より（　　）さきました。", "choices": ["早く", "早い", "早くて", "早かった"], "answer": 1, "explain": "句意：院子的櫻花比去年早開。修飾動詞「さきました」要用形容詞的副詞形「早く」。"}, {"n": 9, "stem": "わたしは本当に虫がきらいで、（　　）いやです。", "choices": ["見るし", "見るのに", "見るなら", "見るのも"], "answer": 4, "explain": "句意：我真的很討厭蟲，連看到都覺得討厭。「～のも」＝連～也，將動作名詞化並加強語氣。"}, {"n": 10, "stem": "れいぞうこから変な音が（　　）。こしょうしたのかもしれない。", "choices": ["いる", "ある", "する", "聞く"], "answer": 3, "explain": "句意：冰箱發出奇怪的聲音，可能故障了。「音がする」是固定說法，表示發出／聽到聲音。"}, {"n": 11, "stem": "花が好きなそぼのへやには、いつもいろいろな花が（　　）。", "choices": ["かざらせます", "かざります", "かざっておきます", "かざられています"], "answer": 4, "explain": "句意：喜歡花的奶奶房間裡總是擺著各種花。主語是「花が」，要用被動進行式「飾られています」表示狀態。"}, {"n": 12, "stem": "山川「もうすぐ夏休みですね。アンさんは、今年の夏休みも国に帰るんですか。」<br>アン「いいえ。今年は日本でアルバイトをするので、（　　）。」", "choices": ["帰っていません", "帰られないといけません", "帰らないことにしました", "帰ったことがあります"], "answer": 3, "explain": "句意：今年要在日本打工，所以決定不回國。「～ことにしました」＝（自己）決定要～。"}, {"n": 13, "stem": "（台所で）<br>弟「お姉ちゃん、何かてつだうよ。」<br>姉「ありがとう。じゃあ、トマトを（　　）？」<br>弟「うん、わかった。」", "choices": ["切ってある", "切ってもらえる", "切ってもいい", "切ったほうがいい"], "answer": 2, "explain": "句意：那可以幫我切番茄嗎？「～てもらえる？」是請對方幫忙的口語說法，弟弟回答「好」。"}]}]}, {"no": 2, "instruction": "次の文の ★ に入る最もよいものを、1・2・3・4から一つ選びなさい。", "groups": [{"passage": null, "image": null, "questions": [{"n": 14, "stem": "今日は、一年で ＿＿＿ ＿＿＿ ★ ＿＿＿ です。", "choices": ["日", "が", "夜", "最も長い"], "answer": 4, "explain": "正確順序：夜(3) が(2) 最も長い(4) 日(1)。「今日は、一年で夜が最も長い日です」＝今天是一年中夜晚最長的一天，★處為「最も長い」。"}, {"n": 15, "stem": "私は、日本に ＿＿＿ ＿＿＿ ★ ＿＿＿ 写真をたくさんとりたいです。", "choices": ["いろいろな町へ", "行って", "間に", "いる"], "answer": 1, "explain": "正確順序：いる(4) 間に(3) いろいろな町へ(1) 行って(2)。「日本にいる間に」＝在日本的期間，★處為「いろいろな町へ」。"}, {"n": 16, "stem": "＿＿＿ ＿＿＿ ★ ＿＿＿、私は小さいとき、この絵本が大好きだったそうだ。", "choices": ["によると", "話", "母", "の"], "answer": 2, "explain": "正確順序：母(3) の(4) 話(2) によると(1)。「～によると、～そうだ」表示傳聞來源，★處為「話」。"}, {"n": 17, "stem": "今日、学校に木村さんは明るい青色のシャツを着て来た。＿＿＿ ＿＿＿ ★ ＿＿＿ のシャツがほしい。", "choices": ["あんな色", "木村さんが", "着ていた", "私も"], "answer": 3, "explain": "正確順序：私も(4) 木村さんが(2) 着ていた(3) あんな色(1)。「木村さんが着ていた」修飾「あんな色」，★處為「着ていた」。"}]}]}, {"no": 3, "instruction": "18から21に何を入れますか。文章の意味を考えて、1・2・3・4からいちばんいいものを一つえらんでください。<br>下の文章は、留学生の作文である。", "groups": [{"passage": "国から持ってきた物<br>ダワドルジ　ホラン<br>　私は、日本に来るとき、国からカメラを持ってきました。日本で写真をたくさんとりたいと（ 18 ）。<br>　最近よくとっているのは、町のけしきの写真です。日本の町と私の国の町は景色が全然違います。だから、とても面白いです。（ 19 ）、よく写真をとっています。私は、日本の町のけしきがすきです。<br>　海（ 20 ）ときどき写真を撮りに行きます。私の国には海がないので、日本で初めて海を見ました。国にいる時、ずっと海が見てみたいと思っていました。今は、いつでも海を見に行くことができて、うれしいです。<br>　もうすぐ夏休みです。国に帰って、日本で撮った写真を家族に（ 21 ）。家族が何と言うか楽しみです。", "image": null, "questions": [{"n": 18, "stem": "（ 18 ）", "choices": ["思うからです", "思うことです", "思ったからです", "思ったことです"], "answer": 3, "explain": "說明帶相機來日本的理由，且「想拍照」是來日本之前的想法，所以用過去式＋理由「思ったからです」。"}, {"n": 19, "stem": "（ 19 ）", "choices": ["それで", "けれども", "たとえば", "まず"], "answer": 1, "explain": "前文「因為很有趣」，後文「所以常常拍照」，是因果關係，用「それで」（因此）。"}, {"n": 20, "stem": "（ 20 ）", "choices": ["では", "にも", "だけ", "なら"], "answer": 2, "explain": "前面說常拍街景，這裡說「也會去海邊拍照」，「海にも行きます」＝也去海邊。"}, {"n": 21, "stem": "（ 21 ）", "choices": ["見せています", "見せてくれます", "見せるそうです", "見せようと思います"], "answer": 4, "explain": "放暑假回國後打算給家人看照片，表示自己的打算用「～ようと思います」。"}]}]}, {"no": 4, "instruction": "次の(1)から(3)の文章を読んで、質問に答えてください。答えは、1・2・3・4から、いちばんいいものを一つ選んでください。", "groups": [{"passage": "（洋服の店で）<br>リナさんがアルバイトに来た時、このメモとシャツが置いてありました。<br><br>リナさん<br>　6日の午前中に、お客様の上田様が店に来ます。上田様が持ってくるシャツをこの新しいシャツと取り替えてください。買ったシャツのそでが汚れていたそうです。<br>　チェックしましたが、新しいシャツは大丈夫です。<br>　よろしくお願いします。<br>9月5日　19：00<br>山野", "image": null, "questions": [{"n": 22, "stem": "リナさんは、このメモを読んで、上田さんが来たら何をしなければなりませんか。", "choices": ["上田さんが持ってきたシャツのそでをきれいにします。", "上田さんが持ってきたシャツを新しいシャツと取り替えます。", "上田さんが持ってきたシャツをもらって、お金を返します。", "上田さんが持ってきたシャツをチェックします。"], "answer": 2, "explain": "便條寫「上田様が持ってくるシャツをこの新しいシャツと取り替えてください」，要換成新襯衫；檢查（チェック）是店長已做過的事。"}]}, {"passage": "　赤ちゃんは新聞で遊ぶのが大好きです。でも、すぐ口に入れてしまうので、親は困ります。それで、おもちゃの会社が「赤ちゃん新聞」というおもちゃを作りました。紙ではないので、口に入れても大丈夫だし、何回でも洗えて便利です。", "image": null, "questions": [{"n": 23, "stem": "「赤ちゃん新聞」について、合っているものはどれですか。", "choices": ["赤ちゃんについて書いてあって、人気があります。", "新聞の会社が、赤ちゃんにあげるために作りました。", "本当の新聞ではないので、口に入れても安心です。", "紙でできていますが、何回でも洗えて便利です。"], "answer": 3, "explain": "文中說「紙ではないので、口に入れても大丈夫」，是玩具公司做的、不是紙做的，所以選3。"}]}, {"passage": "これは、中西先生がリムさんに書いたメールです。<br><br>リムさん<br>こんばんは。<br>送ってくれた卒業式のあいさつの文章ですが、とてもよかったですよ。<br>リムさんはみんなの前でうまく話せるか心配だと言っていましたね。前川先生と高木先生も、「練習を見ましょうか。」と言っていたので、頼んでみましょうか。<br>中西", "image": null, "questions": [{"n": 24, "stem": "卒業式の挨拶について、中西先生がリムさんに聞きたいことは何ですか。", "choices": ["前川先生と高木先生にも文章を送ったかどうか", "前川先生と高木先生の前で練習をしているかどうか", "前川先生と高木先生に練習を見てもらいたいかどうか", "前川先生と高木先生に「練習を見てください。」と頼んだかどうか"], "answer": 3, "explain": "信末「頼んでみましょうか」是在問リム要不要請兩位老師看她練習，即是否希望老師幫忙看練習。"}]}]}, {"no": 5, "instruction": "次の文章を読んで、質問に答えなさい。答えは、1・2・3・4から、一番いいものを一つ選んでください。", "groups": [{"passage": "　私は半年前、家族と一緒に住んでいた家を出て、アパートに①<u>引っ越しました<\/u>。大学を卒業して会社に入ったのですが、家から遠かったです。引っ越ししてから、週末、近所にある広い公園へ散歩に行くようになりました。季節の花を見たり、公園の中の喫茶店でお茶を飲んだりして、一人で楽しみます。<br>　先週、散歩をしているとき、音楽が聞こえてきました。最初は、公園の放送だと思いましたが、木の下で男の人がギターの練習をしている音でした。男の人のギターはとても上手でした。<br>　私は男の人のギターを聞いて、自分のバイオリンのことを思い出しました。私は子どものころから大学を卒業するまで、家でよくバイオリンを弾いていました。でも、今のアパートでは弾けません。大きい音を出したら、近所の人にうるさいと思われるからです。でも、公園なら、誰にも遠慮しなくても良さそうです。<br>　今日、私は公園にバイオリンを持って行って、弾いてみました。最初は、人がいる所で弾くのは、恥ずかしかったです。でも、だんだん慣れて、気にならなくなりました。たくさん弾けて、気持ちがよかったです。②<u>いい場所<\/u>が見つかりました。", "image": null, "questions": [{"n": 25, "stem": "どうして「私」は①<u>引っ越しました<\/u>か。", "choices": ["家族と一緒に住みたかったから", "家が会社から遠かったから", "家の近くに広い公園がなかったから", "一人で生活がしたかったから"], "answer": 2, "explain": "文中說「会社に入ったのですが、家から遠かったです」，因為家離公司遠才搬家。"}, {"n": 26, "stem": "「私」が先週、散歩をしているとき、公園で見た男の人は何をしていましたか。", "choices": ["散歩をしていました。", "お茶を飲んでいました。", "音楽を聞いていました。", "ギターを弾いていました。"], "answer": 4, "explain": "文中說「木の下で男の人がギターの練習をしている音でした」，男人在彈吉他。"}, {"n": 27, "stem": "②<u>いい場所<\/u>とありますが、どうして「私」はいいと思っていますか。", "choices": ["誰にも遠慮しないでバイオリンが弾けるから", "バイオリンを教えてくれる人がいるから", "一緒にバイオリンを弾いてくれる人がいるから", "周りにいる人が「私」のバイオリンをほめてくれるから"], "answer": 1, "explain": "在公寓拉琴會吵到鄰居，而「公園なら、誰にも遠慮しなくても良さそう」，所以公園是可以不用顧慮別人拉小提琴的好地方。"}]}]}, {"no": 6, "instruction": "右のページの旅行会社の案内を見て、下の質問に答えてください。答えは、1・2・3・4から、いちばんいいものを一つ選んでください。", "groups": [{"passage": "8月のみどり島一日旅行<br>みどり島で、きれいな海を楽しみませんか。かわいい魚もたくさんいますよ。<br><br>＜予定＞<br>行き：西田駅か今中駅（8時）→今中港（9時）→みどり島（10時）<br>帰り：みどり島（15時）→今中港（16時）→西田駅か今中駅（17時）<br>出発駅は、西田駅か今中駅が選べます。<br><br>料金（出発／おとな料金※1／こども料金※2）<br>西田駅：12,000円／6,000円<br>今中駅：10,000円／5,000円<br>※1　おとな：高校生以上の方<br>※2　こども：小学生、中学生の方（小学生になっていないお子さんは、料金はかかりません。）<br><br>＜予約について＞<br>8/5（土）◎できます<br>8/6（日）×できません<br>8/12（土）×できません<br>8/13（日）○もうすぐいっぱいになります<br>8/19（土）◎できます<br>8/20（日）◎できます<br>8/26（土）×できません<br>8/27（日）◎できます<br><br>ABC旅行　電話：081-666-7711", "image": "img/2023-07_R6_1.jpg", "questions": [{"n": 28, "stem": "石川さんは「8月のみどり島一日旅行」に行きたいと思っています。石川さんは高校生で、出発は今中駅がいいです。石川さんの料金はいくらになりますか。", "choices": ["5,000円", "6,000円", "10,000円", "12,000円"], "answer": 3, "explain": "※1「おとな：高校生以上の方」，高校生要付大人費用；從今中駅出發的大人費用是10,000日圓。"}, {"n": 29, "stem": "ロンさんは友達と3人で「8月のみどり島一日旅行」に行きたいと思っています。ロンさんは、友達の都合も聞いて、メモしました。3人がみんな空いている日で、予約ができるのはいつですか。<br><br>ロンさんのメモ<br>8月の空いている日<br>ソニアさん　5日、12日、19日<br>チョウさん　12日、13日、19日、20日<br>ロン　5日、12日、13日、19日", "choices": ["5日と13日と19日", "12日", "12日と19日", "19日"], "answer": 4, "explain": "三人都有空的是12日和19日；但8/12「できません」，8/19「できます」，所以只有19日。"}]}]}]}, {"name": "聴解", "mondai": [{"no": 1, "instruction": "問題1では、まず質問を聞いてください。それから話を聞いて、問題用紙の1から4の中から、いちばんいいものを一つえらんでください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん<br>夫は何のスパゲッティを作りますか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["トマトと鶏肉のスパゲッティ", "トマトとえびのスパゲッティ", "トマトとキャベツのスパゲッティ", "トマトとえびとキャベツのスパゲッティ"], "answer": 2, "explain": "妻說雞肉晚上要用，改用蝦；高麗菜不放，拿去做沙拉。所以是番茄蝦仁義大利麵。", "script": "家で、夫と妻が話しています。夫は何のスパゲッティを作りますか。<br>夫：もうお昼だね。昼ご飯は庭で採れたトマトを使って、僕がスパゲッティを作るよ。<br>妻：ありがとう。<br>夫：冷蔵庫に鶏肉があるから、トマトと鶏肉のスパゲッティにするね。<br>妻：鶏肉は夜使うから、えびにして。冷蔵庫に入っているよ。<br>夫：わかった。キャベツもあるよ。少し入れる？<br>妻：キャベツを入れなくても、エビとトマトで十分美味しいよ。<br>夫：そうだね。じゃ、キャベツはサラダにするね。<br>夫は何のスパゲッティを作りますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 2, "stem": "2ばん<br>男の人はいくら払わなければなりませんか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["2,000円", "2,200円", "2,300円", "2,500円"], "answer": 4, "explain": "今天是星期日，折價券不能用；而且週六日比平日貴200日圓，所以是2,500日圓。", "script": "スキーの道具をかりる店で、店の人と男の人が話しています。男の人はいくら払わなければなりませんか。<br>店の人：いらっしゃいませ。<br>男：スキーの道具を一日借りたいんですが。あのう、1日2300円の料金が2000円になるチケットをもらったんですけど、使えますか。<br>店の人：すみません。チケットの裏に小さい字が書いてあるんですが、今日は日曜日なので、このチケットは使えないんですよ。<br>男：そうですか。じゃあ、2300円ですね。<br>店の人：あ、2500円です。土曜と日曜は他の曜日より200円高いんです。<br>男：わかりました。<br>店の人：そのチケットで土曜と日曜以外はいつでも2000円になりますから、今度使ってくださいね。<br>男：はい。<br>男の人はいくら払わなければなりませんか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>女の人は明日何を持って行きますか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["カメラと薬", "カメラと傘", "カメラと傘と上着", "カメラと薬と上着"], "answer": 3, "explain": "她接受哥哥借的相機；感冒已好不帶藥；哥哥提醒要帶傘和外套，她說「両方持って行こう」（兩樣都帶）。", "script": "家で女の人とお兄さんが話しています。女の人は明日何を持って行きますか。<br>女の人：お兄ちゃん、私ね、明日友達と山へ行くんだ。<br>お兄さん：じゃあ、僕のカメラを持っていく？<br>女の人：うん、ありがとう。<br>お兄さん：風邪をひいていたけど、大丈夫？薬は持った？<br>女の人：あ、もう治ったから大丈夫。<br>お兄さん：そう。傘入れた？山ではよく雨が降るから。それに、明日は寒くなるから上着は必要だよ。<br>女の人：え、そうなんだ。じゃあ、両方持って行こう。<br>女の人は明日何を持って行きますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん<br>女の人はどのビルに行きますか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["銀行のとなりのビル", "郵便局があるビル（道の左側）", "郵便局の前のビル（道の右側）", "駅の前のビル"], "answer": 3, "explain": "沿銀行前的路直走，左邊有郵局，餐廳在郵局對面（前面）大樓的2樓，也就是道路右側。", "script": "電話で女の人と店の人が話しています。女の人はどのビルに行きますか。<br>女の人：あのう、12時に予約している森田です。<br>店の人：はい、ありがとうございます。<br>女の人：今駅の前にいるんですが、そちらのレストランまでどう行きますか。<br>店の人：銀行が見えますか。<br>女の人：はい。<br>店の人：銀行の前の道をまっすぐくると、左側に郵便局があります。<br>女の人：はい。<br>店の人：その前のビルの2階にあります。<br>女の人：じゃあ、店は道の右側ですね。<br>店の人：はい、そうです。<br>女の人：わかりました。ありがとうございました。<br>女の人はどのビルに行きますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん<br>男の人はまず何をしなければなりませんか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["2階からテーブルを運ぶ", "スーパーで飲み物を買う", "部屋を掃除する", "料理を作る"], "answer": 2, "explain": "女人最後改口：搬桌子放到買完東西之後（不然不好打掃），所以男人要先去超市買飲料。", "script": "家で女の人と男の人が話しています。男の人はまず何をしなければなりませんか。<br>女の人：今日は友達が来るから、準備を始めよう。<br>男の人：そうだね。何をしようか。<br>女の人：まず、部屋の準備ね。2階にあるテーブルを持ってきてくれる？<br>男の人：いいよ。<br>女の人：それから、テーブルを運んだら、スーパーで飲み物を買ってきて。<br>男の人：わかった。<br>女の人：あなたがスーパーへ行っている間、私は掃除をしておくね。<br>男の人：うん。<br>女の人：あ、ごめん。テーブルを運ぶのは買い物の後にしてくれる？掃除しにくいから。料理は全部終わってから一緒に作ろう。<br>男の人：うん、分かった。<br>男の人はまず何をしなければなりませんか。"}]}, {"passage": null, "image": null, "questions": [{"n": 6, "stem": "6ばん<br>女の学生はこの後まず何をしますか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["コピーした資料にペンでページ番号を書く", "新しい資料をもう一度コピーする", "資料を会場の受付に置く", "会場でパソコンの準備をする"], "answer": 2, "explain": "男生說除了頁碼還改了其他地方，請她再印一次（もう一度いい？），她答應了；之後才把資料放到會場櫃檯。電腦男生自己帶。", "script": "電話で男の学生と女の学生が話しています。女の学生はこの後まず何をしますか。<br>男：もしもし。今日の研究会でみんなに渡す資料を昨日メールで送ったんだけど。<br>女：ああ、他の資料と一緒に今コピーしたところだよ。<br>男：ごめん。ページ番号を入れなかったことに気がついて、今入れて、もう一度送ったんだ。<br>女：メール？ちょっと待って。ああ、届いている。もう前のをコピーしてしまったから、ページ番号はペンで書くよ。<br>男：他にも少し直したんだ。ごめん、もう一度いい？<br>女：分かった。資料は会場の受付に置いておくね。<br>男：ありがとう。僕もすぐ向かうよ。パソコンは自分のを持っていくから、準備はいいよ。<br>女：じゃあ、後でね。<br>女の学生はこの後まず何をしますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん<br>社員は明日の会議でどこに集まりますか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["第一会議室", "第二会議室", "第三会議室", "第四会議室"], "answer": 4, "explain": "會議從原定的第一會議室改到第四會議室，因第二會議室的施工會延續，第一、第三會議室可能很吵。", "script": "会社で部長と社員が話しています。社員は明日の会議でどこに集まりますか。<br>部長：皆さん、明日の会議は予定していた第一会議室ではなくて第四会議室で行うことになりました。今日中に終わる予定だった第二会議室の工事は明日も続くことになって、隣の第一、第三会議室は工事の音でうるさいかもしれないからです。では、明日、よろしくお願いします。<br>社員は明日の会議でどこに集まりますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 8, "stem": "8ばん<br>アルバイトの学生は今日何をしなければなりませんか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["レジと、お皿やグラスを片付けること", "レジと、お客様にメニューを出すこと", "お皿やグラスを片付けることと、料理を運ぶこと", "お客様にメニューを出すことと、料理を運ぶこと"], "answer": 1, "explain": "店裡人少時負責收銀，還要收拾桌上的空盤子和杯子；送菜單和端菜今天不用做。", "script": "レストランで、アルバイトの学生と店の人が話しています。アルバイトの学生は今日何をしなければなりませんか。<br>学生：アルバイトの上田です。今日からよろしくお願いします。<br>店の人：お願いします。上田さん、レジは使えますか。<br>学生：前に働いていた店で同じものを使っていました。<br>店の人：じゃあ、この後店が空いたら、レジの係を頼みますね。後で簡単に説明します。<br>学生：はい。<br>店の人：それから、席に空いたお皿やグラスがあったら片付けてください。メニューはほとんどアフリカの料理なんですが、料理の名前はわかりますか。<br>学生：少ししかわからないです。<br>店の人：じゃあ、お客様にメニューを出したり、料理をテーブルに運んだりするのは今日はいいです。<br>学生：わかりました。<br>アルバイトの学生は今日何をしなければなりませんか。"}]}]}, {"no": 2, "instruction": "問題2では、まず質問を聞いてください。そのあと、問題用紙を見てください。読む時間があります。それから話を聞いて、問題用紙の1から4の中から、いちばんいいものを一つえらんでください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん<br>グループ1の学生は何について紹介しますか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["東京の公園", "東京の交通", "東京の祭り", "東京の食べ物"], "answer": 4, "explain": "第1組原本是公園，但學生要求改成調查食物，老師同意了。", "script": "教室で先生が話しています。グループ1の学生は何について紹介しますか。<br>先生：今週と来週の授業では、東京のことを勉強します。昨日はグループで何について調べるか決めましたね。グループ1は東京の公園、グループ2は交通、グループ3は祭りについてでした。じゃあ、今日は図書館に行って、資料を集めましょう。そして、来週の授業で調べたことを紹介してください。<br>学生：先生、私たちのグループは食べ物について調べたいんですが、今から変えてもいいですか。<br>先生：いいですよ。どのグループですか。<br>学生：グループ1です。<br>先生：わかりました。<br>グループ1の学生は何について紹介しますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 2, "stem": "2ばん<br>女の生徒は夏休みに何をしに東京に行きますか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["アニメーションの学校を見学しに行く", "入学の試験を受けに行く", "アニメ映画を見に行く", "アニメのDVDを買いに行く"], "answer": 1, "explain": "她說「東京に行って、アニメーションの学校を見学してくる」；考試是秋天，DVD只是有時間才順便買。", "script": "高校で男の生徒と女の生徒が話しています。女の生徒は夏休みに何をしに東京に行きますか。<br>男：もうすぐ高校最後の夏休みだね。<br>女：うん。私は東京に行って、アニメーションの学校を見学してくる。将来、アニメ映画を作る仕事がしたいけど、この近くには専門の学校がないからね。見て良さそうだったら、入学の試験を秋に受けようと思っている。<br>男：試験を受ける前に見ておくのはいいね。<br>女：うん、時間があったら、アニメのDVDをお土産に買ってくるね。<br>女の生徒は夏休みに何をしに東京に行きますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>今日の漢字の宿題は何課から何課までですか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["12課から14課まで", "15課から17課まで", "10課から20課まで", "12課から17課まで"], "answer": 2, "explain": "昨天是12～14課，今天是15～17課；10～20課是下週一的考試範圍。", "script": "日本語学校で先生が話しています。今日の漢字の宿題は何課から何課までですか。<br>先生：皆さん、漢字の宿題ですが、ええと、昨日はテキストの12課から14課まででしたね。今日は15課から17課までです。いいですか。それから、来週の月曜日に漢字のテストをしますが、10課から20課です。<br>今日の漢字の宿題は何課から何課までですか。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん<br>どうしてスカートを買いませんでしたか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["色が明るすぎるから", "値段が高いから", "長すぎるから", "似合わないから"], "answer": 3, "explain": "媽媽說顏色好、價格也可以，但「やっぱり長さがね」，太長不好活動、上樓梯會踩到。", "script": "デパートで女の子とお母さんが買い物をしています。どうしてスカートを買いませんでしたか。<br>女の子：お母さん、このスカート、どう？<br>お母さん：うん、似合ってるけど、ちょっと長すぎない？<br>女の子：そう？色も明るくて綺麗だし。<br>お母さん：色はね。でも、動きにくそうだし、階段で踏んだら危ないよ。<br>女の子：大丈夫だよ。値段はちょっと高いけど。<br>お母さん：まあ、値段はいいけど、でも、やっぱり長さがね。<br>女の子：うん、分かった。<br>どうしてスカートを買いませんでしたか。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん<br>女の人は誰に腕時計をもらいましたか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["お父さん", "お母さん", "娘", "夫"], "answer": 2, "explain": "手錶是爸爸婚前送給媽媽的，但她是在結婚時由媽媽給她的（母が…くれたんです）。", "script": "会社で女の人と男の人が話しています。女の人は誰に腕時計をもらいましたか。<br>男：中山さん、いい腕時計をしていますね。<br>女：これは、母がずっと使っていた時計で、私が結婚する時にくれたんです。もらった時に初めて聞いたんですけど、この時計は父が結婚する前に母にプレゼントしたものなんだそうです。<br>男：その時計を今中山さんが使っているんだから、お父さんも嬉しいでしょうね。<br>女：私もこの時計をずっと大切にして、娘が大きくなったら渡したいと思っています。<br>女の人は誰に腕時計をもらいましたか。"}]}, {"passage": null, "image": null, "questions": [{"n": 6, "stem": "6ばん<br>男の人は今どんな運動をしていますか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["テニス", "野球", "ジョギング", "散歩"], "answer": 4, "explain": "網球是學生時代、棒球打了20年已停、慢跑只持續一週；現在是邊看街景邊走1小時，已持續2年。網球是下個月才開始。", "script": "ラジオでアナウンサーと男の人が話しています。男の人は今どんな運動をしていますか。<br>アナウンサー：今日は歌手の山田一郎さんに話を伺います。山田さんは一年に100回もコンサートをしているそうですが、体のことを考えて、何か運動をなさっていますか。<br>男：私は運動が大好きです。学生の時はテニスをやっていましたし、卒業した後は友達と野球を20年やっていました。野球をやめてからは、ジョギングを始めたんですが、1週間しか続かなくて、それで、街の景色を見ながら1時間歩くことにしたんです。<br>アナウンサー：1時間の散歩はいい運動ですね。<br>男：ええ、もう2年続けています。あ、この前学生の時の友達に会って、来月から一緒にテニスをやることになりました。今から楽しみです。<br>男の人は今どんな運動をしていますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん<br>今から晩ご飯までにしたらダメなことは何ですか。<br>（原卷選項/圖片未收錄，以下文字選項為整理者依原文自擬）", "choices": ["屋上のプールで泳ぐこと", "温泉に入ること", "湖の近くを散歩すること", "ホテルの外で買い物をすること"], "answer": 2, "explain": "學校預約的溫泉時間在晚餐後，所以現在還不能泡溫泉；游泳池現在就能用，外出散步、買東西只要晚餐前回來即可。", "script": "ホテルで先生が学生たちに話しています。今から晩ご飯までにしたらダメなことは何ですか。<br>先生：皆さん、ホテルに着きました。荷物を部屋に運んで、夕飯まで1時間、自由時間です。屋上のプールは今から利用できます。温泉は学校の予約している時間が夕飯の後なので、まだ入らないようにしてください。近くに湖があるので、散歩するのもいいですが、散歩や買い物など、ホテルの外に出る人は夕飯の時間には戻ってください。<br>今から晩ご飯までにしたらダメなことは何ですか。"}]}]}, {"no": 3, "instruction": "問題3では、えを見ながら質問を聞いてください。やじるし（→）の人は何と言いますか。1から3の中から、いちばんいいものを一つえらんでください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん<br>電車で女の人が切符を落としました。何と言いますか。", "choices": ["拾いましたか。", "無くしました。", "落ちましたよ。"], "answer": 3, "explain": "提醒別人東西掉了，說「落ちましたよ」（掉了喔）。", "script": "電車で女の人が切符を落としました。何と言いますか。<br>1. 拾いましたか。<br>2. 無くしました。<br>3. 落ちましたよ。"}]}, {"passage": null, "image": null, "questions": [{"n": 2, "stem": "2ばん<br>友達が綺麗な山の写真を見ています。山の名前が知りたいです。何と言いますか。", "choices": ["それは山の名前ですか。", "なんという山ですか。", "どういう山についてですか。"], "answer": 2, "explain": "詢問名稱用「何という～ですか」（叫什麼～）。", "script": "友達が綺麗な山の写真を見ています。山の名前が知りたいです。何と言いますか。<br>1. それは山の名前ですか。<br>2. なんという山ですか。<br>3. どういう山についてですか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>約束の場所で先輩が自分を待っています。何と言いますか。", "choices": ["ここで待ってしまいました。", "少し待ちましょうか。", "お待たせしました。"], "answer": 3, "explain": "讓別人等了，見面時說「お待たせしました」（讓您久等了）。", "script": "約束の場所で先輩が自分を待っています。何と言いますか。<br>1. ここで待ってしまいました。<br>2. 少し待ちましょうか。<br>3. お待たせしました。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん<br>もうすぐ昼休みが終わります。みんな教室に戻ったほうがいい時間です。何と言いますか。", "choices": ["教室にもう行った？", "そろそろ行こうか。", "今から行くところだよ。"], "answer": 2, "explain": "邀大家差不多該走了，用「そろそろ行こうか」。", "script": "もうすぐ昼休みが終わります。みんな教室に戻ったほうがいい時間です。何と言いますか。<br>1. 教室にもう行った？<br>2. そろそろ行こうか。<br>3. 今から行くところだよ。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん<br>ソースの瓶が開きません。友達に頼みます。何と言いますか。", "choices": ["ねえ、この瓶、開けられる？", "ねえ、瓶が開いてしまったよ。", "ねえ、このソースをくれない？"], "answer": 1, "explain": "請朋友幫忙打開瓶子，問「開けられる？」（你打得開嗎？）。", "script": "ソースの瓶が開きません。友達に頼みます。何と言いますか。<br>1. ねえ、この瓶、開けられる？<br>2. ねえ、瓶が開いてしまったよ。<br>3. ねえ、このソースをくれない？"}]}]}, {"no": 4, "instruction": "問題4では、えなどがありません。まず文を聞いてください。それから、その返事を聞いて、1から3の中から、いちばんいいものを一つえらんでください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん", "choices": ["どこも行かないんだね。", "楽しかったよ。", "いいね、行こう。"], "answer": 3, "explain": "對方邀約出去玩，回答「いいね、行こう」表示贊成。", "script": "天気もいいし、どこかへ遊びに行かない？<br>1. どこも行かないんだね。<br>2. 楽しかったよ。<br>3. いいね、行こう。"}]}, {"passage": null, "image": null, "questions": [{"n": 2, "stem": "2ばん", "choices": ["面白い人たちですよ。", "予定では12人です。", "いろいろな大学から来ます。"], "answer": 2, "explain": "問「どのくらい」（多少人），回答人數「預定12人」。", "script": "今日のパーティーはどのくらい人が来るんですか。<br>1. 面白い人たちですよ。<br>2. 予定では12人です。<br>3. いろいろな大学から来ます。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん", "choices": ["すぐ行きます。", "今日はくれませんでした。", "ここでですか。"], "answer": 1, "explain": "被請求到會議室幫忙，回答「すぐ行きます」（馬上過去）。", "script": "ちょっと会議室に来て、会場の準備を手伝ってくれますか。<br>1. すぐ行きます。<br>2. 今日はくれませんでした。<br>3. ここでですか。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん", "choices": ["夏休みに旅行したいんです。", "アルバイトは楽しいですから。", "インターネットで見つけました。"], "answer": 3, "explain": "問「どうやって」（用什麼方法）找打工，回答「在網路上找到的」。", "script": "どうやってアルバイトを探しましたか。<br>1. 夏休みに旅行したいんです。<br>2. アルバイトは楽しいですから。<br>3. インターネットで見つけました。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん", "choices": ["漢字を覚えることです。", "いいえ、一番じゃありませんか。", "会話の練習をしています。"], "answer": 1, "explain": "問學日語最辛苦的是什麼，回答「記漢字」。", "script": "日本語の勉強で一番大変だったのは何ですか。<br>1. 漢字を覚えることです。<br>2. いいえ、一番じゃありませんか。<br>3. 会話の練習をしています。"}]}, {"passage": null, "image": null, "questions": [{"n": 6, "stem": "6ばん", "choices": ["店の前にあったんです。", "今来たところです。", "初めて来ました。"], "answer": 3, "explain": "問以前是否來過這家店，回答「初めて来ました」（第一次來）。", "script": "前にこの店に来たことがある？<br>1. 店の前にあったんです。<br>2. 今来たところです。<br>3. 初めて来ました。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん", "choices": ["ナスかトマトはどうですか。", "野菜がいいと思いますよ。", "トマトで何を作ったんですか。"], "answer": 1, "explain": "對方徵求建議種什麼蔬菜，回答具體建議「茄子或番茄如何？」。", "script": "うちの庭で何か野菜をつくってみたいですが、何がいいと思いますか。<br>1. ナスかトマトはどうですか。<br>2. 野菜がいいと思いますよ。<br>3. トマトで何を作ったんですか。"}]}, {"passage": null, "image": null, "questions": [{"n": 8, "stem": "8ばん", "choices": ["甘い方が好き？", "砂糖を少なくしているんだ。", "次作る時はそうするよ。"], "answer": 2, "explain": "被稱讚點心不會太甜，說明原因「有減少糖量」。", "script": "森さん、森さんが作るお菓子はいつも甘すぎなくていいね。<br>1. 甘い方が好き？<br>2. 砂糖を少なくしているんだ。<br>3. 次作る時はそうするよ。"}]}]}]}], "webNoAudio": true}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = (D.level || 'N5').toLowerCase() + '-practice-' + D.id;
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
let S = Object.assign({answers:{}, submitted:false, mode:'practice', tab:'all'}, store.get());
const save = () => store.set(S);
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

// theme
(function(){
  let t; try { t = localStorage.getItem('n5-theme'); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const n = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem('n5-theme', n); } catch(e){}
  };
})();

const SHORT = ['文字・語彙','文法・讀解','聽解'];
const allQ = []; // {key, sec, q, node}
const secNodes = [];

function render(){
  const main = $('#main');
  if (D.notes) main.appendChild(el('div','notes','<b>說明：</b>' + D.notes));
  D.sections.forEach((sec, si) => {
    const sn = el('section','sec-wrap'); sn.dataset.sec = si;
    sn.appendChild(el('h2','sec', sec.name));
    const isL = /聴解|聽解/.test(sec.name);
    if (isL && D.audio) sn.appendChild(player(D.audio, '整份聽解錄音（播放器會固定在上方，可邊聽邊作答）'));
    if (isL && !D.audio && !sec.mondai.some(m => m.audio)) sn.appendChild(el('div','notes', D.webNoAudio ? '線上版因版權因素不含聽解錄音；仍可作答，作答後可展開「聽力原文」閱讀。' : '此卷沒有聽解錄音檔，可作答後展開「聽力原文」閱讀。'));
    sec.mondai.forEach(m => {
      const mn = el('div','mondai');
      mn.appendChild(el('h3', null, 'もんだい ' + m.no));
      if (m.instruction) mn.appendChild(el('p','instr', m.instruction));
      if (m.audio) mn.appendChild(player(m.audio, 'もんだい ' + m.no + ' 錄音'));
      (m.groups || []).forEach(g => {
        const gn = el('div','group');
        if (g.image) { const im = el('img'); im.src = g.image; im.loading = 'lazy'; im.alt = ''; gn.appendChild(im); }
        if (g.passage) gn.appendChild(el('div','passage', g.passage));
        g.questions.forEach(q => {
          const key = si + '-' + m.no + '-' + q.n;
          const qn = el('div','q'); qn.dataset.key = key;
          qn.appendChild(el('p','stem', '<span class="qn">' + q.n + '</span>' + (q.stem || '')));
          const cs = el('div','choices');
          const longest = Math.max(...q.choices.map(c => c.replace(/<[^>]+>/g,'').length));
          if (longest > 14) cs.classList.add('long');
          q.choices.forEach((c, ci) => {
            const b = el('button','ch','<span class="k">' + (ci+1) + '</span><span>' + c + '</span>');
            b.onclick = () => pick(key, ci+1);
            cs.appendChild(b);
          });
          qn.appendChild(cs);
          const fb = el('div','fb');
          let inner = '<span class="verdict"></span>';
          if (q.explain) inner += '<div class="ex">' + q.explain + '</div>';
          fb.innerHTML = inner;
          if (q.script) { const d = el('details','script','<summary>聽力原文</summary><div>' + q.script + '</div>'); fb.appendChild(d); }
          qn.appendChild(fb);
          gn.appendChild(qn);
          allQ.push({key, sec: si, q, node: qn, group: gn, mondai: mn});
        });
        mn.appendChild(gn);
      });
      sn.appendChild(mn);
    });
    main.appendChild(sn);
    secNodes.push(sn);
  });
  main.appendChild(el('div','result hidden')).id = 'result';

  const tabs = $('#tabs');
  const mk = (id, label) => { const b = el('button','tab', label); b.dataset.tab = id; b.onclick = () => { S.tab = id; save(); refresh(); scrollTo(0,0); }; tabs.appendChild(b); };
  mk('all','全部');
  D.sections.forEach((s, i) => mk(String(i), SHORT[i] || s.name));
}

function player(src, hint){
  const a = el('div','audio');
  const au = document.createElement('audio');
  au.controls = true; au.preload = 'none'; au.src = encodeURI(src);
  a.appendChild(au);
  a.appendChild(el('span','hint', hint));
  au.onerror = () => { a.querySelector('.hint').textContent = '找不到錄音檔，請確認 mp3 仍在原資料夾：' + src; };
  return a;
}

function pick(key, v){
  if (S.submitted) return;
  if (S.mode === 'practice' && S.answers[key] != null) return; // 練習模式：作答後鎖定
  S.answers[key] = v; save(); refresh();
}

function refresh(){
  $('#mode').value = S.mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  secNodes.forEach((n, i) => n.classList.toggle('hidden', S.tab !== 'all' && String(i) !== S.tab));
  const reveal = S.mode === 'practice' || S.submitted;
  const wrongOnly = $('#wrongOnly').checked;
  let done = 0, right = 0, total = 0;
  allQ.forEach(o => {
    const a = S.answers[o.key];
    const inTab = S.tab === 'all' || String(o.sec) === S.tab;
    if (inTab) { total++; if (a != null) done++; if (a === o.q.answer) right++; }
    const show = a != null && reveal;
    o.node.querySelectorAll('.ch').forEach((b, i) => {
      b.classList.remove('picked','right','wrong');
      if (show) {
        if (i+1 === o.q.answer) b.classList.add('right');
        else if (i+1 === a) b.classList.add('wrong');
      } else if (a === i+1) b.classList.add('picked');
    });
    const fb = o.node.querySelector('.fb');
    fb.classList.toggle('show', show);
    if (show) {
      const v = fb.querySelector('.verdict');
      const ok = a === o.q.answer;
      v.className = 'verdict ' + (ok ? 'ok' : 'ng');
      v.textContent = ok ? '✓ 正確' : '✗ 答錯了，正確答案是 ' + o.q.answer;
    }
    const hideIt = wrongOnly && reveal && (a === o.q.answer || a == null);
    o.node.classList.toggle('hidden', hideIt);
  });
  // 隱藏整組 / 整個 もんだい 若其中的題目都被隱藏
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('hidden', [...g.querySelectorAll('.q')].every(q => q.classList.contains('hidden'))));
  document.querySelectorAll('.mondai').forEach(m => m.classList.toggle('hidden', [...m.querySelectorAll('.group')].every(g => g.classList.contains('hidden'))));
  $('#score').innerHTML = reveal
    ? '已作答 <b>' + done + '</b> / ' + total + '　答對 <b>' + right + '</b>' + (done ? '（' + Math.round(right/done*100) + '%）' : '')
    : '已作答 <b>' + done + '</b> / ' + total + '（交卷後顯示成績）';
  $('#submit').classList.toggle('hidden', S.mode !== 'exam' || S.submitted);
  renderResult(reveal);
  const h = document.querySelector('header.top').offsetHeight;
  document.documentElement.style.setProperty('--hdr', (h + 8) + 'px');
}

function renderResult(reveal){
  const r = $('#result');
  if (!reveal || !Object.keys(S.answers).length) { r.classList.add('hidden'); return; }
  r.classList.remove('hidden');
  let rows = '';
  D.sections.forEach((s, i) => {
    const qs = allQ.filter(o => o.sec === i);
    const ok = qs.filter(o => S.answers[o.key] === o.q.answer).length;
    const dn = qs.filter(o => S.answers[o.key] != null).length;
    rows += '<tr><td>' + s.name + '</td><td class="num">' + ok + ' / ' + qs.length + '</td><td class="num">' + dn + ' 題已答</td></tr>';
  });
  const ok = allQ.filter(o => S.answers[o.key] === o.q.answer).length;
  r.innerHTML = '<b>成績統計</b><table>' + rows + '<tr><th>合計</th><th class="num">' + ok + ' / ' + allQ.length + '</th><th></th></tr></table>';
}

$('#mode').onchange = e => { S.mode = e.target.value; save(); refresh(); };
$('#wrongOnly').onchange = refresh;
$('#submit').onclick = () => {
  const left = allQ.filter(o => S.answers[o.key] == null).length;
  if (left && !confirm('還有 ' + left + ' 題未作答，確定要交卷嗎？')) return;
  S.submitted = true; save(); refresh(); scrollTo(0,0);
};
$('#reset').onclick = () => {
  if (!confirm('清除本卷所有作答紀錄？')) return;
  S.answers = {}; S.submitted = false; save(); $('#wrongOnly').checked = false; refresh();
};
render(); refresh();
</script>
</body>
</html>
