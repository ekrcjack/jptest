<!doctype html>

<title>N4 2013年7月 真題</title>
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#6b7078; --line:#e3dfd6;
  --accent:#b8412e; --accent-soft:#f6e3df; --ok:#1f7a4d; --ok-soft:#dff1e7; --ng:#b3261e; --ng-soft:#f9e0de;
  --chip:#efebe3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
    --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
  --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","PingFang TC","Noto Sans TC",sans-serif}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.bar h1{font-size:18px;margin:0;flex:1 1 auto;white-space:nowrap}
.bar h1 a{text-decoration:none;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.score{font-size:14px;color:var(--muted)}
.score b{color:var(--ink)}
select.btn{padding:5px 8px}
main{padding:16px 0 120px}
.notes{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
h2.sec{font-size:20px;margin:28px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.mondai{margin:22px 0 10px}
.mondai h3{font-size:16px;margin:0 0 4px;color:var(--accent)}
.instr{font-size:14px;color:var(--muted);margin:0 0 10px}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.passage{background:var(--chip);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}
.group img{max-width:100%;height:auto;display:block;margin:4px auto 12px;border-radius:6px;background:#fff}
.q{padding:10px 0;border-top:1px dashed var(--line)}
.group .q:first-of-type{border-top:0}
.stem{margin:0 0 8px}
.qn{display:inline-block;min-width:28px;padding:0 6px;margin-right:8px;border:1.5px solid var(--ink);border-radius:4px;text-align:center;font-weight:700;font-size:14px;line-height:22px}
.stem u{text-decoration-thickness:1.5px;text-underline-offset:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.choices.long{grid-template-columns:1fr}
.ch{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.ch:hover{border-color:var(--muted)}
.ch .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-top:3px}
.ch.picked{border-color:var(--ink);background:var(--chip)}
.ch.picked .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{border-color:var(--ng);background:var(--ng-soft)}
.ch.wrong .k{background:var(--ng);border-color:var(--ng);color:#fff}
.fb{margin-top:8px;font-size:14.5px;border-left:3px solid var(--line);padding:4px 0 4px 10px;display:none}
.fb.show{display:block}
.fb .verdict{font-weight:700}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.ng{color:var(--ng)}
details.script{margin-top:6px}
details.script summary{cursor:pointer;color:var(--muted);font-size:14px}
details.script div{background:var(--chip);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:14.5px}
.audio{position:sticky;top:var(--hdr,96px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.audio audio{flex:1 1 260px;width:100%}
.audio .hint{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.result{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin:20px 0}
.result table{border-collapse:collapse;width:100%;font-size:14.5px}
.result td,.result th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.result td.num{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.choices{grid-template-columns:1fr 1fr}.bar h1{font-size:16px}}
</style>
</head>

＝くも；ほし是「星」、つき是「月」、そら是「空」。"}, {"n": 9, "stem": "まいあさ <u>近所<\/u>の こうえんで ジョギングを しています。", "choices": ["きんじょ", "ちかじょ", "きんじょう", "ちかじょう"], "answer": 1, "explain": "句意：我每天早上在附近的公園慢跑。「近」音讀きん、「所」讀じょ（連濁），近所＝きんじょ。"}]}]}, {"no": 2, "instruction": "＿＿＿の ことばは どう かきますか。1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 10, "stem": "この <u>くすり<\/u>は いくらですか。", "choices": ["果", "楽", "菓", "薬"], "answer": 4, "explain": "句意：這種藥多少錢？くすり＝薬（藥品）；果是果實、楽是輕鬆、菓是點心。"}, {"n": 11, "stem": "きのうは 9時に <u>おきました<\/u>。", "choices": ["赴きました", "題きました", "起きました", "匙きました"], "answer": 3, "explain": "句意：我昨天9點起床。おきる＝起きる（起床）；赴く讀おもむく（前往），其他為干擾項。"}, {"n": 12, "stem": "<u>だんせい<\/u>の おてあらいは あちらです。", "choices": ["男姓", "女性", "男性", "女姓"], "answer": 3, "explain": "句意：男廁在那邊。だんせい＝男性；女性讀じょせい，「姓」為干擾字。"}, {"n": 13, "stem": "この スイッチを <u>おせば<\/u>、電気が つきます。", "choices": ["伸せば", "挿せば", "押せば", "坤せば"], "answer": 3, "explain": "句意：按下這個開關，燈就會亮。おす＝押す（按、壓）；伸びる是伸長、挿す是插入。"}, {"n": 14, "stem": "国の りょうしんに にもつを <u>おくりました<\/u>。", "choices": ["込りました", "返りました", "速りました", "送りました"], "answer": 4, "explain": "句意：我把行李寄給了國內的父母。おくる＝送る（寄、送）；込める是包含、返る是歸還、速める是加快。"}, {"n": 15, "stem": "あには 車の <u>うんてん<\/u>が できます。", "choices": ["運転", "運軽", "連転", "連軽"], "answer": 1, "explain": "句意：我哥哥會開車。うんてん＝運転（駕駛），其他為字形相近的干擾項。"}]}]}, {"no": 3, "instruction": "（　）に なにを いれますか。1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 16, "stem": "とても 行きたかったのに、りょこうが ちゅうしに なって、（　）です。", "choices": ["ざんねん", "ふべん", "だめ", "しんぱい"], "answer": 1, "explain": "句意：明明很想去，旅行卻取消了，真遺憾。ざんねん（残念）＝遺憾；ふべん是不方便、だめ是不行、しんぱい是擔心。"}, {"n": 17, "stem": "なくした かぎを（　）けど、どこにも ないんです。", "choices": ["しらべた", "さがした", "みつけた", "あつめた"], "answer": 2, "explain": "句意：我找了弄丟的鑰匙，但哪裡都沒有。さがす（探す）＝尋找；みつける是找到，與後文矛盾。"}, {"n": 18, "stem": "スポーツの あとで シャワーを あびるのは（　）が いいです。", "choices": ["ぐあい", "こころ", "きもち", "げんき"], "answer": 3, "explain": "句意：運動後沖個澡很舒服。きもちがいい（気持ちがいい）＝舒服；ぐあい是狀況、げんき是精神。"}, {"n": 19, "stem": "日本へ りょこうに 行った とき、いろいろな（　）を しました。", "choices": ["けいけん", "おもいで", "おみやげ", "きょうみ"], "answer": 1, "explain": "句意：去日本旅行時，有了各種經驗。けいけん（経験）をする＝體驗；おもいで是回憶、おみやげ是伴手禮、きょうみ是興趣。"}, {"n": 20, "stem": "雨が ふっているので、さんぽに 行くのは（　）。", "choices": ["とじました", "すてました", "しめました", "やめました"], "answer": 4, "explain": "句意：因為在下雨，所以不去散步了。やめる（止める）＝放棄、作罷；とじる・しめる是關閉、すてる是丟棄。"}, {"n": 21, "stem": "にもつが 多いので、やまださんが ひっこしを（　）くれました。", "choices": ["はこんで", "てつだって", "かたづけて", "つつんで"], "answer": 2, "explain": "句意：因為行李很多，山田先生來幫我搬家。てつだう（手伝う）＝幫忙；はこぶ是搬運、かたづける是整理、つつむ是包。"}, {"n": 22, "stem": "もりさんに、先週 学校に 来なかった（　）を 聞きました。", "choices": ["れんらく", "りゆう", "いけん", "そうだん"], "answer": 2, "explain": "句意：問了森同學上週沒來學校的原因。りゆう（理由）＝理由；れんらく是聯絡、いけん是意見、そうだん是商量。"}, {"n": 23, "stem": "どうぞ（　）しないで、たくさん 食べて ください。", "choices": ["しつれい", "えんりょ", "ちゅうい", "はんたい"], "answer": 2, "explain": "句意：請不要客氣，多吃一點。えんりょ（遠慮）＝客氣；しつれい是失禮、ちゅうい是注意、はんたい是反對。"}, {"n": 24, "stem": "えさを やったり、さんぽに つれて いったり、毎日 犬の（　）を して います。", "choices": ["せわ", "うんどう", "ようい", "しゅうかん"], "answer": 1, "explain": "句意：餵食、帶去散步，我每天照顧狗。せわ（世話）をする＝照顧；うんどう是運動、ようい是準備、しゅうかん是習慣。"}, {"n": 25, "stem": "ねつが あるので、びょういんに（　）から 会社に 行きます。", "choices": ["もどって", "よって", "まがって", "かよって"], "answer": 2, "explain": "句意：因為發燒，先順路去醫院再去公司。よる（寄る）＝順路去；もどる是返回、まがる是轉彎、かよう是往來。"}]}]}, {"no": 4, "instruction": "＿＿＿の ぶんと だいたい おなじ いみの ぶんが あります。1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 26, "stem": "おとうとは あそこで <u>アルバイトを しています<\/u>。", "choices": ["おとうとは あそこで まっています。", "おとうとは あそこで やすんでいます。", "おとうとは あそこで あそんでいます。", "おとうとは あそこで はたらいています。"], "answer": 4, "explain": "句意：弟弟在那裡打工。アルバイト＝打工，與「はたらいています（在工作）」意思最接近。"}, {"n": 27, "stem": "あの 人は ほんとうに <u>うつくしいですね<\/u>。", "choices": ["あの 人は ほんとうに きれいですね。", "あの 人は ほんとうに おもしろいですね。", "あの 人は ほんとうに わかいですね。", "あの 人は ほんとうに かわいいですね。"], "answer": 1, "explain": "句意：那個人真美啊。うつくしい（美しい）＝きれい（漂亮）。"}, {"n": 28, "stem": "<u>あの 店は すいて います<\/u>。", "choices": ["あの 店は しなものが 少ないです。", "あの 店は おきゃくさんが 多いです。", "あの 店は おきゃくさんが 少ないです。", "あの 店は しなものが 多いです。"], "answer": 3, "explain": "句意：那家店現在很空。すく（空く）＝空、人少，即「客人很少」。"}, {"n": 29, "stem": "<u>この シャワーは ぬるいです<\/u>。", "choices": ["この シャワーは あつくないです。", "この シャワーは あついです。", "この シャワーは つよいです。", "この シャワーは つよくないです。"], "answer": 1, "explain": "句意：這蓮蓬頭的水是溫的。ぬるい＝溫溫的、不夠熱，即「あつくない（不燙）」。"}, {"n": 30, "stem": "<u>友だちに 日本の りょうりを おそわりました<\/u>。", "choices": ["友だちに 日本の りょうりを もらいました。", "友だちに 日本の りょうりを おしえました。", "友だちに 日本の りょうりを あげました。", "友だちに 日本の りょうりを ならいました。"], "answer": 4, "explain": "句意：我向朋友學了日本料理。おそわる（教わる）＝跟著某人學習，與「ならう（習う）」同義。"}]}]}, {"no": 5, "instruction": "つぎの ことばの つかいかたで いちばん いい ものを 1・2・3・4から ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 31, "stem": "けしき", "choices": ["先週 えきまえに できた 店は、中の <u>けしき<\/u>が とても あかるいです。", "わたしは かぞくの たのしそうな <u>けしき<\/u>を いつも ビデオで とっています。", "この まちは 山も 川も あって、<u>けしき<\/u>がとても いいです。", "子どもの <u>けしき<\/u>が へんだったので、びょういんに つれて いきました。"], "answer": 3, "explain": "けしき（景色）意為「風景」。選項3「這個城市有山有水，風景很好」正確；1應為「雰囲気」、2應為「姿」、4應為「様子」。"}, {"n": 32, "stem": "おどろく", "choices": ["みんなの 前で 話す とき、いつも <u>おどろいて<\/u> じょうずに 話せません。", "やまださんの おにいさんが ゆうめいな かしゅだと 聞いて、<u>おどろき<\/u>ました。", "ねる 前に コーヒーを 飲むと、<u>おどろいて<\/u> ねむれません。", "あしたは はじめての デートなので、いまから <u>おどろいて<\/u> います。"], "answer": 2, "explain": "おどろく（驚く）意為「驚訝」。選項2「聽說山田的哥哥是有名歌手，很驚訝」正確；1應為「緊張する」、3應為「興奮する」、4應為「どきどきする」。"}, {"n": 33, "stem": "ひろう", "choices": ["みちが わからなく なったので、かばんから ちずを <u>ひろいました<\/u>。", "すみません、たなの 上の はこを <u>ひろって<\/u> くれませんか。", "木から りんごを <u>ひろって<\/u>、ふくろに 入れました。", "小学生が ごみを <u>ひろって<\/u>、こうえんを そうじして います。"], "answer": 4, "explain": "ひろう（拾う）意為「撿、拾」。選項4「小學生撿垃圾打掃公園」正確；1應為「取り出す」、2應為「取る」、3應為「摘む（つむ）」。"}, {"n": 34, "stem": "しょうたい", "choices": ["119ばんに 電話して、きゅうきゅうしゃを いえに <u>しょうたい<\/u>してください。", "ぶちょうに <u>しょうたい<\/u>されて、休みの 日に 会社に 行きました。", "大学の こうはいを けっこんしきに <u>しょうたい<\/u>する つもりです。", "いしゃに <u>しょうたい<\/u>されて、あしたから にゅういんする ことに なりました。"], "answer": 3, "explain": "しょうたい（招待）意為「邀請、招待」。選項3「打算邀請大學學弟妹參加婚禮」正確；1應為「呼ぶ」、2應為「要求する」、4應為「注意する」之類。"}, {"n": 35, "stem": "わたす", "choices": ["毎日 にわの 花に 水を <u>わたして<\/u> います。", "この きっぷは、かいさつぐちを 出る とき、えきいんに <u>わたして<\/u> ください。", "この てがみを ポストに <u>わたして<\/u> きて ください。", "わたしは いつも こうちゃに さとうと ぎゅうにゅうを <u>わたします<\/u>。"], "answer": 2, "explain": "わたす（渡す）意為「交、遞給」。選項2「出剪票口時請把票交給站務員」正確；1應為「やる」、3・4應為「入れる」。"}]}]}]}, {"name": "言語知識（文法）・読解", "mondai": [{"no": 1, "instruction": "（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "母が 育てた トマト（　）ジュースを 作りました。", "choices": ["で", "に", "へ", "や"], "answer": 1, "explain": "句意：我用媽媽種的番茄做了果汁。「で」表示手段、材料，意為「用……做」。"}, {"n": 2, "stem": "この かばんは 軽いから、旅行（　）便利です。", "choices": ["と", "を", "に", "の"], "answer": 3, "explain": "句意：這個包包很輕，旅行時很方便。「Nに便利」的「に」表示評價、判斷的基準。"}, {"n": 3, "stem": "（教室で）<br>先生「じゃあ、一人（　）じこしょうかいを して ください。」", "choices": ["など", "ずつ", "しか", "も"], "answer": 2, "explain": "句意：（教室裡）老師：「那麼，請一個一個自我介紹。」「ずつ」表示「每、各」；など是等等、しか是只、も是也。"}, {"n": 4, "stem": "（料理教室で）<br>先生「今日は だれ（　）かんたんに 作れる ケーキの 作り方を 教えます。」", "choices": ["で", "は", "でも", "なら"], "answer": 3, "explain": "句意：今天教大家誰都能簡單做出的蛋糕做法。「疑問詞＋でも」表示全面肯定，意為「無論……都」。"}, {"n": 5, "stem": "いっしょうけんめい 勉強して、（　）外国の 大学に 行きたいです。", "choices": ["すっかり", "たぶん", "やっと", "いつか"], "answer": 4, "explain": "句意：拼命學習，希望總有一天能去國外的大學。いつか＝總有一天；すっかり是完全、たぶん是大概、やっと是好不容易。"}, {"n": 6, "stem": "今朝、ねぼうして しまったので、学校まで 走っていったが、（　）ちこくした。", "choices": ["かならず", "ときどき", "そろそろ", "やはり"], "answer": 4, "explain": "句意：今早睡過頭，雖然一路跑到學校，但還是遲到了。やはり＝仍然、果然；かならず是一定、ときどき是有時、そろそろ是差不多該。"}, {"n": 7, "stem": "（電話で）<br>A「もしもし、これから（　）に 行くよ。」<br>B「じゃあ、駅に 着いたら、電話を ください。私の 家は 駅から 遠いので、車で むかえに 行きます。」", "choices": ["こっち", "そっち", "あっち", "どっち"], "answer": 2, "explain": "句意：A「喂，我現在去你那邊。」指離聽話者近的地方用「そっち」；こっち是說話者這邊、あっち是雙方都遠、どっち是哪邊。"}, {"n": 8, "stem": "あしたは 朝、会議が あるから、（　）家を 出ます。", "choices": ["早くて", "早く", "早い", "早いと"], "answer": 2, "explain": "句意：明天早上要開會，所以要早點出門。い形容詞修飾動詞時，詞尾い變成く：早く。"}, {"n": 9, "stem": "田中さんは 体が 大きくて こわそう（　）、本当は こわくありません。", "choices": ["し", "だし", "だけれど", "けれど"], "answer": 3, "explain": "句意：田中先生身材高大，看起來很可怕，但其實並不可怕。「そう」是樣態助動詞，接逆接要用「そうだけれど」；し・だし表示並列。"}, {"n": 10, "stem": "インターネットラジオを（　）ために、パソコンを 買いました。", "choices": ["聞きます", "聞こう", "聞く", "聞ける"], "answer": 3, "explain": "句意：為了聽網路廣播，買了電腦。「〜ために」表示目的時前接動詞辭書形：聞く。"}, {"n": 11, "stem": "もらった りんごを ジャムに（　）食べました。", "choices": ["して", "されて", "なって", "なれて"], "answer": 1, "explain": "句意：把收到的蘋果做成果醬吃了。「Nにする」表示人為使之變化，主語是「我」，用主動的「して」。"}, {"n": 12, "stem": "最近、私は 仕事が いそがしくて、なかなか ともだちと（　）。", "choices": ["会える", "会えない", "会う", "会った"], "answer": 2, "explain": "句意：我最近工作很忙，一直沒辦法和朋友見面。「なかなか〜ない」表示怎麼也無法，用可能形否定「会えない」。"}, {"n": 13, "stem": "山本「田中さん、元気が ありませんね。どう（　）か。」<br>田中「ええ、かぜを ひきました。」", "choices": ["でしょう", "なります", "します", "したんです"], "answer": 4, "explain": "句意：山本：「田中，你看起來沒精神，怎麼了？」「どうしたんですか」用來詢問對方發生了什麼事。"}, {"n": 14, "stem": "こども「ご飯 まだ？」<br>母「うん。今から（　）だよ。」", "choices": ["作るところ", "作って いるところ", "作るとき", "作って いるとき"], "answer": 1, "explain": "句意：孩子：「飯還沒好嗎？」母親：「嗯，現在正要開始做。」「動詞辭書形＋ところ」表示正要做某事；「ているところ」是正在做。"}, {"n": 15, "stem": "田中「木村さん、荷物が 重そうだね。（　）。」<br>木村「ありがとうございます。」", "choices": ["てつだいたいんですか", "てつだって くださいよ", "てつだったよ", "てつだおうか"], "answer": 4, "explain": "句意：田中：「木村，你的行李好像很重。我來幫忙吧？」「〜おうか」表示主動提議「我來……吧」。"}]}]}, {"no": 2, "instruction": "★に 入る ものは どれですか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 16, "stem": "れいぞうこに ＿＿＿ ＿＿＿ ★ ＿＿＿ ので、食べました。", "choices": ["ケーキが", "父が", "買って きた", "残って いた"], "answer": 1, "explain": "正確語序：れいぞうこに 父が 買って きた ケーキが 残って いた ので、食べました（冰箱裡還有爸爸買回來的蛋糕，我就吃了）。★為「ケーキが」。"}, {"n": 17, "stem": "大事な ＿＿＿ ＿＿＿ ★ ＿＿＿ が かかって きた。", "choices": ["電話", "とちゅう", "話の", "で"], "answer": 4, "explain": "正確語序：大事な 話の とちゅう で 電話 が かかって きた（正在談重要的事時，電話打來了）。★為「で」。「〜とちゅうで」表示在……途中。"}, {"n": 18, "stem": "（学校で）<br>先生「ろうかが ぬれて います。歩く ＿＿＿ ＿＿＿ ★ ＿＿＿ して ください。」", "choices": ["ように", "注意", "ときは", "すべらない"], "answer": 1, "explain": "正確語序：歩く ときは すべらない ように 注意 して ください（走廊是濕的，走路時請注意不要滑倒）。★為「ように」。"}, {"n": 19, "stem": "来週、会社の ＿＿＿ ＿＿＿ ★ ＿＿＿ しました。", "choices": ["近くに", "する", "ことに", "ひっこしを"], "answer": 2, "explain": "正確語序：会社の 近くに ひっこしを する ことに しました（決定下週搬到公司附近）。★為「する」。「〜ことにする」表示決定。"}, {"n": 20, "stem": "北町に ＿＿＿ ＿＿＿ ★ ＿＿＿ そうです。", "choices": ["和食の お店は", "「さくら」と いう", "有名だ", "ある"], "answer": 1, "explain": "正確語序：北町に ある 「さくら」と いう 和食の お店は 有名だ そうです（聽說北町一家名為「櫻花」的日料店很有名）。★為「和食の お店は」。"}]}]}, {"no": 3, "instruction": "21から25に 何を 入れますか。文章の 意味を 考えて、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "下の 文章は 韓国で 日本語を 勉強して いる イムさんの 作文です。<br><br><b>夏休みの予定<\/b>　　イム ユリ<br>もうすぐ 大学生活で 初めての 夏休みです。大学の 夏休みは 長いので、いろいろな ことを（ 21 ）。<br>まず、本を 読みます。いつも 学校の 勉強が たいへんで、好きな 本を 読む 時間が ありません。夏休み（ 22 ）好きな本を たくさん 読む つもりです。<br>（ 23 ）、初めて アルバイトを します。兄が 働いて いる 花屋です。兄に しょうかいして（ 24 ）、初めてなので 少し 心配ですが、がんばります。<br>そして、日本に 旅行に 行きます。旅行中、たくさん 日本語を 使うつもりです。<br>大学 1 年生の 夏休みは 1 回だけです。いろいろな 経験を して、初めての 夏休みを（ 25 ）。", "image": null, "questions": [{"n": 21, "stem": "（ 21 ）", "choices": ["していたのです", "するようになりました", "しようと 思います", "する予定だからです"], "answer": 3, "explain": "前文說大學暑假很長，後面接自己的暑假計畫；「ようと思う」表示「打算做某事」，最符合文意。"}, {"n": 22, "stem": "（ 22 ）", "choices": ["には", "にも", "からも", "までは"], "answer": 1, "explain": "平時太忙沒時間讀書，打算暑假時多讀；「には」表示在某個時間，「は」用來強調暑假這段時間。"}, {"n": 23, "stem": "（ 23 ）", "choices": ["では", "それから", "たとえば", "ですから"], "answer": 2, "explain": "本段說明作者的另一項計畫（打工），與上一段為並列關係，用「それから（其次、然後）」。"}, {"n": 24, "stem": "（ 24 ）", "choices": ["くれました", "あげました", "もらいました", "やりました"], "answer": 3, "explain": "是哥哥介紹我去他工作的花店，我是受惠的一方（省略主語「我」），用「〜てもらいました」。"}, {"n": 25, "stem": "（ 25 ）", "choices": ["楽しむそうです", "楽しんで います", "楽しむようです", "楽しみたいです"], "answer": 4, "explain": "作者表達希望好好享受第一個暑假的願望，「〜たい」表示說話者想做某事，最符合文意。"}]}]}, {"no": 4, "instruction": "つぎの（1）から（4）の 文章を 読んで、質問に 答えて ください。答えは、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "（1）<br>私はきれいな切手をたくさん集めています。手紙を出すときは、書いたことに関係がある切手を選んで、封筒にはります。例えば、海で泳いだことを書いたときは、魚の切手をはります。手紙を読む人に、切手も楽しんでもらいたいからです。", "image": null, "questions": [{"n": 26, "stem": "魚の切手をはるのは、どうしてですか。", "choices": ["手紙に、海に関係があることを書いたから", "魚の切手を集めることが趣味だから", "手紙を読む人が、海が好きだから", "魚の切手はとてもきれいだから"], "answer": 1, "explain": "關鍵在第二句：寫信時會選與信件內容相關的郵票，寫了在海裡游泳的事就貼魚的郵票。"}]}, {"passage": "（2）<br>真一さんの家のテーブルの上に、このメモと封筒があります。<br><br>真一へ<br>お帰りなさい。<br>今日は、おじいちゃんの家に寄ってから、家に帰ります。8時ごろには家に着くと思います。晩ご飯はピザです。7時ごろ、ピザ屋さんがピザを持ってくるので、封筒の中のお金を渡してください。<br>ピザを食べて、待っていてください。<br>母", "image": null, "questions": [{"n": 27, "stem": "このメモを読んで、真一さんがしなければならないことは何ですか。", "choices": ["お母さんが帰る前に、ピザ屋でピザを食べます。", "ピザ屋に行って、8時ごろまでに家に帰ります。", "ピザ屋が来たら、封筒の中にあるお金を払います。", "お母さんが帰るまで、ピザを食べないで待ちます。"], "answer": 3, "explain": "母親說7點左右披薩店會送披薩來，請把信封裡的錢交給對方，並先吃披薩等她回家。"}]}, {"passage": "（3）<br>夏川大学で、日本で働きたいという留学生85人になぜ日本で働きたいか聞きました。<br>一番多かった理由は「日本語を使う仕事がしたい」で、次は「働きながら、日本の技術を勉強したい」でした。三番目は「日本にずっと住みたい」で、「お金がたくさんもらえる」は一番少なくて、5人でした。", "image": null, "questions": [{"n": 28, "stem": "日本で働きたい理由について、どんなことがわかりますか。", "choices": ["日本語が上手になりたいから、という人が一番多い。", "日本の技術を勉強したいから、という人が二番目に多い。", "日本にずっと住みたいから、という人は5人だった。", "お金をたくさんもらえるから、という人は三番目に多い。"], "answer": 2, "explain": "第一是想做使用日語的工作，第二是想邊工作邊學日本技術，第三是想一直住在日本，最少的是能賺很多錢（5人）。"}]}, {"passage": "（4）<br>これは石田先生からチンさんに届いたメールです。<br><br>チンさん<br>私は9月3日から15日まで仕事で外国に行くことになりました。<br>「留学生新聞」に出す作文は、8月中に私にメールで送ってください。<br>出発までにチェックして返しますから、私が戻るまでに直しておいてください。<br>「留学生新聞」には、9月20日ごろ送りましょう。<br>石田", "image": null, "questions": [{"n": 29, "stem": "このメールを見て、チンさんはどうしなければなりませんか。", "choices": ["8月15日までに石田先生に作文を送って、9月3日までに直しておきます。", "8月15日までに石田先生に作文を送って、9月15日までに直しておきます。", "8月31日までに石田先生に作文を送って、9月3日までに直しておきます。", "8月31日までに石田先生に作文を送って、9月15日までに直しておきます。"], "answer": 4, "explain": "石田老師9月3日到15日出國，要小陳在8月內（8月31日前）寄出作文，並在老師回來（15日）之前改好。"}]}]}, {"no": 5, "instruction": "つぎの 文章を 読んで、質問に 答えて ください。答えは、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "わたしが、初めて自分が少し大人になったと思ったのは、10歳のときでした。とてもうれしかったことを今でもよく覚えています。<br>10歳になるまで、わたしは毎年、姉と一緒に両親の誕生日プレゼントを選んでいました。しかし10歳になって、母の誕生日プレゼントについて姉と話しているとき、姉が「今年は一人で選んでみる？」と言いました。わたしはびっくりしましたが、少し考えてから「うん。」と答えました。そして、プレゼントを選びに、一人で本屋に行ったり、花屋に行ったりしました。<br>母の誕生日の前の日曜日に、わたしはスーパーに行って、ハンカチを一枚買いました。母の好きな花の絵がかいてあるハンカチでした。母が喜んでくれるかどうか心配でしたが、母はハンカチを見て「とてもきれいね。ありがとう。」と言いました。わたしはとても<u>安心しました<\/u>。姉もにこにこしながら、「よかったね。」と言ってくれました。<br>もう子どもじゃないと思ったときの思い出です。", "image": null, "questions": [{"n": 30, "stem": "「わたし」は10歳のとき、母の誕生日プレゼントをどうやって選びましたか。", "choices": ["自分一人で選びました。", "姉と一緒に選びました。", "姉に何がいいか聞いて選びました。", "母に何がいいか聞いて選びました。"], "answer": 1, "explain": "10歲時姊姊說「今年要不要一個人選看看？」，「我」答應後一個人去選了禮物。"}, {"n": 31, "stem": "「わたし」は母に何をプレゼントしましたか。", "choices": ["本", "花", "花の絵", "ハンカチ"], "answer": 4, "explain": "關鍵句「スーパーに行って、ハンカチを一枚買いました」，最後選了手帕當禮物。"}, {"n": 32, "stem": "<u>安心しました<\/u>とありますが、どうしてですか。", "choices": ["スーパーでハンカチが見つけられたから", "姉がプレゼントをきれいだとほめてくれたから", "母がプレゼントを喜んでくれたから", "姉が「よかったね。」と言ってくれたから"], "answer": 3, "explain": "作者擔心母親會不會喜歡禮物，母親看了說「とてもきれいね。ありがとう。」，所以放心了。"}, {"n": 33, "stem": "この文章で、「わたし」が一番言いたかったことは何ですか。", "choices": ["初めて一人で買い物ができて、とても楽しかったこと", "プレゼントがなかなか選べなくて、困ったこと", "自分が少し大人になったと思えて、うれしかったこと", "母がプレゼントを喜んでくれるかどうか、心配だったこと"], "answer": 3, "explain": "文章首尾呼應，開頭和結尾都提到覺得自己長大了，重點在「成長」帶來的喜悅。"}]}]}, {"no": 6, "instruction": "右の ページを 見て、下の 質問に 答えて ください。答えは、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "A　あおい市に住んでいる外国人のみなさんへ<br>生活の中で困っていることはありませんか。住むところ、病院、子どもの学校や教育、国際結婚について相談ができます。専門の相談員がいます。相談は、日本語で行います。お金はかかりません。<br>時間：午前 10:00～12:00／午後 14:00～16:00／夜 18:00～20:00<br>・火　午前：住むところ・病院<br>・水　午後：子どもの学校や教育<br>・木　夜：住むところ・病院<br>・金　午後：国際結婚<br>・土　午前：国際結婚／夜：子どもの学校や教育<br>（月・日はなし）<br>【場所】あおい市生活相談事務所　住所：あおい市中町2-2（あおい駅西改札口から歩いて5分）　電話：077-123-1122　Eメール：soudan@aoi.lg.jp<br><br>B　リーさんの今週と来週の予定<br>5日（月）―／6日（火）12:00～19:00 仕事／7日（水）14:00～21:00 仕事／8日（木）12:00～19:00 仕事／9日（金）14:00～21:00 仕事／10日（土）9:00～15:00 仕事／11日（日）旅行<br>12日（月）旅行／13日（火）9:00～17:00 仕事／14日（水）9:00～17:00 仕事／15日（木）9:00～17:00 仕事／16日（金）9:00～17:00 仕事／17日（土）14:00～21:00 仕事／18日（日）―", "image": "img/2013-07_R6_1.jpg", "questions": [{"n": 34, "stem": "住むところについて相談できるのはいつですか。", "choices": ["火曜日の午前か木曜日の午前", "火曜日の午前か木曜日の夜", "木曜日の午後か土曜日の午前", "木曜日の午後か土曜日の夜"], "answer": 2, "explain": "根據A表，「住むところ・病院」的諮詢在週二上午和週四晚上。"}, {"n": 35, "stem": "リーさんは国際結婚について相談をしたいと思っています。今週と来週で、いつ相談ができますか。", "choices": ["9日の午後", "10日の午前", "16日の午後", "17日の午前"], "answer": 4, "explain": "國際結婚的諮詢在週五下午和週六上午。根據B表，9日、16日下午及10日上午都要工作，只有17日（週六）上午有空。"}]}]}]}, {"name": "聴解", "mondai": [{"no": 1, "instruction": "もんだい1では、まず しつもんを 聞いて ください。それから 話を 聞いて、もんだいようしの 1から4の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん<br>男の人は次、いつ歯医者に行きますか。", "choices": ["月ようびの 午前10時", "月ようびの 午後3時", "火ようびの 午前10時", "火ようびの 午後3時"], "answer": 2, "explain": "下週二只有下午有空，但男子下午要開會；店員說前一天週一有空，男子說那天的話請約3點。", "script": "歯医者で受付の人と男の人が話しています。男の人は次、いつ歯医者に行きますか。<br>女：次は来週ですね。いつがよろしいですか。<br>男：じゃあ、今日と同じ火曜日にお願いします。10時は空いていますか。<br>女：来週の火曜は午後しか空いていませんね。<br>男：ああ、その日は午後会議があってこられないんですよ。<br>女：前の日の月曜日なら空いていますよ。<br>男：そうですか。その日だったら、3時にお願いします。<br>女：はい、承知しました。どうぞお大事に。<br>男の人は次、いつ歯医者に行きますか。"}]}, {"passage": null, "image": "img/2013-07_L1_2.jpg", "questions": [{"n": 2, "stem": "2ばん<br>男の学生はどのカードを箱に入れますか。", "choices": ["ア イ ウ", "ア イ", "ア ウ", "イ"], "answer": 3, "explain": "老師說平假名卡（ア）和圖畫卡（ウ）放進箱子，漢字卡（イ）下堂課要用，不要放。", "script": "日本語の授業のあとで男の学生と先生が話しています。男の学生はどのカードを箱に入れますか。<br>男：先生、何かお手伝いしましょうか。<br>女：ああ、ありがとう。じゃ、机の上にあるカードを片付けてもらえますか。<br>男：はい。<br>女：平仮名のカードと絵のカードはこの箱に入れてください。<br>男：はい。漢字のカードもありますけど、これも入れましょうか。<br>女：あっ、それはこの後の授業で使いますから、入れないでください。<br>男：わかりました。<br>男の学生はどのカードを箱に入れますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>男の人はあした何時にどこで女の人と会いますか。", "choices": ["10時45分に こうえんで", "10時45分に えきで", "11時に こうえんで", "11時に えきで"], "answer": 2, "explain": "11點在櫻花公園集合，但男子不知道地點，女子請他提前15分鐘到櫻花車站，所以是10點45分在車站。", "script": "女の人と男の人が話しています。男の人はあした何時にどこで女の人と会いますか。<br>女：あしたみんなでお花見をするんですが、よかったら、一緒に行きませんか。<br>男：いいですね。場所はどこですか。<br>女：さくら公園です。11時に集まります。<br>男：さくら公園？どこですか。<br>女：あっ、場所、わかりませんか。じゃ、一緒に行きましょう。15分前にさくら駅に来てください。<br>男：わかりました。よろしくお願いします。<br>男の人はあした何時にどこで女の人と会いますか。"}]}, {"passage": null, "image": "img/2013-07_L1_4.jpg", "questions": [{"n": 4, "stem": "4ばん<br>男の人は何を書かなければなりませんか。", "choices": ["ア イ", "ア ウ", "ア イ エ", "ア ウ エ"], "answer": 1, "explain": "要寫名字（ア）和電話號碼（イ）；今天就參觀所以不用寫日期，班級由櫃台填寫。", "script": "パソコン教室の受付で男の人と係りの人が話しています。男の人は何を書かなければなりませんか。<br>男：すみません、クラスを見学したいんですが。<br>女：はい。では、この紙に見学したい日を書いてください。<br>男：あのう、今日、今から見学できませんか。どのクラスでもいいんですが。<br>女：今から、いいですけど、すぐ始まりますよ。<br>男：あっ、はい。<br>女：では、こちらにお名前とお電話番号を書いてください。<br>男：見学したい日もですか。<br>女：今日ですから、それはいいです。<br>男：クラスの名前のところはどうしますか。<br>女：それはこちらで書きますから、大丈夫ですよ。<br>男の人は何を書かなければなりませんか。"}]}, {"passage": null, "image": "img/2013-07_L1_5.jpg", "questions": [{"n": 5, "stem": "5ばん<br>男の人はこのあと何をしますか。", "choices": ["1", "2", "3", "4"], "answer": 2, "explain": "掃除已經做好了，點心和咖啡杯都不用準備，只要從隔壁房間把椅子搬過來。", "script": "電話で女の人と男の人が話しています。男の人はこのあと何をしますか。<br>女：もしもし、今から帰るね。友達も一緒なんだけど、掃除しておいてもらえる？<br>男：掃除なら、やってあるよ。<br>女：ありがとう。あっ、椅子が一つ足りないから、隣の部屋から持ってきておいて。<br>男：わかった。ほかに何かやっておくことある？お菓子を用意しておこうか？<br>女：ううん、大丈夫。ケーキを買って帰るから。<br>男：じゃ、コーヒーカップを出しておくね。<br>女：それはすぐできるから、いいよ。<br>男：わかった。<br>男の人はこのあと何をしますか。"}]}, {"passage": null, "image": "img/2013-07_L1_6.jpg", "questions": [{"n": 6, "stem": "6ばん<br>男の人はどう行きますか。", "choices": ["1", "2", "3", "4"], "answer": 2, "explain": "沿這條路直走，在第一個十字路口右轉，再在第一個轉角左轉，即路線2。", "script": "男の人と女の人が話しています。男の人はどう行きますか。<br>男：すみません、みどり病院はどこですか。<br>女：ああ、みどり病院ですか。ええ、この道をまっすぐ行きます。一つ目の交差点を右に曲がってください。少し行って、一つ目の角を左に曲がります。50メートルくらい行くと、みどり病院がありますよ。<br>男：まっすぐ、それから右、次左ですね。ありがとうございました。<br>男の人はどう行きますか。"}]}, {"passage": null, "image": "img/2013-07_L1_7.jpg", "questions": [{"n": 7, "stem": "7ばん<br>女の人はこの後どれを捨てますか。", "choices": ["ア イ ウ", "ア イ", "ア ウ", "イ ウ"], "answer": 4, "explain": "要丟的是雜誌（イ）和包包（ウ）；黑色袋子（ア）要用來裝垃圾，留著。", "script": "家で男の人と女の人が話しています。女の人はこの後どれを捨てますか。<br>男：ごめん、ちょっとお願い。ごみを捨ててきてくれない？<br>女：いいよ。どれ？<br>男：そこの雑誌とかばん。<br>女：えっ？このかばんも？<br>男：うん、中がすごく汚れていて、もう使えないんだ。<br>女：そうなんだ。この黒い袋は？<br>男：あっ、それにはごみを入れるから、置いておいて。<br>女：わかった。<br>女の人はこの後どれを捨てますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 8, "stem": "8ばん<br>学生は何で書きますか。", "choices": ["くろの えんぴつ", "くろの ペン", "あかの ペン", "あおの ペン"], "answer": 3, "explain": "老師說黑色鉛筆或筆不容易看清楚，一定要用紅筆；藍筆是老師之後檢查時用的。", "script": "学校で先生が話しています。学生は何で書きますか。<br>女：みなさん、漢字の宿題は持ってきましたか。いつもは私が見ていますが、今日はみんなでチェックしましょう。隣の人の漢字を見てあげてください。正しく書けていますか。間違っているところがあったら、直しましょう。黒の鉛筆やペンではわかりにくいですから、必ず赤のペンを使ってください。持っていない人はここにありますから、使ってください。あとでわたしが青のペンを使ってチェックします。じゃ、自分の宿題を隣の人に渡してください。<br>学生は何で書きますか。"}]}]}, {"no": 2, "instruction": "もんだい2では、まず しつもんを 聞いて ください。その あと、もんだいようしを 見て ください。読む 時間が あります。それから 話を 聞いて、もんだいようしの 1から4の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん<br>男の学生は子供のとき何になりたかったと言っていますか。", "choices": ["けいさつかん", "バスの うんてんしゅ", "ケーキやの てんいん", "レストランの ウエーター"], "answer": 1, "explain": "男學生說小時候想當警察（喜歡警車）；現在想開巴士，想開蛋糕店的是女生。", "script": "女の学生と男の学生が話しています。男の学生は子供のとき何になりたかったと言っていますか。男の学生です。<br>女：佐藤君、子供の時、何になりたかった？<br>男：警察官。パトカーが好きで、運転したかったんだ。でも今はバスの運転をしてみたいと思っている。<br>女：そう。車が好きなんだね。わたしは子供の時ケーキ屋になりたかったよ。<br>男：今はレストランのアルバイトをしているよね。<br>女：うん、楽しいよ。<br>男の学生は子供のとき何になりたかったと言っていますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 2, "stem": "2ばん<br>男の人は今からどうすると言っていますか。", "choices": ["はやく しごとを おわらせる", "きっさてんで 女の人を まつ", "タクシーで かいじょうに 行く", "女の人に 電話を かける"], "answer": 2, "explain": "男子已經到了會場，說會在附近的咖啡店喝咖啡等她；搭計程車的是女子。", "script": "携帯電話で女の人と男の人が話しています。男の人は今からどうすると言っていますか。男の人です。<br>女：もしもし、田中君？わたし、まだ仕事が終わらなくて、6時半の約束には遅れそう。ごめん。<br>男：えっ？僕は早く仕事が終わったから、コンサート会場にもう着いたよ。じゃ、近くの喫茶店でコーヒーを飲んで待っているよ。コンサートは7時からだけど、間に合う？<br>女：あと少しで出られるから、タクシーで行けば大丈夫だと思う。<br>男：わかった。じゃ、また電話して。<br>女：うん。<br>男の人は今からどうすると言っていますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>男の人はいつコピーをしますか。", "choices": ["今日の 午前", "今日の 午後", "あしたの 午前", "あしたの 午後"], "answer": 1, "explain": "資料明天早上開會要用，男子說今天上午之內會印好，下午午休後馬上送去課長那裡。", "script": "会社で女の人と男の人が話しています。男の人はいつコピーをしますか。<br>女：この資料を200枚コピーしてくれませんか。明日の朝の会議で使うんです。<br>男：はい、わかりました。<br>女：あっ、今すぐじゃなくてもいいですよ。<br>男：はい。あのう、今ちょっと忙しいんですが、午前中にはやります。午後、昼休みのあと、すぐ課長のところへ持って行きます。<br>女：じゃ、お願いします。<br>男の人はいつコピーをしますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん<br>息子はこれからかばんに何を入れますか。", "choices": ["セーター", "かさ", "レインコート", "てぶくろ"], "answer": 3, "explain": "毛衣和手套已經放了，撐傘沒辦法爬山，所以要帶雨衣。", "script": "家でお母さんと息子が話しています。息子はこれからかばんに何を入れますか。<br>女：あしたの山に登る準備はできた？セーター、入れた？<br>男：うん、必要なものはかばんに全部入れたよ。<br>女：傘も入れた？<br>男：要らないよ。天気予報ではあさってまで晴れだから。<br>女：山は天気が変わりやすいから。雨が降るかもしれないよ。<br>男：そうだね。でも、傘を差して山に登れないから、レインコートを持っていくよ。<br>女：あっ、手袋も入れた？<br>男：うん、もう入れてあるよ。<br>息子はこれからかばんに何を入れますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん<br>女の学生はどうしてアルバイトをしますか。", "choices": ["ひっこしを するため", "新しい パソコンを 買うため", "お母さんに プレゼントを 買うため", "友だちと おんせんに 行くため"], "answer": 3, "explain": "女學生想在母親生日送禮物（溫泉旅行票）；搬家和買電腦是男學生的理由。", "script": "女の学生と男の学生が話しています。女の学生はどうしてアルバイトをしますか。女の学生です。<br>女：加藤君、夏休みはアルバイトする？<br>男：うん、するよ。引越しする予定なんだ。それに、新しいパソコンもほしいし、お金がかかるんだ。<br>女：そう。わたしも今年の夏休みはアルバイトするつもり。<br>男：山田さんも？<br>女：うん、母の誕生日にプレゼントをあげたいんだ。<br>男：そうなんだ。何をあげる予定？<br>女：旅行のチケット。温泉が好きだから。<br>女の学生はどうしてアルバイトをしますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 6, "stem": "6ばん<br>女の留学生は今日何をしたいと言っていますか。", "choices": ["にもつを おくる", "おみやげを 買う", "パーティーに 行く", "車で あそびに 行く"], "answer": 2, "explain": "行李已經寄了，還沒買伴手禮，打算今天去買。", "script": "男の学生と女の留学生が話しています。女の留学生は今日何をしたいと言っていますか。<br>男：来週帰国ですね。帰る準備は終わりましたか。<br>女：荷物はもう送りましたが、お土産をまだ買っていないんです。最近、ずっとパーティーなどがあって、忙しかったので、今日買いに行こうと思っています。<br>男：そうですか。わたしも買い物があるんです。車で行こうと思っているんですが、いっしょにどうですか。<br>女：ありがとうございます。じゃ、お願いします。<br>女の留学生は今日何をしたいと言っていますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん<br>このレストランはどうして最近客が増えましたか。", "choices": ["テレビで しょうかいされたから", "りょうりが 安くなったから", "ゆうめいな 人が りょうりを つくるから", "えいがに 出たから"], "answer": 4, "explain": "這家餐廳上個月出現在電影裡之後廣為人知，現在有很多人來吃。", "script": "テレビで男の人がレストランについて話しています。このレストランはどうして最近客が増えましたか。<br>男：今日は今人気のレストランを紹介します。こちらは百年前に建てられたレストランです。料理は安くておいしいです。こちらで料理を作っている佐藤さんは有名なホテルで働いていたことがあるそうです。このレストランは先月映画に出てから、大勢の人に知られるようになりました。今はたくさんの人が食べにくるようになったそうです。<br>このレストランはどうして最近客が増えましたか。"}]}]}, {"no": 3, "instruction": "もんだい3では、えを 見ながら しつもんを 聞いて ください。➡（やじるし）の 人は 何と 言いますか。1から3の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": "img/2013-07_L3_1.jpg", "questions": [{"n": 1, "stem": "1ばん<br>先輩が荷物をたくさん持っています。先輩に何と言いますか。", "choices": ["先輩、持ちませんか。", "先輩、持ちますよ。", "先輩、持ってください。"], "answer": 2, "explain": "主動提出幫忙拿東西用「持ちますよ（我來拿吧）」。", "script": "先輩が荷物をたくさん持っています。先輩に何と言いますか。<br>1. 先輩、持ちませんか。<br>2. 先輩、持ちますよ。<br>3. 先輩、持ってください。"}]}, {"passage": null, "image": "img/2013- す。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>どうやってアルバイトを探しましたか。", "choices": ["夏休みに旅行したいです。", "アルバイトは楽しいですから。", "インターネットで見つけました。"], "answer": 3, "explain": "問用什麼方法找打工，回答「在網路上找到的」。", "script": "どうやってアルバイトを探しましたか。<br>1. 夏休みに旅行したいです。<br>2. アルバイトは楽しいですから。<br>3. インターネットで見つけました。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん<br>この椅子はどこに置きましょうか。", "choices": ["ええ、そうしましょう。", "そっちに並べてください。", "隣の部屋にあります。"], "answer": 2, "explain": "問椅子要放哪裡，回答「請排在那邊」。", "script": "この椅子はどこに置きましょうか。<br>1. ええ、そうしましょう。<br>2. そっちに並べてください。<br>3. 隣の部屋にあります。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん<br>正月の休みの間、どこかへ出かけましたか。", "choices": ["学校と駅の間にありました。", "かぜでずっと寝ていました。", "スキーに行ったことがあります。"], "answer": 2, "explain": "問新年假期有沒有出門，回答「感冒一直在睡覺」（即沒出門）。", "script": "正月の休みの間、どこかへ出かけましたか。<br>1. 学校と駅の間にありました。<br>2. かぜでずっと寝ていました。<br>3. スキーに行ったことがあります。"}]}, {"passage": null, "image": null, "questions": [{"n": 6, "stem": "6ばん<br>料理、下手なんだけど、最近家で毎晩作っているんだ。", "choices": ["誰から？", "どんなの？", "どこに？"], "answer": 2, "explain": "對方說最近每晚在家做菜，自然的回應是問「做什麼樣的？」。", "script": "料理、下手なんだけど、最近家で毎晩作っているんだ。<br>1. 誰から？<br>2. どんなの？<br>3. どこに？"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん<br>この大学には学生が全部でどのぐらいいますか。", "choices": ["全部かどうかわかりません。", "だいたい１万人です。", "夜9時ぐらいまでいます。"], "answer": 2, "explain": "問學生總共大約有多少，回答「大約一萬人」。", "script": "この大学には学生が全部でどのぐらいいますか。<br>1. 全部かどうかわかりません。<br>2. だいたい１万人です。<br>3. 夜9時ぐらいまでいます。"}]}, {"passage": null, "image": null, "questions": [{"n": 8, "stem": "8ばん<br>このバスはみどり公園行きですか。", "choices": ["いいえ、東京駅ですよ。", "公園に行ったんですね。", "バスで行きたいです。"], "answer": 1, "explain": "問這班公車是否開往綠公園，回答「不，是往東京車站的」。", "script": "このバスはみどり公園行きですか。<br>1. いいえ、東京駅ですよ。<br>2. 公園に行ったんですね。<br>3. バスで行きたいです。"}]}]}]}], "webNoAudio": true}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = (D.level || 'N5').toLowerCase() + '-practice-' + D.id;
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
let S = Object.assign({answers:{}, submitted:false, mode:'practice', tab:'all'}, store.get());
const save = () => store.set(S);
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

// theme
(function(){
  let t; try { t = localStorage.getItem('n5-theme'); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const n = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem('n5-theme', n); } catch(e){}
  };
})();

const SHORT = ['文字・語彙','文法・讀解','聽解'];
const allQ = []; // {key, sec, q, node}
const secNodes = [];

function render(){
  const main = $('#main');
  if (D.notes) main.appendChild(el('div','notes','<b>說明：</b>' + D.notes));
  D.sections.forEach((sec, si) => {
    const sn = el('section','sec-wrap'); sn.dataset.sec = si;
    sn.appendChild(el('h2','sec', sec.name));
    const isL = /聴解|聽解/.test(sec.name);
    if (isL && D.audio) sn.appendChild(player(D.audio, '整份聽解錄音（播放器會固定在上方，可邊聽邊作答）'));
    if (isL && !D.audio && !sec.mondai.some(m => m.audio)) sn.appendChild(el('div','notes', D.webNoAudio ? '線上版因版權因素不含聽解錄音；仍可作答，作答後可展開「聽力原文」閱讀。' : '此卷沒有聽解錄音檔，可作答後展開「聽力原文」閱讀。'));
    sec.mondai.forEach(m => {
      const mn = el('div','mondai');
      mn.appendChild(el('h3', null, 'もんだい ' + m.no));
      if (m.instruction) mn.appendChild(el('p','instr', m.instruction));
      if (m.audio) mn.appendChild(player(m.audio, 'もんだい ' + m.no + ' 錄音'));
      (m.groups || []).forEach(g => {
        const gn = el('div','group');
        if (g.image) { const im = el('img'); im.src = g.image; im.loading = 'lazy'; im.alt = ''; gn.appendChild(im); }
        if (g.passage) gn.appendChild(el('div','passage', g.passage));
        g.questions.forEach(q => {
          const key = si + '-' + m.no + '-' + q.n;
          const qn = el('div','q'); qn.dataset.key = key;
          qn.appendChild(el('p','stem', '<span class="qn">' + q.n + '</span>' + (q.stem || '')));
          const cs = el('div','choices');
          const longest = Math.max(...q.choices.map(c => c.replace(/<[^>]+>/g,'').length));
          if (longest > 14) cs.classList.add('long');
          q.choices.forEach((c, ci) => {
            const b = el('button','ch','<span class="k">' + (ci+1) + '</span><span>' + c + '</span>');
            b.onclick = () => pick(key, ci+1);
            cs.appendChild(b);
          });
          qn.appendChild(cs);
          const fb = el('div','fb');
          let inner = '<span class="verdict"></span>';
          if (q.explain) inner += '<div class="ex">' + q.explain + '</div>';
          fb.innerHTML = inner;
          if (q.script) { const d = el('details','script','<summary>聽力原文</summary><div>' + q.script + '</div>'); fb.appendChild(d); }
          qn.appendChild(fb);
          gn.appendChild(qn);
          allQ.push({key, sec: si, q, node: qn, group: gn, mondai: mn});
        });
        mn.appendChild(gn);
      });
      sn.appendChild(mn);
    });
    main.appendChild(sn);
    secNodes.push(sn);
  });
  main.appendChild(el('div','result hidden')).id = 'result';

  const tabs = $('#tabs');
  const mk = (id, label) => { const b = el('button','tab', label); b.dataset.tab = id; b.onclick = () => { S.tab = id; save(); refresh(); scrollTo(0,0); }; tabs.appendChild(b); };
  mk('all','全部');
  D.sections.forEach((s, i) => mk(String(i), SHORT[i] || s.name));
}

function player(src, hint){
  const a = el('div','audio');
  const au = document.createElement('audio');
  au.controls = true; au.preload = 'none'; au.src = encodeURI(src);
  a.appendChild(au);
  a.appendChild(el('span','hint', hint));
  au.onerror = () => { a.querySelector('.hint').textContent = '找不到錄音檔，請確認 mp3 仍在原資料夾：' + src; };
  return a;
}

function pick(key, v){
  if (S.submitted) return;
  if (S.mode === 'practice' && S.answers[key] != null) return; // 練習模式：作答後鎖定
  S.answers[key] = v; save(); refresh();
}

function refresh(){
  $('#mode').value = S.mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  secNodes.forEach((n, i) => n.classList.toggle('hidden', S.tab !== 'all' && String(i) !== S.tab));
  const reveal = S.mode === 'practice' || S.submitted;
  const wrongOnly = $('#wrongOnly').checked;
  let done = 0, right = 0, total = 0;
  allQ.forEach(o => {
    const a = S.answers[o.key];
    const inTab = S.tab === 'all' || String(o.sec) === S.tab;
    if (inTab) { total++; if (a != null) done++; if (a === o.q.answer) right++; }
    const show = a != null && reveal;
    o.node.querySelectorAll('.ch').forEach((b, i) => {
      b.classList.remove('picked','right','wrong');
      if (show) {
        if (i+1 === o.q.answer) b.classList.add('right');
        else if (i+1 === a) b.classList.add('wrong');
      } else if (a === i+1) b.classList.add('picked');
    });
    const fb = o.node.querySelector('.fb');
    fb.classList.toggle('show', show);
    if (show) {
      const v = fb.querySelector('.verdict');
      const ok = a === o.q.answer;
      v.className = 'verdict ' + (ok ? 'ok' : 'ng');
      v.textContent = ok ? '✓ 正確' : '✗ 答錯了，正確答案是 ' + o.q.answer;
    }
    const hideIt = wrongOnly && reveal && (a === o.q.answer || a == null);
    o.node.classList.toggle('hidden', hideIt);
  });
  // 隱藏整組 / 整個 もんだい 若其中的題目都被隱藏
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('hidden', [...g.querySelectorAll('.q')].every(q => q.classList.contains('hidden'))));
  document.querySelectorAll('.mondai').forEach(m => m.classList.toggle('hidden', [...m.querySelectorAll('.group')].every(g => g.classList.contains('hidden'))));
  $('#score').innerHTML = reveal
    ? '已作答 <b>' + done + '</b> / ' + total + '　答對 <b>' + right + '</b>' + (done ? '（' + Math.round(right/done*100) + '%）' : '')
    : '已作答 <b>' + done + '</b> / ' + total + '（交卷後顯示成績）';
  $('#submit').classList.toggle('hidden', S.mode !== 'exam' || S.submitted);
  renderResult(reveal);
  const h = document.querySelector('header.top').offsetHeight;
  document.documentElement.style.setProperty('--hdr', (h + 8) + 'px');
}

function renderResult(reveal){
  const r = $('#result');
  if (!reveal || !Object.keys(S.answers).length) { r.classList.add('hidden'); return; }
  r.classList.remove('hidden');
  let rows = '';
  D.sections.forEach((s, i) => {
    const qs = allQ.filter(o => o.sec === i);
    const ok = qs.filter(o => S.answers[o.key] === o.q.answer).length;
    const dn = qs.filter(o => S.answers[o.key] != null).length;
    rows += '<tr><td>' + s.name + '</td><td class="num">' + ok + ' / ' + qs.length + '</td><td class="num">' + dn + ' 題已答</td></tr>';
  });
  const ok = allQ.filter(o => S.answers[o.key] === o.q.answer).length;
  r.innerHTML = '<b>成績統計</b><table>' + rows + '<tr><th>合計</th><th class="num">' + ok + ' / ' + allQ.length + '</th><th></th></tr></table>';
}

$('#mode').onchange = e => { S.mode = e.target.value; save(); refresh(); };
$('#wrongOnly').onchange = refresh;
$('#submit').onclick = () => {
  const left = allQ.filter(o => S.answers[o.key] == null).length;
  if (left && !confirm('還有 ' + left + ' 題未作答，確定要交卷嗎？')) return;
  S.submitted = true; save(); refresh(); scrollTo(0,0);
};
$('#reset').onclick = () => {
  if (!confirm('清除本卷所有作答紀錄？')) return;
  S.answers = {}; S.submitted = false; save(); $('#wrongOnly').checked = false; refresh();
};
render(); refresh();
</script>
</body>
</html>
