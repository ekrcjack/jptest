<!doctype html>

<title>N4 2013年12月 真題</title>
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#6b7078; --line:#e3dfd6;
  --accent:#b8412e; --accent-soft:#f6e3df; --ok:#1f7a4d; --ok-soft:#dff1e7; --ng:#b3261e; --ng-soft:#f9e0de;
  --chip:#efebe3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
    --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
  --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","PingFang TC","Noto Sans TC",sans-serif}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.bar h1{font-size:18px;margin:0;flex:1 1 auto;white-space:nowrap}
.bar h1 a{text-decoration:none;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.score{font-size:14px;color:var(--muted)}
.score b{color:var(--ink)}
select.btn{padding:5px 8px}
main{padding:16px 0 120px}
.notes{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
h2.sec{font-size:20px;margin:28px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.mondai{margin:22px 0 10px}
.mondai h3{font-size:16px;margin:0 0 4px;color:var(--accent)}
.instr{font-size:14px;color:var(--muted);margin:0 0 10px}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.passage{background:var(--chip);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}
.group img{max-width:100%;height:auto;display:block;margin:4px auto 12px;border-radius:6px;background:#fff}
.q{padding:10px 0;border-top:1px dashed var(--line)}
.group .q:first-of-type{border-top:0}
.stem{margin:0 0 8px}
.qn{display:inline-block;min-width:28px;padding:0 6px;margin-right:8px;border:1.5px solid var(--ink);border-radius:4px;text-align:center;font-weight:700;font-size:14px;line-height:22px}
.stem u{text-decoration-thickness:1.5px;text-underline-offset:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.choices.long{grid-template-columns:1fr}
.ch{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.ch:hover{border-color:var(--muted)}
.ch .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-top:3px}
.ch.picked{border-color:var(--ink);background:var(--chip)}
.ch.picked .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{border-color:var(--ng);background:var(--ng-soft)}
.ch.wrong .k{background:var(--ng);border-color:var(--ng);color:#fff}
.fb{margin-top:8px;font-size:14.5px;border-left:3px solid var(--line);padding:4px 0 4px 10px;display:none}
.fb.show{display:block}
.fb .verdict{font-weight:700}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.ng{color:var(--ng)}
details.script{margin-top:6px}
details.script summary{cursor:pointer;color:var(--muted);font-size:14px}
details.script div{background:var(--chip);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:14.5px}
.audio{position:sticky;top:var(--hdr,96px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.audio audio{flex:1 1 260px;width:100%}
.audio .hint{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.result{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin:20px 0}
.result table{border-collapse:collapse;width:100%;font-size:14.5px}
.result td,.result th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.result td.num{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.choices{grid-template-columns:1fr 1fr}.bar h1{font-size:16px}}
</style>
</head>

讀いん，駅員＝えきいん。"}, {"n": 9, "stem": "わたしは しょうらい <u>医者<\/u>に なりたいです。", "choices": ["いじゃ", "いしゃ", "いいじゃ", "いいしゃ"], "answer": 2, "explain": "句意：我將來想當醫生。「医」讀い，「者」讀しゃ，医者＝いしゃ。"}]}]}, {"no": 2, "instruction": "＿＿＿の ことばは どう かきますか。1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 10, "stem": "その いけんには <u>はんたい<\/u>です。", "choices": ["反対", "半対", "反体", "半体"], "answer": 1, "explain": "句意：我反對那個意見。はんたい＝反対，其他選項為干擾項。"}, {"n": 11, "stem": "テキストの 10ページを <u>ひらいて<\/u> ください。", "choices": ["関いて", "閉いて", "閑いて", "開いて"], "answer": 4, "explain": "句意：請翻開課本第10頁。ひらく＝開く（打開）；閉じる（とじる）是關上，其他為干擾項。"}, {"n": 12, "stem": "この <u>あかい<\/u> じてんしゃは だれのですか。", "choices": ["黒い", "青い", "赤い", "白い"], "answer": 3, "explain": "句意：這台紅色的腳踏車是誰的？あかい＝赤い；黒い（くろい）黑、青い（あおい）藍、白い（しろい）白。"}, {"n": 13, "stem": "毎日 30ぷん <u>はしって<\/u> います。", "choices": ["足って", "走って", "是って", "定って"], "answer": 2, "explain": "句意：每天跑步30分鐘。はしる＝走る（跑）；足る（たる）是足夠，其他為干擾項。"}, {"n": 14, "stem": "この へやは <u>くらい<\/u>ですね。", "choices": ["暗い", "明い", "暑い", "寒い"], "answer": 1, "explain": "句意：這個房間真暗啊。くらい＝暗い；明るい（あかるい）明亮、暑い（あつい）熱、寒い（さむい）冷。"}, {"n": 15, "stem": "いつも あの スーパーで <u>やさい<\/u>を 買います。", "choices": ["理薬", "野薬", "理菜", "野菜"], "answer": 4, "explain": "句意：我總是在那家超市買蔬菜。やさい＝野菜，其他為干擾項。"}]}]}, {"no": 3, "instruction": "（　）に なにを いれますか。1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 16, "stem": "新しい しごとには もう（　）。", "choices": ["なれましたか", "がんばりましたか", "つとめましたか", "かよいましたか"], "answer": 1, "explain": "句意：已經習慣新工作了嗎？なれる（慣れる）習慣；がんばる努力、つとめる（勤める）任職、かよう（通う）往返。"}, {"n": 17, "stem": "雨が（　）、いい天気に なりました。", "choices": ["おわって", "とまって", "やんで", "きえて"], "answer": 3, "explain": "句意：雨停了，天氣變好了。雨停用「やむ（止む）」；おわる結束、とまる停止（車等）、きえる消失。"}, {"n": 18, "stem": "この 子は（　）ので、あまり ひとと 話を しません。", "choices": ["かわいい", "おとなしい", "わかい", "うつくしい"], "answer": 2, "explain": "句意：那個孩子很文靜，不太跟人說話。おとなしい＝溫順安靜；かわいい可愛、わかい年輕、うつくしい美麗。"}, {"n": 19, "stem": "わたしが にゅういんした とき、友だちが（　）に 来て くれました。", "choices": ["おみまい", "おねがい", "けんがく", "けんぶつ"], "answer": 1, "explain": "句意：我住院時，朋友來探望我。おみまい（お見舞い）探病；おねがい請求、けんがく（見学）參觀學習、けんぶつ（見物）遊覽。"}, {"n": 20, "stem": "来月 きこくするので、ひこうきの チケットを（　）しました。", "choices": ["けいかく", "よやく", "うけつけ", "やくそく"], "answer": 2, "explain": "句意：下個月要回國，所以預訂了機票。よやく（予約）預約；けいかく計畫、うけつけ受理、やくそく約定。"}, {"n": 21, "stem": "来週 テストが あるので、今週は（　）べんきょうします。", "choices": ["じょうぶに", "しんせつに", "まじめに", "だいじに"], "answer": 3, "explain": "句意：下週有考試，所以這週要認真讀書。まじめに（真面目に）認真地；じょうぶ結實、しんせつ親切、だいじ珍惜。"}, {"n": 22, "stem": "テーブルから コップを（　）、わって しまいました。", "choices": ["わたして", "なくして", "こわして", "おとして"], "answer": 4, "explain": "句意：把杯子從桌上弄掉，摔破了。おとす（落とす）使掉落；わたす交給、なくす弄丟、こわす弄壞。"}, {"n": 23, "stem": "この 国には、たんじょうびに とくべつな ものを 食べる（　）が あります。", "choices": ["よてい", "しゅうかん", "けいけん", "きょうみ"], "answer": 2, "explain": "句意：這個國家有在生日吃特別食物的習俗。しゅうかん（習慣）習慣、風俗；よてい預定、けいけん經驗、きょうみ興趣。"}, {"n": 24, "stem": "ドアの よこの（　）を おすと、へやの 電気が つきます。", "choices": ["チェック", "スタート", "チャンス", "スイッチ"], "answer": 4, "explain": "句意：按下門旁的開關，房間的燈就會亮。スイッチ＝開關；チェック檢查、スタート開始、チャンス機會。"}, {"n": 25, "stem": "こんばん どこで しょくじを するか（　）。", "choices": ["きめましょう", "はいりましょう", "はらいましょう", "さそいましょう"], "answer": 1, "explain": "句意：決定一下今晚在哪裡吃飯吧。きめる（決める）決定；はいる進入、はらう付款、さそう邀請。"}]}]}, {"no": 4, "instruction": "＿＿＿の ぶんと だいたい おなじ いみの ぶんが あります。1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 26, "stem": "<u>きのうの 話は うそですよ。<\/u>", "choices": ["きのうの 話は ほんとうですよ。", "きのうの 話は ほんとうじゃありませんよ。", "きのうの 話は ゆうめいですよ。", "きのうの 話は ゆうめいじゃありませんよ。"], "answer": 2, "explain": "うそ＝謊話。「昨天的話是騙人的」即「不是真的」，選2。"}, {"n": 27, "stem": "<u>やまださんは 何時ごろ もどりますか。<\/u>", "choices": ["やまださんは 何時ごろ かえって きますか。", "やまださんは 何時ごろ でかけますか。", "やまださんは 何時ごろ ねますか。", "やまださんは 何時ごろ おきますか。"], "answer": 1, "explain": "もどる＝回來，與「かえってくる」意思相同。"}, {"n": 28, "stem": "<u>この 国は こめを ゆしゅつして いますか。<\/u>", "choices": ["この 国は こめを ほかの 国から もらって いますか。", "この 国は こめを ほかの 国から かって いますか。", "この 国は こめを ほかの 国に あげて いますか。", "この 国は こめを ほかの 国に うって いますか。"], "answer": 4, "explain": "ゆしゅつ（輸出）＝出口，即賣給其他國家。"}, {"n": 29, "stem": "<u>たなかさんは にこにこして いました。<\/u>", "choices": ["たなかさんは こまって いました。", "たなかさんは やすんで いました。", "たなかさんは わらって いました。", "たなかさんは あそんで いました。"], "answer": 3, "explain": "にこにこ＝笑嘻嘻，與「わらっていました（在笑）」意思相同。"}, {"n": 30, "stem": "<u>新しい かぐが ほしいです。<\/u>", "choices": ["新しい かばんや さいふが ほしいです。", "新しい つくえや ベッドが ほしいです。", "新しい カメラや ビデオが ほしいです。", "新しい ノートや ペンが ほしいです。"], "answer": 2, "explain": "かぐ（家具）＝家具，書桌和床屬於家具。"}]}]}, {"no": 5, "instruction": "つぎの ことばの つかいかたで いちばん いい ものを 1・2・3・4から ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 31, "stem": "せんたく", "choices": ["シャンプーで かみを <u>せんたく<\/u>しました。", "にちようびに へやを <u>せんたく<\/u>します。", "しょくじの あとで、はを <u>せんたく<\/u>します。", "シャツと パンツを <u>せんたく<\/u> しました。"], "answer": 4, "explain": "せんたく（洗濯）＝洗衣服。1應用「洗う」，2應用「掃除する」，3應用「磨く」。"}, {"n": 32, "stem": "こむ", "choices": ["ごはんを 食べすぎて、おなかが <u>こんで<\/u> います。", "この じしょは じが <u>こんで<\/u> いて、読みにくいです。", "もりさんの スーツケースは ようふくで <u>こんで<\/u> います。", "あさの 電車は <u>こんで<\/u> いて、すわれません。"], "answer": 4, "explain": "こむ（込む）＝擁擠，用於人多的場所。1應用「膨れる」，3應用「詰まる」等。"}, {"n": 33, "stem": "にあう", "choices": ["あの きょうだいは かおが よく <u>にあって<\/u> いますね。", "その みどりの ぼうしは よく <u>にあって<\/u> いますよ。", "わたしと たなかさんは しゅみが <u>にあって<\/u> います。", "この 会社の しごとは わたしに <u>にあって<\/u> います。"], "answer": 2, "explain": "にあう（似合う）＝（衣物等）很相稱、很適合。1應用「似る」，3、4應用「合う」。"}, {"n": 34, "stem": "そだてる", "choices": ["みんなで さくらの 木を たいせつに <u>そだてて<\/u> います。", "いろいろな しりょうを しらべて、レポートを <u>そだてました<\/u>。", "先月から ここで 新しい ビルを <u>そだてて<\/u> います。", "おいしく なるまで、ゆっくりと りょうりを <u>そだてます<\/u>。"], "answer": 1, "explain": "そだてる（育てる）＝培育、養育。2應用「完成する」，3應用「建てる」，4應用「調理する」等。"}, {"n": 35, "stem": "ぜひ", "choices": ["<u>ぜひ<\/u> いちど 読んで みて ください。", "あしたも <u>ぜひ<\/u> はれるでしょう。", "あぶないので、<u>ぜひ<\/u> さわらないで ください。", "かりた お金は <u>ぜひ<\/u> かえします。"], "answer": 1, "explain": "ぜひ＝務必、一定（用於請求、願望）。2應用「きっと」，3應用「絶対に」，4應用「必ず」。"}]}]}]}, {"name": "言語知識（文法）・読解", "mondai": [{"no": 1, "instruction": "（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "ここから 駅まで、車なら 10分（　）行けます。", "choices": ["が", "に", "で", "を"], "answer": 3, "explain": "句意：從這裡到車站，開車的話10分鐘就能到。「で」表示限定範圍（所需時間）。"}, {"n": 2, "stem": "（電話で）「では、また 後で 電話する（　）伝えて ください。」", "choices": ["と", "は", "を", "に"], "answer": 1, "explain": "句意：（電話中）那請轉告他我之後會再打電話。「と」用來引出轉達的具體內容。"}, {"n": 3, "stem": "私は、さとう（　）ミルク（　）入れないで コーヒーを 飲みます。", "choices": ["は／は", "に／に", "で／で", "も／も"], "answer": 4, "explain": "句意：我喝咖啡不加糖也不加奶。「～も～も～ない」表示兩者都不。"}, {"n": 4, "stem": "A「今から サッカーを しませんか。」<br>B「すみません、ともだち（　）待たせて いるので、また 今度 さそって ください。」", "choices": ["を", "の", "へ", "で"], "answer": 1, "explain": "句意：不好意思，我讓朋友在等我，下次再約吧。「待つ」的使役形「待たせる」，被使役者用「を」。"}, {"n": 5, "stem": "A「アルバイトは、毎日 して いますか。」<br>B「いいえ、月曜日（　）です。」", "choices": ["も", "しか", "の", "だけ"], "answer": 4, "explain": "句意：不，只有星期一。だけ和しか都表限定，但しか須接否定，故選だけ。"}, {"n": 6, "stem": "大阪に 来た（　）今日が 初めてです。", "choices": ["を", "は", "のを", "のは"], "answer": 4, "explain": "句意：今天是我第一次來大阪。動詞句作主題時需加形式名詞「の」名詞化，再加「は」。"}, {"n": 7, "stem": "レポートは、今週（　）出して ください。", "choices": ["の間", "中に", "とき", "の前に"], "answer": 2, "explain": "句意：請在本週內提交報告。「中に（じゅうに）」表示在某段時間之內。"}, {"n": 8, "stem": "今、じゅぎょうで 町の れきし（　）調べて います。", "choices": ["のことが", "によって", "のほうが", "について"], "answer": 4, "explain": "句意：現在在課堂上調查關於城市歷史的內容。について＝關於。"}, {"n": 9, "stem": "A「きのうは どうして 来なかったんですか。（　）待っていたんですよ。」<br>B「すみません」", "choices": ["よく", "ずっと", "いつか", "かならず"], "answer": 2, "explain": "句意：你昨天為什麼沒來？我一直在等你。ずっと＝一直；よく經常、いつか某時、かならず一定。"}, {"n": 10, "stem": "A「先週 いっしょに 行った レストランに 今夜 行きませんか。」<br>B「駅前の（　）店ですか。いいですね。」", "choices": ["こんな", "あの", "そんな", "どの"], "answer": 2, "explain": "句意：是車站前的那家店嗎？好啊。指雙方都知道的事物用「あの」。"}, {"n": 11, "stem": "私は、ピアノと ギターを（　）が できる。", "choices": ["ひく", "ひける", "ひくこと", "ひけること"], "answer": 3, "explain": "句意：我會彈鋼琴和吉他。句型「動詞辭書形＋ことができる」表示能力。"}, {"n": 12, "stem": "A「地下鉄の 駅は ここから 遠いですか。」<br>B「いいえ、近いですよ。だいたい 5分（　）。」", "choices": ["ごろです", "ぐらいです", "遠いです", "着きます"], "answer": 2, "explain": "句意：不遠，大約5分鐘左右。ごろ只接時間點，ぐらい可接時間長度，故選ぐらい。"}, {"n": 13, "stem": "妻「こどもの 名前は、女の子が（　）『えり』で、男の子が（　）『けん』は どう？」<br>夫「いいね。ぼくは 女の子が いいなあ。」", "choices": ["生まれたら／生まれたら", "生まれても／生まれても", "生まれるけど／生まれるけど", "生まれたから／生まれたから"], "answer": 1, "explain": "句意：孩子的名字，生女孩就叫「繪里」，生男孩就叫「健」，怎麼樣？對未實現的事假設，用「たら」。"}, {"n": 14, "stem": "（タクシーで）「新幹線の 出発まで もう 時間（　）。運転手さん、急いで ください。」", "choices": ["が あります", "に なります", "が ありません", "に なりません"], "answer": 3, "explain": "句意：離新幹線出發已經沒時間了，司機請開快一點。從催促司機可知時間不夠，用否定「がありません」。"}, {"n": 15, "stem": "この ページには 何も（　）。", "choices": ["書いては いけません", "書いたほうが いいです", "書かなければ なりません", "書いて ください"], "answer": 1, "explain": "句意：這一頁上什麼都不能寫。「疑問詞＋も」須接否定表達，故選「書いてはいけません」。"}]}]}, {"no": 2, "instruction": "★に 入る ものは どれですか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 16, "stem": "ABC大学の 図書館と ＿＿＿ ＿＿＿ ★ ＿＿＿ できます。", "choices": ["食堂は", "でも", "利用", "どなた"], "answer": 2, "explain": "正確語序：図書館と 食堂は どなた でも 利用 できます（1→4→2→3）。「疑問詞＋でも」表示無論誰都可以。"}, {"n": 17, "stem": "田中「ケンさん、日本に 来て 1か月ですね。」<br>ケン「はい。やっと 日本の ＿＿＿ ＿＿＿ ★ ＿＿＿ です。」", "choices": ["なれた", "ところ", "に", "生活"], "answer": 1, "explain": "正確語序：日本の 生活 に なれた ところ です（4→3→1→2）。「～に慣れる」表示習慣、適應。"}, {"n": 18, "stem": "（学校で）<br>A「あ、しゅくだいが ない。」<br>B「え、忘れたんですか。」<br>A「はい。がんばって しゅくだいを ＿＿＿ ＿＿＿ ★ ＿＿＿ きて しまいました。」", "choices": ["のに", "忘れて", "家に", "やった"], "answer": 3, "explain": "正確語序：しゅくだいを やった のに 家に 忘れて きて（4→1→3→2）。「～のに」表示出乎意料。"}, {"n": 19, "stem": "この 道は、雨の 日は すべり ＿＿＿ ＿＿＿ ★ ＿＿＿ ください。", "choices": ["通って", "やすくて", "気を つけて", "あぶないから"], "answer": 3, "explain": "正確語序：すべり やすくて あぶないから 気を つけて 通って ください（2→4→3→1）。"}, {"n": 20, "stem": "今日は、一年で ＿＿＿ ＿＿＿ ★ ＿＿＿ です。", "choices": ["日", "が", "夜", "最も 長い"], "answer": 4, "explain": "正確語序：一年で 夜 が 最も長い 日 です（3→2→4→1）。最も＝最，表最高級。"}]}]}, {"no": 3, "instruction": "21から25に 何を 入れますか。文章の 意味を 考えて、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "(1) 留学生の トムさんが ともだちの 森さんに 送った メール<br><br>森さん<br>こんにちは。もうすぐ 5月ですね。<br>来週の 休みは 何か 予定が ありますか。<br>5月3日金曜日から 三日間、Gデパートに 私の 写真が （ 21 ）。<br>冬に とった 空の 写真です。<br>毎年 5月、Gデパートには 私が 入って いる 写真クラブの 写真が 何枚か かざられるのですが、今年は 私のが 選ばれたのです。<br>（ 22 ）、森さんにも ぜひ 見て もらいたいのですが、ご都合は いかがですか。<br>お返事を 待って います。<br>トム<br><br>(2) 森さんが トムさんに 送った 返事の メール<br><br>トムさん<br>メールを ありがとうございます。<br>トムさんの 写真が （ 23 ）。すごいですね。おめでとうございます。<br>トムさん（ 24 ） とった 写真は まだ 見たことが ないので、見て みたいです。<br>5月4日の 午後、Gデパートに 見に （ 25 ）。<br>楽しみに して います。<br>森", "image": null, "questions": [{"n": 21, "stem": "（ 21 ）", "choices": ["かざられました", "かざられたでしょう", "かざられることでした", "かざられることに なりました"], "answer": 4, "explain": "信的開頭說「快到5月了」，展出期間是5月3日起，照片尚未展出，只是已決定要展出，故用「ことになりました」。"}, {"n": 22, "stem": "（ 22 ）", "choices": ["それで", "しかし", "それから", "たとえば"], "answer": 1, "explain": "前文說自己的照片要被展出，後文邀請對方來看，前後為因果關係，用「それで（因此）」。"}, {"n": 23, "stem": "（ 23 ）", "choices": ["選ばれたんですか", "選ばれたからですか", "選ばれたそうですよ", "選ばれたようですよ"], "answer": 1, "explain": "森先生在此複述對方的話並表示驚訝與讚賞，用「のですか（んですか）」。"}, {"n": 24, "stem": "（ 24 ）", "choices": ["に", "を", "が", "は"], "answer": 3, "explain": "「トムさんがとった写真」，在修飾名詞的子句中以「が」提示動作主語（拍照的人）。"}, {"n": 25, "stem": "（ 25 ）", "choices": ["行って ください", "行こうと 思います", "来て ください", "来ようと 思います"], "answer": 2, "explain": "森先生說明自己的打算：5月4日下午去看展，用意志形「行こうと思います」。"}]}]}, {"no": 4, "instruction": "つぎの （1）から （4）の 文章を 読んで、質問に 答えて ください。答えは、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "このポスターが会議室にはってあります。<br><br><b>会議室を使う皆様へ<\/b><br>1 予約時間が終わる3分前までに部屋を出てください。<br>2 使った机といすは、最初に並べられていた所に置いてください。<br>3 ごみは置いたままにしないで、持って帰ってください。<br>4 エアコンと電気を消してください。<br>5 鍵をかけて、受付に鍵を返してください。<br>さつきビル", "image": "img/2013-12_R4_1.jpg", "questions": [{"n": 26, "stem": "会議室を使う人は、使った後にどうしなければなりませんか。", "choices": ["予約の終わりの時間になったら、3分以内に部屋を出ます。", "使った机といすを初めにあった場所に並べます。", "ごみを集めて、部屋に置いてあるごみ箱に捨てます。", "受付に行って、部屋の鍵をかけてもらいます。"], "answer": 2, "explain": "告示要求：預約結束前3分鐘離開、桌椅放回原位、垃圾帶走、關冷氣和燈、自己鎖門後把鑰匙還給櫃台。只有2符合。"}]}, {"passage": "わたしは毎朝電車で学校へ行きます。7時に駅に着いて、7時5分の電車に乗ります。でも、昨日は電車に乗るまでに<u>いつもより時間がかかって<\/u>、7時15分の電車に乗ったので、遅刻してしまいました。<br>駅の南口にはエスカレーターがありません。昨日から南口の階段の右側にエスカレーターを作る工事が始まって、階段が狭くなっていました。朝は電車に乗る人で階段が込んでいて、時間がかかってしまったのです。<br>でも、今日は早く家を出て、6時55分に駅に着いたので、いつもの電車に乗れました。", "image": null, "questions": [{"n": 27, "stem": "<u>いつもより時間がかかって<\/u>とありますが、どうしてですか。", "choices": ["昨日から階段が狭くなっていたから", "南口にはエスカレーターがないから", "エスカレーターを使う人が多かったから", "いつも乗る電車に乗れなかったから"], "answer": 1, "explain": "第二段說明：昨天開始施工建手扶梯，樓梯變窄，早上人又多，所以花了時間。"}, {"n": 28, "stem": "「わたし」は、今日、何時の電車に乗りましたか。", "choices": ["6時55分", "7時", "7時5分", "7時15分"], "answer": 3, "explain": "今天提早出門，搭上了「いつもの電車」，即第一段提到的7點5分那班車。"}]}, {"passage": "これは市民文化教室の林さんからマウアーさんに届いたメールです。<br><br>ジョン・マウアーさん<br><br>昨日お電話をもらった市民文化教室の林です。マウアーさんの手帳が見つかりました。<br>こちらまで取りに来ることができますか。それとも、送ったほうがいいでしょうか（こちらから送るときは、必要な料金を払ってもらわなければなりません）。<br>お返事、よろしくお願いします。<br><br>市民文化教室　忘れ物係　林", "image": null, "questions": [{"n": 29, "stem": "このメールで、林さんが言いたいことは何ですか。", "choices": ["手帳が見つかりました。手帳を取りに来てください。", "手帳が見つかりました。手帳を送ります。", "手帳が見つかりました。手帳を送るので、料金を払ってください。", "手帳が見つかりました。手帳をどうするか返事をください。"], "answer": 4, "explain": "林先生告知找到手帳，詢問對方要自己來拿還是寄送（寄送需付費），並請對方回覆。"}]}]}, {"no": 5, "instruction": "つぎの 文章を 読んで、質問に 答えて ください。答えは、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "これは秋山さんが南小学校の子どもたちに書いた手紙です。<br><br>南小学校6年のみなさんへ<br>先週の金曜日は家に来てくれて、ありがとうございました。<br>南小学校では、75歳以上の人が一人で住んでいる家を訪ねて、話をしたり、掃除をしたりすることを、もう5年も続けているそうですね。私は、<u>①お知らせのお手紙<\/u>をもらってから、みなさんが来るのを一か月間ずっと楽しみにしていました。<br>私の家には、若い人たちが来ることがあまりありません。ですから、用意したお菓子や料理を、みなさんが食べてくれるかどうか、ちょっと<u>②心配でした<\/u>。でも、喜んでたくさん食べてくれましたね。<br>楽しい話もいろいろ聞けました。今川くんが犬にお菓子を取られた話は、思い出すと、今でも笑ってしまいます。大きい声を出して笑ったことは、最近はほとんどありませんでした。それから、掃除もしてくれました。高い所の窓は、汚れたままになっていたのですが、山下さんたちがいすに上がってきれいにしてくれたので、とても明るくなりました。<br>私には娘がいて、娘には男の子が二人いますが、今は外国に住んでいるので、あまり会えません。みなさんが帰るときは、泣きそうになってしまってごめんなさいね。でも、本当に<u>③うれしかったのです<\/u>。<br>また、いつか遊びに来てください。<br><br>2013年10月23日<br>秋山静子", "image": null, "questions": [{"n": 30, "stem": "<u>①お知らせのお手紙<\/u>には、どんなことが書いてありましたか。", "choices": ["南小学校の子どもたちが、秋山さんの家を一か月前に訪ねたこと", "南小学校の子どもたちが、秋山さんの家を一か月後に訪ねること", "75歳以上の人が南小学校を訪ねることが、一か月前に決まったこと", "75歳以上の人が、南小学校を一か月後に訪ねることが決まったこと"], "answer": 2, "explain": "學校學生會去探訪獨居老人；秋山收到通知信後「一か月間ずっと楽しみにしていました」，可知信中寫的是學生一個月後要來訪。"}, {"n": 31, "stem": "<u>②心配でした<\/u>とありますが、心配だったのはどんなことですか。", "choices": ["自分が用意したお菓子や料理を小学生が喜んでくれるかどうか", "若い人たちが用意したお菓子や料理を小学生が食べてくれるかどうか", "子どもの好きなお菓子や料理を自分が食べられるかどうか", "お菓子や料理を自分がたくさん用意できるかどうか"], "answer": 1, "explain": "關鍵句「用意したお菓子や料理を、みなさんが食べてくれるかどうか、ちょっと心配でした」，擔心孩子們是否喜歡吃自己準備的點心和菜。"}, {"n": 32, "stem": "<u>③うれしかったのです<\/u>とありますが、うれしかったのはどんなことですか。", "choices": ["子どもたちと料理を作ったり、子どもたちから楽しい話を聞いたりしたこと", "子どもたちと話ができたり、子どもたちが掃除をしてくれたりしたこと", "外国に住んでいる娘と二人の男の子が、家に遊びに来てくれたこと", "子どもたちが帰るとき、泣かないで「さようなら。」と言えたこと"], "answer": 2, "explain": "第四段提到聽到很多有趣的話（楽しい話もいろいろ聞けました），孩子們也幫忙打掃，所以很開心。"}, {"n": 33, "stem": "秋山さんがこの手紙で一番言いたいことは何ですか。", "choices": ["みんなが帰るとき、泣きそうになってしまってごめんなさい。", "家族が近くにいないので、ぜひまた手伝いに来てください。", "ぜひ一度、みんなで私の家へ遊びに来てみてください。", "家に来てくれて、本当にありがとうございました。"], "answer": 4, "explain": "信的第一句「先週の金曜日は家に来てくれて、ありがとうございました」，整封信主要在表達感謝。"}]}]}, {"no": 6, "instruction": "右の ページの「山の森ホテルの案内」を 見て、下の 質問に 答えて ください。答えは、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "<b>山の森ホテル<\/b><br>土田市前田町1-23（前田駅から歩いて2分）<br>電話：012-345-6789　FAX：012-345-6790<br>ホームページ：http://www.yamanomori-hotel.com/<br><br><b>インターネットで予約するとき<\/b><br>シングル：日曜日～木曜日 8,000円／金曜日～土曜日 10,000円<br>ツイン：日曜日～木曜日 14,000円／金曜日～土曜日 16,000円<br><br><b>電話で予約するとき<\/b><br>シングル：日曜日～木曜日 8,500円／金曜日～土曜日 10,500円<br>ツイン：日曜日～木曜日 14,500円／金曜日～土曜日 16,500円<br><br>●ツインの部屋にもう1台ベッドを入れて、3人で泊まれます。ベッド1台の料金は1晩3,000円です。<br>●ホテルの食堂で朝ご飯が食べられます。1人1,000円で、和食と洋食が選べます。<br>●全部の部屋で、インターネットをただで利用できます。パソコンは受付で借りられます。12時間1,000円です。<br>●ホテルにはプールがあります。ホテルに泊まっている人は、ただで利用できます。泊まっていない人も1日2,000円で利用できます。", "image": "img/2013-12_R6_1.jpg", "questions": [{"n": 34, "stem": "マイさんは今週の金曜日に、山の森ホテルに一人で泊まろうと思います。インターネットでシングルの部屋を予約したら、いくらですか。", "choices": ["8,000円", "8,500円", "10,000円", "10,500円"], "answer": 3, "explain": "網路預約表格中，金曜日～土曜日的單人房為10,000日圓。"}, {"n": 35, "stem": "山の森ホテルに泊まる人が、お金を払わないでできることは、どれですか。", "choices": ["ツインの部屋でもう一つベッドを借りること", "ホテルの食堂で朝ご飯を食べること", "ホテルでパソコンを借りること", "ホテルのプールで泳ぐこと"], "answer": 4, "explain": "住宿客可免費使用的只有網路和游泳池（「ホテルに泊まっている人は、ただで利用できます」）；加床、早餐、借電腦都要付費。"}]}]}]}, {"name": "聴解", "mondai": [{"no": 1, "instruction": "もんだい1では、まず しつもんを 聞いて ください。それから 話を 聞いて、もんだいようしの 1から 4の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": "img/2013-12_L1_1.jpg", "questions": [{"n": 1, "stem": "1ばん<br>男の人はまず何をしますか。", "choices": ["1", "2", "3", "4"], "answer": 3, "explain": "椅子和桌子已排好，茶由加藤送去，電腦等影印完再準備，所以先影印資料（圖3）。", "script": "会社で女の人と男の人が会議の準備をしています。男の人はまず何をしますか。<br>女：村上さん、二時から会議が始まるけど、椅子や机は並べてある？<br>男：ええ、必要な数、もう並べてあります。<br>女：お茶は？<br>男：お茶は加藤さんが持って行ってくれます。<br>女：そう？それから、この資料、会議で使うんだけど、コピーしておいて。<br>男：はい。<br>女：パソコンは準備した？<br>男：コピーが済んだら準備します。<br>男の人はまず何をしますか。"}]}, {"passage": null, "image": "img/2013-12_L1_2.jpg", "questions": [{"n": 2, "stem": "2ばん<br>女の人は野菜をどう切りますか。", "choices": ["1", "2", "3", "4"], "answer": 2, "explain": "小黃瓜切薄片（圓片）、馬鈴薯切細條、紅蘿蔔切薄片後做成星形，即圖2。", "script": "料理のクラスで男の人と女の人が話しています。女の人は野菜をどう切りますか。<br>男：伊藤さん、きゅうりとじゃがいもとにんじんを切ってくれませんか？<br>女：ええ、いいですよ。どうきりますか？<br>男：きゅうりは薄く切ってください。じゃがいもは細く切ってください。それから、にんじんは薄く切ってから、星の形にしてください。<br>女：星の形ですか？<br>男：はい。<br>女：分かりました。<br>女の人は野菜をどう切りますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>女の学生はプレゼントを何個用意しますか。", "choices": ["4こ", "5こ", "9こ", "10こ"], "answer": 4, "explain": "男學長5人＋女學姊4人＝9個，再加上要回國的留學生金同學1個，共10個。", "script": "大学で同じクラブの男の学生と女の学生が話しています。女の学生はプレゼントを何個用意しますか。<br>男：あっ、ちょっとお願いがあるんだけど、いい？<br>女：うん、なに？<br>男：来月、卒業するクラブの先輩にプレゼントをあげたいんだけど、用意してくれる？僕は花を用意するから。<br>女：分かった。<br>男：ええと、男の先輩が五人、女の先輩が四人だね。<br>女：じゃあ、プレゼントは9つだね。<br>男：うん、あっ、留学生のキムさんが国に帰るから、キムさんにもあげよう。<br>女：うん、もう一つだね。分かった。<br>女の学生はプレゼント何個を用意しますか。"}]}, {"passage": null, "image": "img/2013-12_L1_4.jpg", "questions": [{"n": 4, "stem": "4ばん<br>男の人は何で温泉に行きますか。", "choices": ["1", "2", "3", "4"], "answer": 2, "explain": "女士說飛機貴、溫泉離機場遠，新幹線方便又快，男士說「じゃあ、そうします」，所以搭新幹線。", "script": "男の人と女の人が話しています。男の人は何で温泉に行きますか。<br>男：今度の夏休みに友達四人で北原温泉に旅行に行こうと思っているんです。<br>女：それはいいですね。私も去年行きましたが、とてもよかったですよ。<br>男：そうですか、北原温泉には何で行くのがいいでしょうか。<br>女：そうですね。飛行機は高いし、温泉は空港から遠いんですよ。新幹線のほうが便利ですよ。駅も近いですし。<br>男：バスや車で行ったら、時間がかかりますか？<br>女：ええ、かかるでしょうね。新幹線が早いと思いますよ。<br>男：じゃあ、そうします。<br>女：車も荷物が多い時は便利ですけど、疲れますからね。<br>男：そうですね。<br>男の人は何で温泉に行きますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん<br>女の留学生はどんなお土産を買いますか。", "choices": ["おかしと にんぎょう", "おかしと はし", "おちゃと にんぎょう", "おちゃと はし"], "answer": 4, "explain": "家人不太吃點心，所以不買巧克力；覺得茶不錯；人偶怕壞，建議買筷子，她說「それも買って帰ります」，所以買茶和筷子。", "script": "女の留学生と男の学生が話しています。女の留学生はどんなお土産を買いますか。<br>男：マリアさん、来週帰国しますね。はじめての日本はどうでしたか。<br>女：短い間でしたが、とても楽しかったです。あのう、日本のお土産を探しているんですが、いいお土産ありませんか？<br>男：そうですね。チョコレートは？日本のチョコレートは美味しいですよ。<br>女：ううん、私の家族はあまりお菓子を食べないので……<br>男：日本のお茶も人気がありますよ。<br>女：そうですね、いいですね。あのう、他になにかありますか？<br>男：えっと、日本の人形や箸もきれいだし、みんな喜ぶと思いますよ。でも、人形が壊れるのが心配ですね。<br>女：そうですね。<br>男：お土産は軽くて壊れにくいのがいいですね。箸のほうがいいかもしれませんね。<br>女：じゃあ、それも買って帰ります。<br>女の留学生はどんなお土産を買いますか。"}]}, {"passage": null, "image": "img/2013-12_L1_6.jpg", "questions": [{"n": 6, "stem": "6ばん<br>学生は来週の授業の時、何を持ってこなければなりませんか。", "choices": ["ちず", "しゃしん", "「まつり」の さくぶん", "「食べもの」の さくぶん"], "answer": 3, "explain": "介紹祭典的作文要在下週上課時帶來；地圖由老師準備、照片由老師拍、食物作文下週上課時寫。", "script": "授業で男の先生が話しています。学生は来週の授業の時、何を持ってこなければなりませんか。<br>男：来週から皆さんの国を紹介するポスターを作ります。例えば、これは日本を紹介するポスターです。日本の地図があります。そして作った人の写真と名前があります。それから日本の祭りというところに、祭りの説明がありますね。その下は日本の食べ物が紹介されています。皆さんは自分の国を紹介します。祭りについては、祭りを紹介する作文を書いて、来週の授業の時に持ってきてください。皆さんの国の食べ物については、来週の授業の時作文を書きましょう。<br>女：来週、地図も持ってきますか？<br>男：地図は私が準備します。それから皆さんの写真は来週の授業の時私が取ります。<br>学生は来週の授業の時、何を持ってこなければなりませんか。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん<br>息子は何を買いますか。", "choices": ["とりにくと なす", "とりにくと りんご", "トマトと なす", "トマトと りんご"], "answer": 4, "explain": "雞肉和茄子家裡都有，缺番茄，蘋果也沒有，所以買番茄和蘋果。", "script": "電話で息子とお母さんが話しています。息子は何を買いますか。<br>男：あ、もしもし、お母さん、元気？<br>女：あっ、一郎？元気よ。<br>男：あのう、ちょっと、教えてくれない？<br>女：なに？<br>男：明日友達が来るから、カレーを作ろうと思っているんだけど、お母さんはカレーにいつも何を入れている？今から買い物に行こうと思っているんだ。<br>女：カレーね、まず鶏肉ね、野菜はナスとトマト。<br>男：うんうん、鶏肉もあるし、ナスもある、あっ、トマトがない。<br>女：そう？それは忘れないでね。ほかには、あっ、リンゴも入れるよ。<br>男：そう、それもないから一緒に買ってこよう。ありがとう。<br>息子は何を買いますか。"}]}, {"passage": null, "image": "img/2013-12_L1_8.jpg", "questions": [{"n": 8, "stem": "8ばん<br>女の人は明日何を持っていきますか。", "choices": ["ア イ", "イ エ", "ア ウ エ", "イ ウ エ"], "answer": 3, "explain": "帶哥哥的相機；感冒已好不需要藥；山上常下雨又會變冷，所以傘和外套都帶。即ア・ウ・エ。", "script": "うちで女の人とお兄さんが話しています。女の人は明日何を持っていきますか。<br>女：お兄ちゃん、私ね、明日友達と山へ行くんだ。<br>男：じゃあ、僕のカメラを持っていく？<br>女：うん、ありがとう。<br>男：風邪を引いていたけど、大丈夫？薬は持った？<br>女：あっ、もう治ったから大丈夫。<br>男：そう？傘は入れた？山ではよく雨が降るから、それに明日は寒くなるから、上着は必要だよ。<br>女：えっ？そうなんだ。じゃあ、両方持って行こう。<br>女の人は明日何を持っていきますか。"}]}]}, {"no": 2, "instruction": "もんだい2では、まず しつもんを 聞いて ください。その あと、もんだいようしを 見て ください。読む 時間が あります。それから 話を 聞いて、もんだいようしの 1から 4の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん<br>女の人はいつ男の人にスーツケースを返しますか。", "choices": ["今週の 木ようび", "今週の 金ようび", "来週の 木ようび", "来週の 金ようび"], "answer": 3, "explain": "女士下週三晚上旅行回來，男士下週五出發，請她週四早上拿來，所以是下週四。", "script": "女の人と男の人が話しています。女の人はいつ男の人にスーツケースを返しますか。<br>女：松本くん、ちょっといい？<br>男：うん、なに？<br>女：私、今週の金曜日から旅行に行くんだけど、スーツケースが壊れてしまったんで、かしてくれない？<br>男：僕も来週使うんだよ。いつ旅行から帰ってくる？<br>女：ええと、来週の水曜日、8月10日の晩。<br>男：僕は金曜日出発なんだ、間に合う？<br>女：帰ってきたらすぐに返すから。お願い！<br>男：分かった。じゃあ、木曜日の朝に持ってこられる？<br>女：うん、大丈夫。ありがとう。<br>女の人はいつ男の人にスーツケースを返しますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 2, "stem": "2ばん<br>男の学生は女の学生に何を頼みましたか。", "choices": ["びょういんに つれて いくこと", "としょかんに 本を かえすこと", "買いものを すること", "ごはんを つくること"], "answer": 2, "explain": "男同學腳受傷不能走，拜託女同學在明天之前幫他把書還到圖書館；食物家裡很多不用買。", "script": "電話で女の学生と男の学生が話しています。男の学生は女の学生に何を頼みましたか。<br>女：もしもし、足の怪我は大丈夫？<br>男：え、病院に行って診てもらったから大丈夫。でも歩けないから困っているんだ。<br>女：私にできることがあったら何でも言って。<br>男：じゃあ、明日までに図書館に本を返さないと行けないんだけど、お願いしてもいい？<br>女：うん、いいよ。食べるものはある？何か買って行こうか？<br>男：食べ物はうちにたくさんあるから、いいよ。<br>女：じゃあ、本は、今日授業の後で取りに行くね。<br>男の学生は女の学生に何を頼みましたか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>男の人は最近どのぐらい運動をしていますか。", "choices": ["毎日", "1週間に 2かい", "1週間に 1かい", "1か月に 1かい"], "answer": 4, "explain": "最近忙到完全沒跑步，只有每月一次和朋友打網球。每週兩次是女士自己。", "script": "女の人と男の人が話しています。男の人は最近どのぐらい運動をしていますか。男の人です。<br>女：最近運動している？<br>男：去年までは毎日走っていたんだけど、最近忙しいから全然走っていないよ。<br>女：でも一週間に一回ぐらいはなにかしている？<br>男：ううん。月に一回友達とテニスをしているけど、ほかには何もしていないよ。本当は一週間に一回は運動したいんだけど。なかなか。<br>女：そう。忙しくても、もう少し何かしたほうがいいと思うよ。私は一週間に二回は運動をしているよ。<br>男の人は最近どのぐらい運動をしていますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん<br>男の学生はどうして、いますぐ女の学生を手伝うことができませんか。", "choices": ["しりょうの コピーを するから", "先生の しごとを てつだうから", "レポートを 出しに 行くから", "じむしょに 行くから"], "answer": 3, "explain": "男同學說「先生の部屋にレポートを出しに行くんです」，是要去交報告，不是幫老師工作。", "script": "大学で女の学生と男の学生が話しています。男の学生はどうして、いますぐ女の学生を手伝うことができませんか。<br>女：中山くん、今から研究会の資料をコピーするんですけど、手伝ってもらえませんか？<br>男：あっ、今先生の部屋に行くところなんです。ちょっと待っていてください。<br>女：ああ、先生が手伝ってもらいたい仕事があると言っていましたね。その仕事ですか？<br>男：いいえ、先生の部屋にレポートを出しに行くんです。だからすぐ終わると思います。<br>女：じゃあ、私これから事務所へ行ってコピーを始めますから、終わったら来てください。<br>男：はい。<br>男の学生はどうして、いますぐ女の学生を手伝うことができませんか。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん<br>男の人は女の人に何をあげますか。", "choices": ["れいぞうこと 電子レンジ", "れいぞうこだけ", "電子レンジと テーブル", "テーブルだけ"], "answer": 2, "explain": "女士家冰箱舊了所以要冰箱；微波爐家裡有新的、房間太小放不下桌子，所以只給冰箱。", "script": "男の人と女の人が話しています。男の人は女の人に何をあげますか。<br>男：ねえ、山田さん、冷蔵庫と電子レンジいらない？<br>女：えっ、どうしたんですか。<br>男：今度姉が結婚して引っ越すんだ。それでいろいろな物が要らなくなるから、僕にくれるんだよ。<br>女：ああ。<br>男：それで、今僕が使っているのを誰かにあげようと思っているんだ。<br>女：それなら、私にください。うちの冷蔵庫もう古いから。<br>男：いいよ、電子レンジもどう？<br>女：ううん、レンジはうちに新しいのがあるんです。<br>男：そっか、あっ、それからテーブルもあげると言われたんだけど、僕の部屋は狭くて置けないと思うんだ、いる？<br>女：テーブルは、私の部屋も狭いんです。<br>男：そっか、分かった。<br>男の人は女の人に何をあげますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 6, "stem": "6ばん<br>二人が子供の時から変わらないものは何だと言っていますか。", "choices": ["ぎんこうの たてもの", "えいがかんの たてもの", "ちゅうしゃじょう", "こうえん"], "answer": 1, "explain": "銀行建築「昔と同じ」，只是周圍蓋了高樓才顯得小（明年才會拆）；電影院已變成停車場，公園是將來才建。", "script": "街で男の人と女の人が話しています。二人が子供の時から変わらないものは何だと言っていますか。変わらないものです。<br>男：僕、今日久しぶりにこの街に来たんですけど。僕達が小学生の頃とは、街がすっかり変わってしまいましたね。マンションが増えていて、びっくりしました。<br>女：ええ、この十年ぐらいの間に、どんどん変わっているんです。あそこに見える銀行、前はこの辺で一番高い建物だったんだけど。<br>男：ええ。<br>女：昔と同じなのに、今は小さく見えます。周りに高いマンションが立ったから。<br>男：本当ですね。あのう、この辺りに小さい映画館がありませんでしたか。子供の頃家族でよく見に来たんですよ。<br>女：ああ、映画館。映画館は駐車場になったんですよ。<br>男：そうですか。<br>女：あ、それにあの銀行の建物も来年には壊されて、公園ができるそうです。<br>男：思い出の場所がなくなってしまうのは寂しいですね。<br>二人が子供の時から変わらないものは何だと言っていますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん<br>男の人は隆くんに何を教えてもらいましたか。", "choices": ["べんきょう", "ギター", "うた", "りょうり"], "answer": 1, "explain": "「よく僕に勉強を教えてくれました」，隆教他功課；吉他是男士教隆的。", "script": "男の人が友達の隆くんの結婚式で話しています。男の人は隆くんに何を教えてもらいましたか。<br>男：隆くん、陽子さん、ご結婚おめでとうございます。僕と隆くんは高校の時からの友達です。隆くんはクラスで一番頭がよくて、よく僕に勉強を教えてくれました。僕はギターの弾き方を教えたんですが、隆くんはすぐ僕より上手になって、ギターを弾きながら、歌も歌っていました。それだけじゃなくて、料理も上手です。隆くん、陽子さんにぜひ料理を教えて、いいえ、美味しい料理を作ってあげてください。<br>男の人は隆くんに何を教えてもらいましたか。"}]}]}, {"no": 3, "instruction": "もんだい3では、えを 見ながら しつもんを 聞いて ください。➡（やじるし）の 人は 何と 言いますか。1から 3の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": "img/2013-12_L3_1.jpg", "questions": [{"n": 1, "stem": "1ばん<br>タクシーに乗っています。ここで降りたいです。なんといいますか。", "choices": ["ここでとまっています。", "ここでとめてください。", "ここで降りてもらいますね。"], "answer": 2, "explain": "請計程車司機停車用「とめてください」（請停車）。", "script": "タクシーに乗っています。ここで降りたいです。なんといいますか。<br>1. ここでとまっています。<br>2. ここでとめてください。<br>3. ここで降りてもらいますね。"}]}, {"passage": null, "image": "img/2013-12_L3_2.jpg", "questions": [{"n": 2, "stem": "2ばん<br>友達が重そうな荷物を運んでいます。手伝いたいです。なんといいますか。", "choices": ["手伝ってくるよ。", "手伝おうか。", "手伝ってもらえる？"], "answer": 2, "explain": "主動提出要幫忙用意志形「～（よ）うか」：「手伝おうか」（我來幫你吧）。3是請對方幫自己。", "script": "友達が重そうな荷物を運んでいます。手伝いたいです。なんといいますか。<br>1. 手伝ってくるよ。<br>2. 手伝おうか。<br>3. 手伝ってもらえる？"}]}, {"passage": null, "image": "img/2013-12_L3_3.jpg", "questions": [{"n": 3, "stem": "3ばん<br>課長に頼まれた資料を作りました。課長になんといいますか。", "choices": ["資料をみせてくださいませんか。", "すぐに資料を作ります。", "資料ができました。"], "answer": 3, "explain": "資料已經做好，向課長報告「資料ができました」（資料完成了）。", "script": "課長に頼まれた資料を作りました。課長になんといいますか。<br>1. 資料をみせてくださいませんか。<br>2. すぐに資料を作ります。<br>3. 資料ができました。"}]}, {"passage": null, "image": "img/2013-12_L3_4.jpg", "questions": [{"n": 4, "stem": "4ばん<br>予約をしていませんが、このホテルに泊まりたいです。なんといいますか。", "choices": ["あのう、部屋はあいていますか。", "こちらに泊まっていますか。", "これから予約してみましょうか。"], "answer": 1, "explain": "沒有預約想入住，先詢問「部屋はあいていますか」（還有空房嗎）。", "script": "予約をしていませんが、このホテルに泊まりたいです。なんといいますか。<br>1. あのう、部屋はあいていますか。<br>2. こちらに泊まっていますか。<br>3. これから予約してみましょうか。"}]}, {"passage": null, "image": "img/2013-12_L3_5.jpg", "questions": [{"n": 5, "stem": "5ばん<br>テストが始まります。辞書が使えるかどうか知りたいです。先生になんと言いますか。", "choices": ["すみません、辞書で調べてもらえますか。", "先生、辞書を見てもいいでしょうか。", "あのう、辞書の使い方を教えてください。"], "answer": 2, "explain": "詢問許可用「～てもいいでしょうか」：「辞書を見てもいいでしょうか」（可以看字典嗎）。", "script": "テストが始まります。辞書が使えるかどうか知りたいです。先生になんと言いますか。<br>1. すみません、辞書で調べてもらえますか。<br>2. 先生、辞書を見てもいいでしょうか。<br>3. あのう、辞書の使い方を教えてください。"}]}]}, {"no": 4, "instruction": "もんだい4では、えなどが ありません。まず ぶんを 聞いて ください。それから、その へんじを 聞いて、1から 3の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん<br>家から学校まで歩いてどのぐらいかかりますか。", "choices": ["十五分です。", "五百メートルです。", "五百円です。"], "answer": 1, "explain": "問走路要花多少時間，回答時間「十五分です」。", "script": "家から学校まで歩いてどのぐらいかかりますか。<br>1. 十五分です。<br>2. 五百メートルです。<br>3. 五百円です。"}]}, {"passage": null, "image": null, "questions": [{"n": 2, "stem": "2ばん<br>あ、田中さん久しぶり、最近お仕事はいかがですか。", "choices": ["あんまり上手じゃないんですよ。", "最近はちょっと忙しいです。", "とても元気だと思います。"], "answer": 2, "explain": "問最近工作如何，回答「最近有點忙」最自然。", "script": "あ、田中さん久しぶり、最近お仕事はいかがですか。<br>1. あんまり上手じゃないんですよ。<br>2. 最近はちょっと忙しいです。<br>3. とても元気だと思います。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>前にこの店に来たことがある？", "choices": ["店の前にあったんです。", "いま来たところです。", "はじめて来ました。"], "answer": 3, "explain": "問以前是否來過這家店，回答「第一次來」。", "script": "前にこの店に来たことがある？<br>1. 店の前にあったんです。<br>2. いま来たところです。<br>3. はじめて来ました。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん<br>今日は楽しかった。またどこか遊びに行こうよ。", "choices": ["まだ遊びに行っていないよ。", "気をつけていってらっしゃい。", "うん、今度は海がいいな。"], "answer": 3, "explain": "對方邀約下次再出去玩，回答「好啊，下次去海邊不錯」。", "script": "今日は楽しかった。またどこか遊びに行こうよ。<br>1. まだ遊びに行っていないよ。<br>2. 気をつけていってらっしゃい。<br>3. うん、今度は海がいいな。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん<br>マリアさんはいつもどうやって漢字を覚えるんですか。", "choices": ["たくさん書いて覚えています。", "多分300字ぐらいだと思います。", "新聞を読む時必要ですから。"], "answer": 1, "explain": "問用什麼方法記漢字，回答「寫很多遍來記」。", "script": "マリアさんはいつもどうやって漢字を覚えるんですか。<br>1. たくさん書いて覚えています。<br>2. 多分300字ぐらいだと思います。<br>3. 新聞を読む時必要ですから。"}]}, {"passage": null, "image": null, "questions": [{"n": 6, "stem": "6ばん<br>何か運動を始めたいんですが、なにがいいと思いますか。", "choices": ["ジョギングはどうですか。", "運動がいいと思います。", "何を始めたんですか。"], "answer": 1, "explain": "對方徵求建議，回答「慢跑怎麼樣？」提出具體運動。", "script": "何か運動を始めたいんですが、なにがいいと思いますか。<br>1. ジョギングはどうですか。<br>2. 運動がいいと思います。<br>3. 何を始めたんですか。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん<br>悪いんだけど、事務所の山田さんにこの書類を届けてきて。", "choices": ["それはいつ届くんですか。", "すぐに書類をもらってきます。", "じゃあ、ちょっと行ってきます。"], "answer": 3, "explain": "被請託送文件，回答「那我去一下」表示接受。", "script": "悪いんだけど、事務所の山田さんにこの書類を届けてきて。<br>1. それはいつ届くんですか。<br>2. すぐに書類をもらってきます。<br>3. じゃあ、ちょっと行ってきます。"}]}, {"passage": null, "image": null, "questions": [{"n": 8, "stem": "8ばん<br>月曜日の会議、16人入れる部屋を予約しておいて。", "choices": ["会議室においておきますね。", "16人ですね、分かりました。", "部屋を16も予約するんですか。"], "answer": 2, "explain": "被交代預約可容納16人的房間，回答「16人對吧，知道了」。", "script": "月曜日の会議、16人入れる部屋を予約しておいて。<br>1. 会議室においておきますね。<br>2. 16人ですね、分かりました。<br>3. 部屋を16も予約するんですか。"}]}]}]}], "webNoAudio": true}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = (D.level || 'N5').toLowerCase() + '-practice-' + D.id;
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
let S = Object.assign({answers:{}, submitted:false, mode:'practice', tab:'all'}, store.get());
const save = () => store.set(S);
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

// theme
(function(){
  let t; try { t = localStorage.getItem('n5-theme'); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const n = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem('n5-theme', n); } catch(e){}
  };
})();

const SHORT = ['文字・語彙','文法・讀解','聽解'];
const allQ = []; // {key, sec, q, node}
const secNodes = [];

function render(){
  const main = $('#main');
  if (D.notes) main.appendChild(el('div','notes','<b>說明：</b>' + D.notes));
  D.sections.forEach((sec, si) => {
    const sn = el('section','sec-wrap'); sn.dataset.sec = si;
    sn.appendChild(el('h2','sec', sec.name));
    const isL = /聴解|聽解/.test(sec.name);
    if (isL && D.audio) sn.appendChild(player(D.audio, '整份聽解錄音（播放器會固定在上方，可邊聽邊作答）'));
    if (isL && !D.audio && !sec.mondai.some(m => m.audio)) sn.appendChild(el('div','notes', D.webNoAudio ? '線上版因版權因素不含聽解錄音；仍可作答，作答後可展開「聽力原文」閱讀。' : '此卷沒有聽解錄音檔，可作答後展開「聽力原文」閱讀。'));
    sec.mondai.forEach(m => {
      const mn = el('div','mondai');
      mn.appendChild(el('h3', null, 'もんだい ' + m.no));
      if (m.instruction) mn.appendChild(el('p','instr', m.instruction));
      if (m.audio) mn.appendChild(player(m.audio, 'もんだい ' + m.no + ' 錄音'));
      (m.groups || []).forEach(g => {
        const gn = el('div','group');
        if (g.image) { const im = el('img'); im.src = g.image; im.loading = 'lazy'; im.alt = ''; gn.appendChild(im); }
        if (g.passage) gn.appendChild(el('div','passage', g.passage));
        g.questions.forEach(q => {
          const key = si + '-' + m.no + '-' + q.n;
          const qn = el('div','q'); qn.dataset.key = key;
          qn.appendChild(el('p','stem', '<span class="qn">' + q.n + '</span>' + (q.stem || '')));
          const cs = el('div','choices');
          const longest = Math.max(...q.choices.map(c => c.replace(/<[^>]+>/g,'').length));
          if (longest > 14) cs.classList.add('long');
          q.choices.forEach((c, ci) => {
            const b = el('button','ch','<span class="k">' + (ci+1) + '</span><span>' + c + '</span>');
            b.onclick = () => pick(key, ci+1);
            cs.appendChild(b);
          });
          qn.appendChild(cs);
          const fb = el('div','fb');
          let inner = '<span class="verdict"></span>';
          if (q.explain) inner += '<div class="ex">' + q.explain + '</div>';
          fb.innerHTML = inner;
          if (q.script) { const d = el('details','script','<summary>聽力原文</summary><div>' + q.script + '</div>'); fb.appendChild(d); }
          qn.appendChild(fb);
          gn.appendChild(qn);
          allQ.push({key, sec: si, q, node: qn, group: gn, mondai: mn});
        });
        mn.appendChild(gn);
      });
      sn.appendChild(mn);
    });
    main.appendChild(sn);
    secNodes.push(sn);
  });
  main.appendChild(el('div','result hidden')).id = 'result';

  const tabs = $('#tabs');
  const mk = (id, label) => { const b = el('button','tab', label); b.dataset.tab = id; b.onclick = () => { S.tab = id; save(); refresh(); scrollTo(0,0); }; tabs.appendChild(b); };
  mk('all','全部');
  D.sections.forEach((s, i) => mk(String(i), SHORT[i] || s.name));
}

function player(src, hint){
  const a = el('div','audio');
  const au = document.createElement('audio');
  au.controls = true; au.preload = 'none'; au.src = encodeURI(src);
  a.appendChild(au);
  a.appendChild(el('span','hint', hint));
  au.onerror = () => { a.querySelector('.hint').textContent = '找不到錄音檔，請確認 mp3 仍在原資料夾：' + src; };
  return a;
}

function pick(key, v){
  if (S.submitted) return;
  if (S.mode === 'practice' && S.answers[key] != null) return; // 練習模式：作答後鎖定
  S.answers[key] = v; save(); refresh();
}

function refresh(){
  $('#mode').value = S.mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  secNodes.forEach((n, i) => n.classList.toggle('hidden', S.tab !== 'all' && String(i) !== S.tab));
  const reveal = S.mode === 'practice' || S.submitted;
  const wrongOnly = $('#wrongOnly').checked;
  let done = 0, right = 0, total = 0;
  allQ.forEach(o => {
    const a = S.answers[o.key];
    const inTab = S.tab === 'all' || String(o.sec) === S.tab;
    if (inTab) { total++; if (a != null) done++; if (a === o.q.answer) right++; }
    const show = a != null && reveal;
    o.node.querySelectorAll('.ch').forEach((b, i) => {
      b.classList.remove('picked','right','wrong');
      if (show) {
        if (i+1 === o.q.answer) b.classList.add('right');
        else if (i+1 === a) b.classList.add('wrong');
      } else if (a === i+1) b.classList.add('picked');
    });
    const fb = o.node.querySelector('.fb');
    fb.classList.toggle('show', show);
    if (show) {
      const v = fb.querySelector('.verdict');
      const ok = a === o.q.answer;
      v.className = 'verdict ' + (ok ? 'ok' : 'ng');
      v.textContent = ok ? '✓ 正確' : '✗ 答錯了，正確答案是 ' + o.q.answer;
    }
    const hideIt = wrongOnly && reveal && (a === o.q.answer || a == null);
    o.node.classList.toggle('hidden', hideIt);
  });
  // 隱藏整組 / 整個 もんだい 若其中的題目都被隱藏
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('hidden', [...g.querySelectorAll('.q')].every(q => q.classList.contains('hidden'))));
  document.querySelectorAll('.mondai').forEach(m => m.classList.toggle('hidden', [...m.querySelectorAll('.group')].every(g => g.classList.contains('hidden'))));
  $('#score').innerHTML = reveal
    ? '已作答 <b>' + done + '</b> / ' + total + '　答對 <b>' + right + '</b>' + (done ? '（' + Math.round(right/done*100) + '%）' : '')
    : '已作答 <b>' + done + '</b> / ' + total + '（交卷後顯示成績）';
  $('#submit').classList.toggle('hidden', S.mode !== 'exam' || S.submitted);
  renderResult(reveal);
  const h = document.querySelector('header.top').offsetHeight;
  document.documentElement.style.setProperty('--hdr', (h + 8) + 'px');
}

function renderResult(reveal){
  const r = $('#result');
  if (!reveal || !Object.keys(S.answers).length) { r.classList.add('hidden'); return; }
  r.classList.remove('hidden');
  let rows = '';
  D.sections.forEach((s, i) => {
    const qs = allQ.filter(o => o.sec === i);
    const ok = qs.filter(o => S.answers[o.key] === o.q.answer).length;
    const dn = qs.filter(o => S.answers[o.key] != null).length;
    rows += '<tr><td>' + s.name + '</td><td class="num">' + ok + ' / ' + qs.length + '</td><td class="num">' + dn + ' 題已答</td></tr>';
  });
  const ok = allQ.filter(o => S.answers[o.key] === o.q.answer).length;
  r.innerHTML = '<b>成績統計</b><table>' + rows + '<tr><th>合計</th><th class="num">' + ok + ' / ' + allQ.length + '</th><th></th></tr></table>';
}

$('#mode').onchange = e => { S.mode = e.target.value; save(); refresh(); };
$('#wrongOnly').onchange = refresh;
$('#submit').onclick = () => {
  const left = allQ.filter(o => S.answers[o.key] == null).length;
  if (left && !confirm('還有 ' + left + ' 題未作答，確定要交卷嗎？')) return;
  S.submitted = true; save(); refresh(); scrollTo(0,0);
};
$('#reset').onclick = () => {
  if (!confirm('清除本卷所有作答紀錄？')) return;
  S.answers = {}; S.submitted = false; save(); $('#wrongOnly').checked = false; refresh();
};
render(); refresh();
</script>
</body>
</html>
