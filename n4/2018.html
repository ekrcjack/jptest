<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">

<title>N4 2018年 真題</title>
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#6b7078; --line:#e3dfd6;
  --accent:#b8412e; --accent-soft:#f6e3df; --ok:#1f7a4d; --ok-soft:#dff1e7; --ng:#b3261e; --ng-soft:#f9e0de;
  --chip:#efebe3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
    --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
  --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","PingFang TC","Noto Sans TC",sans-serif}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.bar h1{font-size:18px;margin:0;flex:1 1 auto;white-space:nowrap}
.bar h1 a{text-decoration:none;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.score{font-size:14px;color:var(--muted)}
.score b{color:var(--ink)}
select.btn{padding:5px 8px}
main{padding:16px 0 120px}
.notes{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
h2.sec{font-size:20px;margin:28px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.mondai{margin:22px 0 10px}
.mondai h3{font-size:16px;margin:0 0 4px;color:var(--accent)}
.instr{font-size:14px;color:var(--muted);margin:0 0 10px}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.passage{background:var(--chip);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}
.group img{max-width:100%;height:auto;display:block;margin:4px auto 12px;border-radius:6px;background:#fff}
.q{padding:10px 0;border-top:1px dashed var(--line)}
.group .q:first-of-type{border-top:0}
.stem{margin:0 0 8px}
.qn{display:inline-block;min-width:28px;padding:0 6px;margin-right:8px;border:1.5px solid var(--ink);border-radius:4px;text-align:center;font-weight:700;font-size:14px;line-height:22px}
.stem u{text-decoration-thickness:1.5px;text-underline-offset:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.choices.long{grid-template-columns:1fr}
.ch{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.ch:hover{border-color:var(--muted)}
.ch .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-top:3px}
.ch.picked{border-color:var(--ink);background:var(--chip)}
.ch.picked .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{border-color:var(--ng);background:var(--ng-soft)}
.ch.wrong .k{background:var(--ng);border-color:var(--ng);color:#fff}
.fb{margin-top:8px;font-size:14.5px;border-left:3px solid var(--line);padding:4px 0 4px 10px;display:none}
.fb.show{display:block}
.fb .verdict{font-weight:700}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.ng{color:var(--ng)}
details.script{margin-top:6px}
details.script summary{cursor:pointer;color:var(--muted);font-size:14px}
details.script div{background:var(--chip);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:14.5px}
.audio{position:sticky;top:var(--hdr,96px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.audio audio{flex:1 1 260px;width:100%}
.audio .hint{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.result{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin:20px 0}
.result table{border-collapse:collapse;width:100%;font-size:14.5px}
.result td,.result th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.result td.num{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.choices{grid-template-columns:1fr 1fr}.bar h1{font-size:16px}}
</style>
</head>

</div></header>

3, "explain": "第一段提到東京車站太大，找不到要換乘的電車月台，因此不知所措，故選3。"}, {"n": 31, "stem": "なぜ山田さんは「私」に声をかけましたか。", "choices": ["「私」が行ったり来たりしているのを見たから", "「私」と一緒にお茶を飲みたいと思ったから", "「私」を山田さんの友達と間違えたから", "「私」が落としたメモを拾ったから"], "answer": 1, "explain": "山田小姐在車站內的咖啡店喝茶時，看到「我」走來走去，所以來搭話，故選1。"}, {"n": 32, "stem": "なぜ②<u>お礼を言いました<\/u>か。", "choices": ["山田さんが、京都に行く新幹線がたくさんあると「私」に教えてくれたから", "山田さんが、帰りが遅くなるかもしれないのに、「私」を案内してくれたから", "山田さんが、「私」が乗る予定の電車の時間のことを心配してくれたから", "山田さんが、「私」の国のいろいろな人に親切にしてくれたと聞いたから"], "answer": 2, "explain": "山田小姐雖要回京都，卻不顧自己可能晚歸，帶「我」到乘車處，所以「我」道謝，故選2。"}, {"n": 33, "stem": "（　　）に入れるのに、いちばんいい文はどれですか。", "choices": ["仕事を頑張ろう", "外国に住んでみたい", "困っている人に親切にしよう", "東京駅のことをよく知りたい"], "answer": 3, "explain": "「我」受到山田小姐的幫助，心裡覺得溫暖，也想像她一樣對有困難的人親切，故選3。"}]}]}, {"no": 6, "instruction": "右のページのお知らせを見て、下の質問に答えてください。答えは、1・2・3・4から、いちばんいいものを一つえらんでください。", "groups": [{"passage": "<b>青野市ニュース<\/b><br>「春を楽しもう」<br>青野市では、毎月、食事会や音楽会などを開いています。<br><br>3月と4月の予定（名前（料金）／月・日／場所・時間／集まる時間）<br>① 食事会（500円）青野市の有名な料理を一緒に作って、食べます。／3/5（日）／花村小学校 11時～14時／11時<br>② 音楽会（800円）お茶とお菓子を楽しみながら、音楽を聞きます。／3/11（土）／さくら寺 14時～16時／13時50分<br>③ 音楽会（950円）ピアノやバイオリンのコンサートです。／4/8（土）／市民体育館 17時～19時／16時50分<br>④ バス旅行（800円）バスで東川海岸に行って、海を見ながらお弁当を食べます。／4/15（土）／東川海岸 8時～14時／市民体育館に8時<br>⑤ お祭り（お金はかかりません）毎年行われているお祭りです。歌や踊りを楽しみましょう。／4/23（日）／東公園 17時～21時／17時より後の好きなとき<br>⑥ 音楽会（1,200円）レストランで食事をしながら、ピアノを楽しみましょう。／4/29（土）／レストラン「黒川」12時～14時／11時50分<br><br>青野市「春を楽しもう」係　電話：(0410)28-1002　Eメール：tanoshimo@aono.jp", "image": "img/2018_R6_1.jpg", "questions": [{"n": 34, "stem": "ハメスさんとマリアさんは、「春を楽しもう」に行きたいと思っています。4月に行われるもので、お店の中で音楽を聞きながら、お昼に食事ができるものがいいです。ハメスさんたちが選べるのは、どれですか。", "choices": ["②", "③", "⑤", "⑥"], "answer": 4, "explain": "條件：4月、在店內、邊聽音樂邊吃午餐。只有⑥（4/29在餐廳「黒川」12時～14時，邊吃飯邊欣賞鋼琴）符合，故選4。"}, {"n": 35, "stem": "ジーナさんは、「春を楽しもう」に行こうと思っています。土曜日に行きたいですが、集まる時間が13時より早いものには行けません。料金は1,000円以下がいいです。ジーナさんが選べるのは、どれですか。", "choices": ["②と③", "②と③と④", "②と③と⑤", "③と⑤"], "answer": 1, "explain": "條件：星期六、集合時間不早於13時、費用1,000日圓以下。②（3/11、13時50分、800日圓）與③（4/8、16時50分、950日圓）符合；④集合8時太早、⑥1,200日圓太貴，故選1。"}]}]}]}, {"name": "聴解", "mondai": [{"no": 1, "instruction": "もんだい1では、まず しつもんを 聞いて ください。それから 話を 聞いて、もんだいようしの 1から 4の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": "img/2018_L1_1.jpg", "questions": [{"n": 1, "stem": "1ばん　店の人は何を使って絵本を包みますか。", "choices": ["アウ", "アエ", "イウ", "イエ"], "answer": 1, "explain": "女士選了船圖案的包裝紙（ア）和細的緞帶（ウ），故選1。", "script": "本屋で店の人と女の人が話しています。店の人は何を使って絵本を包みますか。<br>男：いらっしゃいませ。<br>女：この絵本を下さい。贈り物なので、きれいに包んでくれませんか。<br>男：はい。包む紙は2種類あります。こちらの船の絵と花の絵とどちらがいいでしょうか。<br>女：船の絵がいいです。リボンもつけてください。<br>男：はい。細いのと太いのがありますが、どちらにしますか。<br>女：そうですね。細いのにします。<br>男：分かりました。では、少しお待ちください。<br>店の人は何を使って絵本を包みますか。"}]}, {"passage": null, "image": "img/2018_L1_2.jpg", "questions": [{"n": 2, "stem": "2ばん　男の学生はいつまでに本を返さなければなりませんか。", "choices": ["1", "2", "3", "4"], "answer": 3, "explain": "老師23日（星期五）要用，原本說前一天（22日星期四）前歸還，但星期四老師不在學校，所以要再前一天，即21日（星期三），故選3。", "script": "先生の部屋で男の学生と先生が話しています。男の学生はいつまでに本を返さなければなりませんか。<br>男：先生、この本を借りてもいいですか。<br>女：いいですよ。<br>男：いつまでに返さなければなりませんか。<br>女：ええと、今日は七日ですね、再来週の金曜日、えっと、23日に授業で使いたいですから、授業の前の日までに返してください。<br>男：はい。木曜日ですね。<br>女：あ、すみません、その前の日までにお願いします。再来週の木曜日は、学校に来ません。<br>男：はい。分かりました。<br>男の学生はいつまでに本を返さなければなりませんか。"}]}, {"passage": null, "image": "img/2018_L1_3.jpg", "questions": [{"n": 3, "stem": "3ばん　留学生は小学校に何を持っていかなければなりませんか。", "choices": ["1", "2", "3", "4"], "answer": 2, "explain": "要帶的是自己國家的照片和拖鞋；摺紙用小學的，午餐由小學準備，故選2。", "script": "日本語学校で先生が話しています。留学生は小学校に何を持っていかなければなりませんか。<br>男：えー、来週、みなみ小学校へ行って、折り紙を子供たちに習いますね。皆さんは、自分の国について写真を見せながら話しますね。写真を忘れないようにしてください。あ、折り紙は小学校にあるものを使います。それから、小学校の建物に入るときには、靴を脱がなければなりませんから、スリッパを持っていってください。お昼ごはんは必要ありません。小学校が準備してくれます。<br>留学生は小学校に何を持っていかなければなりませんか。"}]}, {"passage": null, "image": "img/2018_L1_4.jpg", "questions": [{"n": 4, "stem": "4ばん　男の学生は何を書きますか。", "choices": ["アイウエ", "アイウ", "イウエ", "イウ"], "answer": 4, "explain": "電話號碼不用寫，班級也不要寫，只需寫名字（イ）和住址（ウ），故選4。", "script": "日本語学校で事務所の人と男の学生が話しています。男の学生は何を書きますか。<br>女：キムさん、こんにちは。どうしましたか。<br>男：あの、先週引っ越しをしたんですが。<br>女：そうですか。じゃ、この紙に名前と新しい住所と電話番号を書いてください。<br>男：はい。あのう、電話番号も書かなければなりませんか。変わったのは住所だけです。<br>女：じゃ、電話番号はいいです。それから、クラスは、来週新しいクラスに変わりますから、書かないでください。<br>男：はい。<br>男の学生は何を書きますか。"}]}, {"passage": null, "image": "img/2018_L1_5.jpg", "questions": [{"n": 5, "stem": "5ばん　女の人はどこから資料を持っていきますか。", "choices": ["1", "2", "3", "4"], "answer": 3, "explain": "先說下面數來第二格，後來更正為「再上面一格」，即下面數來第三格（圖中的3），故選3。", "script": "会社で女の人と男の人が電話で話しています。女の人はどこから資料を持っていきますか。<br>女：はい、鈴木です。<br>男：あ、もしもし。木村だけど、ごめん、急いで会議室まで資料を持ってきてもらえる？<br>女：はい。<br>男：僕の机の引き出しに入っているんだ。<br>女：はい。<br>男：ええと、多分、引き出しの下から2番目に入っていると思う。茶色い封筒に入っているからすぐ分かると思うよ。<br>女：はい、分かりました。下から2番目ですね。<br>男：あ、ごめん。そのもう一つ上だ。<br>女：はい、急いで持っていきます。<br>女の人はどこから資料を持っていきますか。"}]}, {"passage": null, "image": "img/2018_L1_6.jpg", "questions": [{"n": 6, "stem": "6ばん　女の店員はこれから何をしなければなりませんか。", "choices": ["1", "2", "3", "4"], "answer": 3, "explain": "店內已掃完，店門前中午掃過，窗戶由男店員負責，女店員只要把垃圾拿到店後面，故選3。", "script": "コンビニで男の店員と女の店員が話しています。女の店員はこれから何をしなければなりませんか。<br>男：田中さん、ごくろうさま。田中さんの仕事は3時までだから、そろそろ終わりだね。店の中の掃除は終わった？<br>女：はい。<br>男：店の前は昼に掃除したからまだきれいだね。じゃ、最後にごみ箱のごみを店の裏に持っていって。ごみを置いておくところは分かる？<br>女：はい。あのう、すみません、まだ、窓の掃除が終わっていないんです。<br>男：それは、僕がやるからいいよ。じゃ、今頼んだことをやってから帰ってね。<br>女：はい。<br>女の店員はこれから何をしなければなりませんか。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん　このクラスの留学生はどこでテキストを買いますか。", "choices": ["えき前の ほんや", "大学の 中の ほんや", "じむしょ", "しょくどうの 前"], "answer": 3, "explain": "書店沒賣，食堂前賣的不是這門課用的；要在事務所付錢領取課本，故選3。", "script": "大学で先生が話しています。このクラスの留学生はどこでテキストを買いますか。<br>男：この授業では「日本語1」というテキストを使います。駅前の本屋や大学の中の本屋などには売っていませんから、私が皆さんのテキストを頼んでおきます。来週の授業の前に、事務所でお金を払って、テキストをもらってください。今、食堂の前でも日本語のテキストを売っていますけれど、この授業で使うものはありません。似ている名前のテキストがありますから、間違えないようにしてください。<br>このクラスの留学生はどこでテキストを買いますか。"}]}, {"passage": null, "image": "img/2018_L1_8.jpg", "questions": [{"n": 8, "stem": "8ばん　男の人は、来週の日曜日体育館に何を持ってこなければなりませんか。", "choices": ["アイ", "アウ", "イウ", "イ"], "answer": 1, "explain": "費用在使用當天付，所以要帶錢（ア）；還需要在體育館穿的鞋（イ）；桌球用具館內有，故選1。", "script": "町の体育館で男の人と受付の人が話しています。男の人は、来週の日曜日体育館に何を持ってこなければなりませんか。<br>男：すみません。来週の日曜日、体育館で卓球がしたいんですが。<br>女：はい。卓球は、一人2時間、300円ですが、何時間しますか。<br>男：2時間です。<br>女：では、こちらに名前と、利用時間のところに2時間と書いてください。<br>男：あのう、お金は今日払いますか。<br>女：あ、利用するとき、お願いします。<br>男：はい。<br>女：それから、卓球をするとき、体育館で履く靴が必要です。卓球の道具はこちらにありますので、自由に使ってください。<br>男：はい。ありがとうございます。<br>男の人は、来週の日曜日体育館に何を持ってこなければなりませんか。"}]}]}, {"no": 2, "instruction": "もんだい2では、まず しつもんを 聞いて ください。その あと、もんだいようしを 見て ください。読む 時間が あります。それから 話を 聞いて、もんだいようしの 1から 4の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん　女の人は、昨日友達と一緒に何をしたと言っていますか。", "choices": ["うみの ちかくで しょくじした", "山に のぼった", "うみで およいだ", "かいがんを さんぽした"], "answer": 1, "explain": "昨天只在海邊的店吃了飯；登山是下次的計畫，游泳和散步因朋友有事而沒做，故選1。", "script": "男の人と女の人が話しています。女の人は、昨日友達と一緒に何をしたと言っていますか。<br>男：昨日はいい天気でしたね。どこかに出掛けましたか。<br>女：ええ、友達と海の近くの店に行って、食事をしました。学生のとき、よく一緒に山に登っていた友達なんですが、久しぶりに会ったんです。<br>男：じゃ、話すことがたくさんあったでしょう。<br>女：ええ。今度また二人で山に登ることにしました。<br>男：そうですか。昨日は暑かったから、海で泳いだんですか。<br>女：いえ。泳いだり、海岸を散歩したりしたかったんですけど、友達に用事ができてしまって、食事のあと、すぐに帰りました。残念です。<br>女の人は、昨日友達と一緒に何をしたと言っていますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 2, "stem": "2ばん　学生は、工場で何を作っているときに、見学をしますか。", "choices": ["ジュース", "アイスクリーム", "キャンディー", "クッキー"], "answer": 2, "explain": "下週不做果汁，所以改為參觀製作冰淇淋；餅乾只是伴手禮，故選2。", "script": "教室で先生が学生に話しています。学生は、工場で何を作っているときに、見学をしますか。<br>男：来週はクラスで工場の見学に行きます。ジュースで有名な会社の工場ですが、アイスクリームやキャンディー、それからクッキーも作っているんですよ。本当はジュースを作るときに、見学したかったんですが、来週はジュースは作られていないそうなので、皆さんはアイスクリームを見ることになりました。見学のあと、クッキーのお土産がもらえるそうです。<br>学生は、工場で何を作っているときに、見学をしますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん　男の学生は、いつ山本さんに手紙を渡しますか。", "choices": ["山本さんが きょうしつに いるとき", "山本さんが きょうしつを 出たとき", "山本さんが としょかんに いるとき", "山本さんが としょかんを 出たとき"], "answer": 4, "explain": "圖書館人多會害羞，最後決定在外面等，山本從圖書館出來時親手交給她，故選4。", "script": "授業のあとで、男の学生と女の学生が廊下で話しています。男の学生は、いつ山本さんに手紙を渡しますか。<br>男：森さん、この手紙を山本さんに渡してくれない？<br>女：え、何？<br>男：あのう、僕、山本さんのことが好きで、僕の気持ちを手紙に書いたんだけど、なかなか渡せないんだ。朝、教室で渡そうと思ったんだけど、恥ずかしくてだめで、今、山本さんが教室を出たときもやっぱり渡せなかったんだ。<br>女：自分で渡したほうがいいよ。山本さんなら授業のあと、いつも30分ぐらい図書館にいるよ。<br>男：図書館は人が多いから、恥ずかしいよ。<br>女：じゃ、出てきたときはどう？<br>男：う―ん。<br>女：がんばって。<br>男：うん、行ってみる。外で待って、自分で渡すよ。<br>男の学生は、いつ山本さんに手紙を渡しますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん　さくら動物園はオープンの日にどうなりますか。", "choices": ["あく 時間が はやく なる", "しまる 時間が おそく なる", "中学生いかは ただに なる", "チケットが 安く なる"], "answer": 2, "explain": "平常營業到下午5點，開幕當天開到晚上8點，即關門時間延後，故選2。", "script": "ラジオを聞いています。さくら動物園はオープンの日にどうなりますか。オープンの日です。<br>女：今月二十日金曜日に、さくら公園の隣にさくら動物園がオープンします。動物園は毎日10時から夕方5時までですが、オープンの日は午後8時まで開いているそうです。お仕事のあとにお子さんと一緒にいかがでしょうか。休みは毎週木曜です。チケットは600円で、中学生は500円、小学生以下のお子さんはただです。毎月初めの土曜日には、チケットが安くなって、300円で入れます。ぜひ、行ってみてください。<br>さくら動物園はオープンの日にどうなりますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん　女の留学生は、日本の自動販売機について、どんなことに驚いたと言っていますか。", "choices": ["いろいろな ばしょに おいて あること", "うって いる ものの しゅるいが 多いこと", "ことばを 話すこと", "お金が ぬすまれないこと"], "answer": 2, "explain": "女留學生說「私が驚いたのは種類だよ」，讓她驚訝的是販賣的商品種類多，故選2。", "script": "女の留学生と男の留学生が話しています。女の留学生は、日本の自動販売機について、どんなことに驚いたと言っていますか。女の留学生です。<br>女：ねえ、日本に来て、日本の自動販売機に驚かなかった？<br>男：驚いた。公園、病院、海、どこに行ってもあるから、すごいよ。<br>女：私が驚いたのは種類だよ。私の国では、売っているのは飲み物がほとんどだよ。<br>男：日本ではバナナや花、服も見たことがある。<br>女：うん。<br>男：言葉を話す自動販売機もあって、東京では東京の言葉を、大阪では大阪の言葉を話すんだよ。<br>女：店員みたいだね。日本では外に置いてあっても、中のお金が盗まれたりしないから、自動販売機がたくさんあるのかもしれないね。<br>女の留学生は、日本の自動販売機について、どんなことに驚いたと言っていますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 6, "stem": "6ばん　卵が安くなる時間は、何時から何時までですか。", "choices": ["5時から 5時半まで", "5時から 6時まで", "5時半から 6時まで", "5時半から 6時半まで"], "answer": 4, "explain": "現在5點，還有30分鐘才開始，所以5點半開始，持續1小時到6點半，故選4。", "script": "スーパーで客と店の人が話しています。卵が安くなる時間は、何時から何時までですか。<br>女：すみません、こちらのお店のホームページに、今日は「卵が安い」と書いてあったんですが、売り場はどこですか。<br>男：あそこですが、すみません、お客様。卵が安くなるサービスは、夕方の1時間だけなんです。<br>女：えっ、何時からですか。もう終わってしまいましたか。<br>男：いえ、まだです。今、ちょうど5時ですから、始まるまで30分あります。<br>女：分かりました。<br>卵が安くなる時間は、何時から何時までですか。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん　男の人は、どうして東公園がいいと言っていますか。", "choices": ["食べものの 店が たくさん あるから", "まつりが あって にぎやかだから", "ふねの 上で さくらが 見られるから", "会社から あるいて 行けるから"], "answer": 3, "explain": "男士說東公園有池塘，可以坐船賞櫻；攤販多、熱鬧是北公園，走路也到不了，故選3。", "script": "会社で女の人と男の人が花見の場所について話しています。男の人は、どうして東公園がいいと言っていますか。<br>女：土曜日、仕事の帰りに花見に行かない？<br>男：いいね。<br>女：どこがいい？<br>男：東公園がいいよ。桜は東公園と北公園が有名だけど、北公園は毎年すごく込むんだよ。公園の中に食べ物の店がたくさん出ていて、歩いていても、なかなか前に進めないんだ。<br>女：お祭りみたいで、にぎやかで楽しそうだけど、ちょっと疲れるね。<br>男：東公園も人は多いんだけど、池があって、舟に乗って桜が見られるから楽しいよ。<br>女：面白そう。東公園は会社からは歩いて行ける？<br>男：えっと、歩くのは無理だけど、バスなら15分で着くよ。<br>女：じゃ、東公園に行こう。<br>男の人は、どうして東公園がいいと言っていますか。"}]}]}, {"no": 3, "instruction": "もんだい3では、えを 見ながら しつもんを 聞いて ください。➡（やじるし）の 人は 何と 言いますか。1から 3の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": "img/2018_L3_1.jpg", "questions": [{"n": 1, "stem": "1ばん　友達がかわいいネックレスをしています。買った店が知りたいです。何と言いますか。", "choices": ["どの店で買うつもりですか。", "それはどこで買ったんですか。", "買ったかどうか教えてください。"], "answer": 2, "explain": "想知道朋友在哪裡買的，用過去式詢問「それはどこで買ったんですか」，故選2。", "script": "友達がかわいいネックレスをしています。買った店が知りたいです。何と言いますか。<br>1. どの店で買うつもりですか。<br>2. それはどこで買ったんですか。<br>3. 買ったかどうか教えてください。"}]}, {"passage": null, "image": "img/2018_L3_2.jpg", "questions": [{"n": 2, "stem": "2ばん　机の下に自分の消しゴムが落ちました。友達に取ってもらいたいです。何と言いますか。", "choices": ["あ、消しゴムを取ってあげようか。", "ごめん、消しゴムを拾ってくれる？", "ねえ、消しゴムが落ちたそうだよ。"], "answer": 2, "explain": "請朋友幫忙撿自己的橡皮擦，用「～てくれる？」；1是自己幫別人撿，故選2。", "script": "机の下に自分の消しゴムが落ちました。友達に取ってもらいたいです。何と言いますか。<br>1. あ、消しゴムを取ってあげようか。<br>2. ごめん、消しゴムを拾ってくれる？<br>3. ねえ、消しゴムが落ちたそうだよ。"}]}, {"passage": null, "image": "img/2018_L3_3.jpg", "questions": [{"n": 3, "stem": "3ばん　エレベーターの中です。ほかの人が降りたあとで降ります。何と言いますか。", "choices": ["どうぞお先に。", "前へ行きます。", "あとでお願いします。"], "answer": 1, "explain": "讓別人先下電梯，說「どうぞお先に（請先走）」，故選1。", "script": "エレベーターの中です。ほかの人が降りたあとで降ります。何と言いますか。<br>1. どうぞお先に。<br>2. 前へ行きます。<br>3. あとでお願いします。"}]}, {"passage": null, "image": "img/2018_L3_4.jpg", "questions": [{"n": 4, "stem": "4ばん　友達がかばんを閉めるのを忘れています。何と言いますか。", "choices": ["かばんを開けておいてね。", "かばんが閉まったままだよ。", "かばんが開いているよ。"], "answer": 3, "explain": "提醒朋友包包沒關，說「かばんが開いているよ（包包開著喔）」，故選3。", "script": "友達がかばんを閉めるのを忘れています。何と言いますか。<br>1. かばんを開けておいてね。<br>2. かばんが閉まったままだよ。<br>3. かばんが開いているよ。"}]}, {"passage": null, "image": "img/2018_L3_5.jpg", "questions": [{"n": 5, "stem": "5ばん　読み方が知りたいです。何と言いますか。", "choices": ["どうやって書いたんですか。", "何と書いてあるんですか。", "何を書いておきましょうか。"], "answer": 2, "explain": "想知道字怎麼念，問「何と書いてあるんですか（上面寫著什麼）」，故選2。", "script": "読み方が知りたいです。何と言いますか。<br>1. どうやって書いたんですか。<br>2. 何と書いてあるんですか。<br>3. 何を書いておきましょうか。"}]}]}, {"no": 4, "instruction": "もんだい4では、えなどが ありません。まず ぶんを 聞いて ください。それから、その へんじを 聞いて、1から 3の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん", "choices": ["すみません。いただきます。", "もう一杯どうぞ。", "いえ、どういたしまして。"], "answer": 1, "explain": "對方問「要不要再來一杯茶？」，接受好意時說「すみません。いただきます（不好意思，那我就不客氣了）」，故選1；3「いえ、どういたしまして」是回應道謝的用語。", "script": "よかったら、お茶をもう一杯いかがですか。<br>1. すみません。いただきます。<br>2. もう一杯どうぞ。<br>3. いえ、どういたしまして。"}]}, {"passage": null, "image": null, "questions": [{"n": 2, "stem": "2ばん", "choices": ["話していませんよ。", "あ、今は、手伝えないんですね。", "はい。何ですか。"], "answer": 3, "explain": "對方問「現在方便說話嗎？」，回答「はい。何ですか（好的，什麼事？）」，故選3。", "script": "山本さん、忙しそうだけど、今ちょっと話せる？<br>1. 話していませんよ。<br>2. あ、今は、手伝えないんですね。<br>3. はい。何ですか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん", "choices": ["それがいいね。", "プレゼントをあげようよ。", "んー、Ｔシャツはどう？"], "answer": 3, "explain": "對方問禮物要送什麼，提出建議「Tシャツはどう？（T恤如何？）」，故選3。", "script": "リンさん、もうすぐ森さんの誕生日だね。プレゼントは、何にしようか。<br>1. それがいいね。<br>2. プレゼントをあげようよ。<br>3. んー、Ｔシャツはどう？"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん", "choices": ["じゃ、ここに置いておきます。", "いえ、僕はもう使いませんよ。", "すぐ片付けましょうか。"], "answer": 1, "explain": "對方說資料等一下還要用，不必收，所以回答「那我就先放在這裡」，故選1。", "script": "あ、その資料、あとで使うから、まだ片付けなくてもいいですよ。<br>1. じゃ、ここに置いておきます。<br>2. いえ、僕はもう使いませんよ。<br>3. すぐ片付けましょうか。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん", "choices": ["それは、あげられないよ。", "うん、何でも聞いて。", "ぜひ、お願いするよ。"], "answer": 2, "explain": "學弟妹請教選課方法，學長姐爽快答應「何でも聞いて（儘管問）」，故選2。", "script": "先輩、あの、大学の授業の選び方について教えてもらえませんか。<br>1. それは、あげられないよ。<br>2. うん、何でも聞いて。<br>3. ぜひ、お願いするよ。"}]}, {"passage": null, "image": null, "questions": [{"n": 6, "stem": "6ばん", "choices": ["あまりしませんでした。", "それはよかったです。", "すっかり治りました。"], "answer": 3, "explain": "對方問傷好了沒，回答「すっかり治りました（已經完全好了）」，故選3。", "script": "あ、山田さん。けがはもうよくなりましたか。<br>1. あまりしませんでした。<br>2. それはよかったです。<br>3. すっかり治りました。"}]}, {"passage": null, "image": null, "questions": [{"n": 7, "stem": "7ばん", "choices": ["卒業できることになりました。", "国に帰って、貿易の仕事をします。", "銀行で働いたことがあります。"], "answer": 2, "explain": "對方問畢業後的打算，回答「回國從事貿易工作」，故選2。", "script": "リーさん、大学を卒業したら、どうするか決まりましたか。<br>1. 卒業できることになりました。<br>2. 国に帰って、貿易の仕事をします。<br>3. 銀行で働いたことがあります。"}]}, {"passage": null, "image": null, "questions": [{"n": 8, "stem": "8ばん", "choices": ["え、ないんですか。", "じゃ、教えてください。", "分かりませんでした。"], "answer": 1, "explain": "對方問放在這裡的會議資料知不知道在哪，回答「咦，不見了嗎？」，故選1。", "script": "ねえ、ここにあった会議の資料を知らない？<br>1. え、ないんですか。<br>2. じゃ、教えてください。<br>3. 分かりませんでした。"}]}]}]}], "webNoAudio": true}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = (D.level || 'N5').toLowerCase() + '-practice-' + D.id;
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
let S = Object.assign({answers:{}, submitted:false, mode:'practice', tab:'all'}, store.get());
const save = () => store.set(S);
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

// theme
(function(){
  let t; try { t = localStorage.getItem('n5-theme'); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const n = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem('n5-theme', n); } catch(e){}
  };
})();

const SHORT = ['文字・語彙','文法・讀解','聽解'];
const allQ = []; // {key, sec, q, node}
const secNodes = [];

function render(){
  const main = $('#main');
  if (D.notes) main.appendChild(el('div','notes','<b>說明：</b>' + D.notes));
  D.sections.forEach((sec, si) => {
    const sn = el('section','sec-wrap'); sn.dataset.sec = si;
    sn.appendChild(el('h2','sec', sec.name));
    const isL = /聴解|聽解/.test(sec.name);
    if (isL && D.audio) sn.appendChild(player(D.audio, '整份聽解錄音（播放器會固定在上方，可邊聽邊作答）'));
    if (isL && !D.audio && !sec.mondai.some(m => m.audio)) sn.appendChild(el('div','notes', D.webNoAudio ? '線上版因版權因素不含聽解錄音；仍可作答，作答後可展開「聽力原文」閱讀。' : '此卷沒有聽解錄音檔，可作答後展開「聽力原文」閱讀。'));
    sec.mondai.forEach(m => {
      const mn = el('div','mondai');
      mn.appendChild(el('h3', null, 'もんだい ' + m.no));
      if (m.instruction) mn.appendChild(el('p','instr', m.instruction));
      if (m.audio) mn.appendChild(player(m.audio, 'もんだい ' + m.no + ' 錄音'));
      (m.groups || []).forEach(g => {
        const gn = el('div','group');
        if (g.image) { const im = el('img'); im.src = g.image; im.loading = 'lazy'; im.alt = ''; gn.appendChild(im); }
        if (g.passage) gn.appendChild(el('div','passage', g.passage));
        g.questions.forEach(q => {
          const key = si + '-' + m.no + '-' + q.n;
          const qn = el('div','q'); qn.dataset.key = key;
          qn.appendChild(el('p','stem', '<span class="qn">' + q.n + '</span>' + (q.stem || '')));
          const cs = el('div','choices');
          const longest = Math.max(...q.choices.map(c => c.replace(/<[^>]+>/g,'').length));
          if (longest > 14) cs.classList.add('long');
          q.choices.forEach((c, ci) => {
            const b = el('button','ch','<span class="k">' + (ci+1) + '</span><span>' + c + '</span>');
            b.onclick = () => pick(key, ci+1);
            cs.appendChild(b);
          });
          qn.appendChild(cs);
          const fb = el('div','fb');
          let inner = '<span class="verdict"></span>';
          if (q.explain) inner += '<div class="ex">' + q.explain + '</div>';
          fb.innerHTML = inner;
          if (q.script) { const d = el('details','script','<summary>聽力原文</summary><div>' + q.script + '</div>'); fb.appendChild(d); }
          qn.appendChild(fb);
          gn.appendChild(qn);
          allQ.push({key, sec: si, q, node: qn, group: gn, mondai: mn});
        });
        mn.appendChild(gn);
      });
      sn.appendChild(mn);
    });
    main.appendChild(sn);
    secNodes.push(sn);
  });
  main.appendChild(el('div','result hidden')).id = 'result';

  const tabs = $('#tabs');
  const mk = (id, label) => { const b = el('button','tab', label); b.dataset.tab = id; b.onclick = () => { S.tab = id; save(); refresh(); scrollTo(0,0); }; tabs.appendChild(b); };
  mk('all','全部');
  D.sections.forEach((s, i) => mk(String(i), SHORT[i] || s.name));
}

function player(src, hint){
  const a = el('div','audio');
  const au = document.createElement('audio');
  au.controls = true; au.preload = 'none'; au.src = encodeURI(src);
  a.appendChild(au);
  a.appendChild(el('span','hint', hint));
  au.onerror = () => { a.querySelector('.hint').textContent = '找不到錄音檔，請確認 mp3 仍在原資料夾：' + src; };
  return a;
}

function pick(key, v){
  if (S.submitted) return;
  if (S.mode === 'practice' && S.answers[key] != null) return; // 練習模式：作答後鎖定
  S.answers[key] = v; save(); refresh();
}

function refresh(){
  $('#mode').value = S.mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  secNodes.forEach((n, i) => n.classList.toggle('hidden', S.tab !== 'all' && String(i) !== S.tab));
  const reveal = S.mode === 'practice' || S.submitted;
  const wrongOnly = $('#wrongOnly').checked;
  let done = 0, right = 0, total = 0;
  allQ.forEach(o => {
    const a = S.answers[o.key];
    const inTab = S.tab === 'all' || String(o.sec) === S.tab;
    if (inTab) { total++; if (a != null) done++; if (a === o.q.answer) right++; }
    const show = a != null && reveal;
    o.node.querySelectorAll('.ch').forEach((b, i) => {
      b.classList.remove('picked','right','wrong');
      if (show) {
        if (i+1 === o.q.answer) b.classList.add('right');
        else if (i+1 === a) b.classList.add('wrong');
      } else if (a === i+1) b.classList.add('picked');
    });
    const fb = o.node.querySelector('.fb');
    fb.classList.toggle('show', show);
    if (show) {
      const v = fb.querySelector('.verdict');
      const ok = a === o.q.answer;
      v.className = 'verdict ' + (ok ? 'ok' : 'ng');
      v.textContent = ok ? '✓ 正確' : '✗ 答錯了，正確答案是 ' + o.q.answer;
    }
    const hideIt = wrongOnly && reveal && (a === o.q.answer || a == null);
    o.node.classList.toggle('hidden', hideIt);
  });
  // 隱藏整組 / 整個 もんだい 若其中的題目都被隱藏
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('hidden', [...g.querySelectorAll('.q')].every(q => q.classList.contains('hidden'))));
  document.querySelectorAll('.mondai').forEach(m => m.classList.toggle('hidden', [...m.querySelectorAll('.group')].every(g => g.classList.contains('hidden'))));
  $('#score').innerHTML = reveal
    ? '已作答 <b>' + done + '</b> / ' + total + '　答對 <b>' + right + '</b>' + (done ? '（' + Math.round(right/done*100) + '%）' : '')
    : '已作答 <b>' + done + '</b> / ' + total + '（交卷後顯示成績）';
  $('#submit').classList.toggle('hidden', S.mode !== 'exam' || S.submitted);
  renderResult(reveal);
  const h = document.querySelector('header.top').offsetHeight;
  document.documentElement.style.setProperty('--hdr', (h + 8) + 'px');
}

function renderResult(reveal){
  const r = $('#result');
  if (!reveal || !Object.keys(S.answers).length) { r.classList.add('hidden'); return; }
  r.classList.remove('hidden');
  let rows = '';
  D.sections.forEach((s, i) => {
    const qs = allQ.filter(o => o.sec === i);
    const ok = qs.filter(o => S.answers[o.key] === o.q.answer).length;
    const dn = qs.filter(o => S.answers[o.key] != null).length;
    rows += '<tr><td>' + s.name + '</td><td class="num">' + ok + ' / ' + qs.length + '</td><td class="num">' + dn + ' 題已答</td></tr>';
  });
  const ok = allQ.filter(o => S.answers[o.key] === o.q.answer).length;
  r.innerHTML = '<b>成績統計</b><table>' + rows + '<tr><th>合計</th><th class="num">' + ok + ' / ' + allQ.length + '</th><th></th></tr></table>';
}

$('#mode').onchange = e => { S.mode = e.target.value; save(); refresh(); };
$('#wrongOnly').onchange = refresh;
$('#submit').onclick = () => {
  const left = allQ.filter(o => S.answers[o.key] == null).length;
  if (left && !confirm('還有 ' + left + ' 題未作答，確定要交卷嗎？')) return;
  S.submitted = true; save(); refresh(); scrollTo(0,0);
};
$('#reset').onclick = () => {
  if (!confirm('清除本卷所有作答紀錄？')) return;
  S.answers = {}; S.submitted = false; save(); $('#wrongOnly').checked = false; refresh();
};
render(); refresh();
</script>
</body>
</html>
