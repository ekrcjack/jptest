<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#6b7078; --line:#e3dfd6;
  --accent:#b8412e; --accent-soft:#f6e3df; --ok:#1f7a4d; --ok-soft:#dff1e7; --ng:#b3261e; --ng-soft:#f9e0de;
  --chip:#efebe3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
    --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e7e5e0; --muted:#9aa0a8; --line:#33373d;
  --accent:#e0735f; --accent-soft:#3a2622; --ok:#5cc28d; --ok-soft:#1d3428; --ng:#f08a80; --ng-soft:#3b2220; --chip:#2a2e33;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","PingFang TC","Noto Sans TC",sans-serif}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0}
.bar h1{font-size:18px;margin:0;flex:1 1 auto;white-space:nowrap}
.bar h1 a{text-decoration:none;color:var(--muted);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.score{font-size:14px;color:var(--muted)}
.score b{color:var(--ink)}
select.btn{padding:5px 8px}
main{padding:16px 0 120px}
.notes{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
h2.sec{font-size:20px;margin:28px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.mondai{margin:22px 0 10px}
.mondai h3{font-size:16px;margin:0 0 4px;color:var(--accent)}
.instr{font-size:14px;color:var(--muted);margin:0 0 10px}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.passage{background:var(--chip);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:15.5px}
.group img{max-width:100%;height:auto;display:block;margin:4px auto 12px;border-radius:6px;background:#fff}
.q{padding:10px 0;border-top:1px dashed var(--line)}
.group .q:first-of-type{border-top:0}
.stem{margin:0 0 8px}
.qn{display:inline-block;min-width:28px;padding:0 6px;margin-right:8px;border:1.5px solid var(--ink);border-radius:4px;text-align:center;font-weight:700;font-size:14px;line-height:22px}
.stem u{text-decoration-thickness:1.5px;text-underline-offset:4px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.choices.long{grid-template-columns:1fr}
.ch{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.ch:hover{border-color:var(--muted)}
.ch .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-top:3px}
.ch.picked{border-color:var(--ink);background:var(--chip)}
.ch.picked .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{border-color:var(--ng);background:var(--ng-soft)}
.ch.wrong .k{background:var(--ng);border-color:var(--ng);color:#fff}
.fb{margin-top:8px;font-size:14.5px;border-left:3px solid var(--line);padding:4px 0 4px 10px;display:none}
.fb.show{display:block}
.fb .verdict{font-weight:700}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.ng{color:var(--ng)}
details.script{margin-top:6px}
details.script summary{cursor:pointer;color:var(--muted);font-size:14px}
details.script div{background:var(--chip);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:14.5px}
.audio{position:sticky;top:var(--hdr,96px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.audio audio{flex:1 1 260px;width:100%}
.audio .hint{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.result{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin:20px 0}
.result table{border-collapse:collapse;width:100%;font-size:14.5px}
.result td,.result th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.result td.num{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.choices{grid-template-columns:1fr 1fr}.bar h1{font-size:16px}}
</style>
</head>

<u>特急<\/u>電車が 来ます。", "choices": ["とっきゅ", "ときゅう", "とっきゅう", "ときゅ"], "answer": 3, "explain": "句意：特快車馬上就要來了。「特」讀とく、「急」讀きゅう，く後接か行清音時促音化，故為とっきゅう。"}]}]}, {"no": 2, "instruction": "＿＿＿の ことばは どう かきますか。1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 10, "stem": "その <u>えいが<\/u>は おもしろかったですよ。", "choices": ["映面", "央画", "映画", "央面"], "answer": 3, "explain": "句意：那部電影很有趣。えいが寫作「映画」，其餘為干擾項。"}, {"n": 11, "stem": "魚が たくさん <u>およいで<\/u>います。", "choices": ["海いで", "泳いで", "港いで", "注いで"], "answer": 2, "explain": "句意：有很多魚在游。およぐ寫作「泳ぐ」；注ぐ讀そそぐ（注入），其餘為干擾項。"}, {"n": 12, "stem": "おもちゃ<u>うりば<\/u>は どこですか。", "choices": ["売り場", "売り所", "完り場", "完り所"], "answer": 1, "explain": "句意：玩具賣場在哪裡？うりば寫作「売り場」（賣場、櫃台）。"}, {"n": 13, "stem": "コンサートは 4時に <u>おわります<\/u>。", "choices": ["関わります", "始わります", "閉わります", "終わります"], "answer": 4, "explain": "句意：演唱會四點結束。おわる寫作「終わる」；関わる是有關、始まる是開始、閉まる是關閉。"}, {"n": 14, "stem": "この あたりに <u>ほんや<\/u>は ありますか。", "choices": ["本室", "本店", "本屋", "本家"], "answer": 3, "explain": "句意：這附近有書店嗎？ほんや寫作「本屋」（書店）；本家讀ほんけ（本家、嫡系）。"}, {"n": 15, "stem": "<u>かかり<\/u>の 人に 聞いてみましょう。", "choices": ["糸り", "係り", "員り", "損り"], "answer": 2, "explain": "句意：問問負責人吧。かかり寫作「係り」（負責人、擔任者），其餘為干擾項。"}]}]}, {"no": 3, "instruction": "（　）に なにを いれますか。1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 16, "stem": "二つめの えきで 電車から バスに（　）ください。", "choices": ["おりて", "のりかえて", "ひっこして", "でて"], "answer": 2, "explain": "句意：請在第二站從電車換乘公車。のりかえる（乗り換える）＝換乘；おりる是下車、ひっこす是搬家、でる是出去。"}, {"n": 17, "stem": "あの レストランの（　）には、英語の せつめいも 書いてあります。", "choices": ["サービス", "チップ", "アルバイト", "メニュー"], "answer": 4, "explain": "句意：那家餐廳的菜單上也寫有英文說明。メニュー＝菜單；サービス是服務、チップ是小費、アルバイト是打工。"}, {"n": 18, "stem": "先月 大学を（　）して、今は 日本で しごとをしています。", "choices": ["ふくしゅう", "きょういく", "けんきゅう", "そつぎょう"], "answer": 4, "explain": "句意：上個月大學畢業，現在在日本工作。そつぎょう（卒業）＝畢業；ふくしゅう是複習、きょういく是教育、けんきゅう是研究。"}, {"n": 19, "stem": "この みちは（　）をしているので、とおれません。", "choices": ["こしょう", "こうじ", "はんたい", "しっぱい"], "answer": 2, "explain": "句意：這條路正在施工，所以無法通過。こうじ（工事）＝施工；こしょう是故障、はんたい是反對、しっぱい是失敗。"}, {"n": 20, "stem": "きょう、（　）を 1まい わって しまいました。", "choices": ["タオル", "ふくろ", "さら", "ポスター"], "answer": 3, "explain": "句意：今天打破了一個盤子。さら（皿）＝盤子，可與「わる（打破）」搭配；タオル是毛巾、ふくろ是袋子、ポスター是海報。"}, {"n": 21, "stem": "日本語が ただしい かどうか、もういちど（　）して ください。", "choices": ["チェック", "コピー", "スタート", "サイン"], "answer": 1, "explain": "句意：請再檢查一遍日語是否正確。チェック＝檢查、核對；コピー是複製、スタート是開始、サイン是簽名。"}, {"n": 22, "stem": "どこに りょこうに 行くか、クラスの みんなに（　）を 聞いて、きめました。", "choices": ["そうだん", "さんせい", "しつもん", "いけん"], "answer": 4, "explain": "句意：去哪裡旅行，是問了班上同學的意見後決定的。いけん（意見）＝意見；そうだん是商量、さんせい是贊成、しつもん是提問。"}, {"n": 23, "stem": "国から りょうしんが 来るので、くうこうへ（　）に行きます。", "choices": ["むかえ", "さそい", "あんない", "じゅんび"], "answer": 1, "explain": "句意：父母從家鄉過來，所以要去機場接他們。むかえ（迎え）＝迎接；さそい是邀請、あんない是引導、じゅんび是準備。"}, {"n": 24, "stem": "この にくは かたいので、よく（　）たべて ください。", "choices": ["かんで", "こわして", "ふんで", "おして"], "answer": 1, "explain": "句意：這塊肉很硬，請好好咀嚼再吃。かむ（噛む）＝咀嚼；こわす是弄壞、ふむ是踩、おす是按壓。"}, {"n": 25, "stem": "きょうは パーティーが あるので、テーブルに 花を（　）。", "choices": ["かけました", "おくりました", "かざりました", "たてました"], "answer": 3, "explain": "句意：今天有派對，所以在桌上裝飾了花。かざる（飾る）＝裝飾；かける是掛、おくる是送、たてる是豎立。"}]}]}, {"no": 4, "instruction": "＿＿＿の ぶんと だいたい おなじ いみの ぶんが あります。1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 26, "stem": "<u>これは とても だいじです。<\/u>", "choices": ["これは とても ゆうめいです。", "これは とても たいせつです。", "これは とても べんりです。", "これは とても じょうぶです。"], "answer": 2, "explain": "句意：這個非常重要。だいじ（大事）＝たいせつ（大切），重要；ゆうめい是有名、べんり是方便、じょうぶ是結實。"}, {"n": 27, "stem": "<u>ここは きんえんです。<\/u>", "choices": ["ここで 右に まがってはいけません。", "ここで しゃしんを とってはいけません。", "ここで のみものを 飲んではいけません。", "ここで たばこを すってはいけません。"], "answer": 4, "explain": "句意：這裡禁菸。きんえん（禁煙）＝禁止吸菸，即「不可以在這裡抽菸」。"}, {"n": 28, "stem": "<u>きのう 父に しかられました。<\/u>", "choices": ["きのう 父に わらわれました。", "きのう 父に ほめられました。", "きのう 父に たのまれました。", "きのう 父に おこられました。"], "answer": 4, "explain": "句意：昨天被爸爸罵了。しかる＝責備，與おこる（生氣、發脾氣）意思相近；わらう是嘲笑、ほめる是表揚、たのむ是拜託。"}, {"n": 29, "stem": "<u>あしたの 9時に そちらに とどけます。<\/u>", "choices": ["あしたの 9時に そちらに もっていきます。", "あしたの 9時に そちらに かえします。", "あしたの 9時に そちらに つきます。", "あしたの 9時に そちらに かえります。"], "answer": 1, "explain": "句意：明天9點送到您那邊。とどける＝送到，即「拿過去」もっていく；かえす是歸還、つく是到達、かえる是回去。"}, {"n": 30, "stem": "<u>ここは 車を せいさんする ところです。<\/u>", "choices": ["ここは 車をかりる ところです。", "ここは 車をとめる ところです。", "ここは 車をつくる ところです。", "ここは 車をあらう ところです。"], "answer": 3, "explain": "句意：這裡是生產汽車的地方。せいさん（生産）＝製造，即「造車」つくる。"}]}]}, {"no": 5, "instruction": "つぎの ことばの つかいかたで いちばん いい ものを 1・2・3・4から ひとつ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 31, "stem": "やくそく", "choices": ["この ひこうきは 10時に 日本に つく <u>やくそく<\/u>です。", "あしたは、母と かいものに 行く <u>やくそく<\/u>が あります。", "電車の きっぷの <u>やくそく<\/u>は インターネットで できますか。", "今から、きょうの 見学の <u>やくそく<\/u>を せつめいします。"], "answer": 2, "explain": "やくそく（約束）意為「約定」。選項2「明天和媽媽約好去買東西」正確；1應為「予定」、3應為「予約」、4應為「日程」。"}, {"n": 32, "stem": "おれい", "choices": ["おみやげを もらったので、<u>おれい<\/u>を 言いました。", "にゅういんした とき、友だちが <u>おれい<\/u>に 来て くれました。", "きょうは 父の たんじょうびの <u>おれい<\/u>を 買いに 行きます。", "「しつれいします」と 言って、<u>おれい<\/u>を してから へやに 入ります。"], "answer": 1, "explain": "おれい（お礼）意為「感謝、道謝」。選項1「收到禮物所以道了謝」正確；2應為「お見舞い」、3應為「プレゼント」、4應為「挨拶」。"}, {"n": 33, "stem": "ていねい", "choices": ["デパートや ホテルの 人は <u>ていねいな<\/u> ことばを つかいます。", "父の たんじょうびに <u>ていねいな<\/u> レストランに 行きました。", "女の人に 年を 聞くのは <u>ていねい<\/u>ではありません。", "この おかしは あじが とても <u>ていねい<\/u>ですね。"], "answer": 1, "explain": "ていねい（丁寧）意為「有禮貌、恭敬」。選項1「百貨公司和飯店的人使用恭敬的言辭」正確；2應為「豪華」、3應為「失礼」、4應為「美味しい」。"}, {"n": 34, "stem": "ぬれる", "choices": ["チョコレートで 手が <u>ぬれて<\/u> しまいました。", "もりの 中の 空気は いつも <u>ぬれて<\/u> います。", "雨で せんたくものが <u>ぬれて<\/u> しまいました。", "この メロンは <u>ぬれて<\/u> いて、おいしいですね。"], "answer": 3, "explain": "ぬれる（濡れる）意為「淋濕」。選項3「洗好的衣服被雨淋濕了」正確；1應為「汚れる」、2應為「潤う」、4應為「みずみずしい」。"}, {"n": 35, "stem": "わかす", "choices": ["はしる前に、少し うんどうを して、からだを <u>わかしました<\/u>。", "<u>わかした<\/u> たまごを 半分にして、サラダに 入れました。", "さむいので、ストーブで へやを <u>わかしましょう<\/u>。", "おちゃを 入れるから、おゆを <u>わかして<\/u> ください。"], "answer": 4, "explain": "わかす（沸かす）意為「燒開（水）」。選項4「要泡茶，請燒點開水」正確；1應為「暖かくする」、2應為「茹でる」、3應為「暖める」。"}]}]}]}, {"name": "言語知識（文法）・読解", "mondai": [{"no": 1, "instruction": "（　）に 何を 入れますか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "この レストランでは、料理（　）使う野菜を 庭で 育てています。", "choices": ["は", "に", "や", "の"], "answer": 2, "explain": "句意：這家餐廳在院子裡種植做菜要用的蔬菜。「に」表示用途、目的（用於料理）。"}, {"n": 2, "stem": "（ケーキ屋で）客「すみません。いちごの ケーキと、チョコレートの ケーキを 二つ（　）ください。」", "choices": ["と", "が", "ずつ", "など"], "answer": 3, "explain": "句意：草莓蛋糕和巧克力蛋糕請各給我兩個。「ずつ」接在數量詞後，表示「每…、各…」。"}, {"n": 3, "stem": "きのう（　）違って、今日は いい天気です。", "choices": ["と", "の", "に", "まで"], "answer": 1, "explain": "句意：和昨天不同，今天天氣很好。「～と違って」的「と」表示比較對象。"}, {"n": 4, "stem": "A「この カレーは からいですね。」<br>B「えっ？そうですか。私（　）からくないですよ。」", "choices": ["では", "には", "と", "へ"], "answer": 2, "explain": "句意：我覺得不辣啊。「に」在形容詞謂語句中表示判斷的基準或對象，「は」起強調作用。"}, {"n": 5, "stem": "A「台所から いいにおい（　）しますね。」<br>B「クッキーを 焼いているんです。」", "choices": ["で", "に", "を", "が"], "answer": 4, "explain": "句意：廚房飄出一陣香味。句型「～がする」接在氣味、聲音、感覺等名詞後，表示感覺到該事物。"}, {"n": 6, "stem": "インターネットを 使えば、（　）買い物が できて、便利です。", "choices": ["いつでも", "いつまで", "どこから", "どこにも"], "answer": 1, "explain": "句意：使用網路隨時都能購物，十分方便。いつでも＝隨時；いつまで是到什麼時候、どこから是從哪裡、どこにも是任何地方（多接否定）。"}, {"n": 7, "stem": "明日から 三日間 京都へ 行く 予定だが、泊まる ホテルが（　）決まって いない。", "choices": ["もう", "まだ", "そろそろ", "もうすぐ"], "answer": 2, "explain": "句意：預定明天起去京都三天，但住的飯店還沒決定。「まだ～ない」表示「還沒…」。"}, {"n": 8, "stem": "田中「森さん、先週は かぜで お休みでしたね。具合は どうですか。」<br>森「はい、（　）元気に なりました。」", "choices": ["よく", "あまり", "すっかり", "かならず"], "answer": 3, "explain": "句意：嗯，已經完全恢復了。すっかり＝完全；よく是經常、あまり是（不）太、かならず是一定。"}, {"n": 9, "stem": "この 神社の 祭りは、長い間 村の人たち（　）続けられている。", "choices": ["から", "より", "によって", "について"], "answer": 3, "explain": "句意：這座神社的祭典長期以來由村民延續下來。句尾是被動形，「によって」在被動句中表示動作的實施者。"}, {"n": 10, "stem": "入学式の 間、子どもたちは 先生の 話を（　）聞いて いました。", "choices": ["熱心", "熱心な", "熱心で", "熱心に"], "answer": 4, "explain": "句意：在開學典禮上，孩子們專注地聽老師講話。な形容詞修飾動詞時要變成「～に」。"}, {"n": 11, "stem": "私は 来年の 夏、富士山に（　）つもりです。", "choices": ["のぼる", "のぼった", "のぼろう", "のぼりたい"], "answer": 1, "explain": "句意：我打算明年夏天去爬富士山。「つもり」表示意圖，前接動詞辭書形或ない形。"}, {"n": 12, "stem": "（駅で）<br>客「あのう、この さいふが 落ちて（　）。」<br>駅員「ありがとうございます。どこに ありましたか。」<br>客「トイレの 前です。」", "choices": ["いました", "しました", "みました", "おきました"], "answer": 1, "explain": "句意：這個錢包掉在地上了。「～ていました」表示狀態的持續（錢包掉落在那裡的狀態）；てみる是嘗試、ておく是事先做好。"}, {"n": 13, "stem": "朝、私は いつも バナナしか（　）。", "choices": ["食べます", "食べません", "食べることが できます", "食べる かもしれません"], "answer": 2, "explain": "句意：我早上一般都只吃香蕉。句型「～しか～ない」表示「只、只有…」，後面必須接否定。"}, {"n": 14, "stem": "山下「森さんの たんじょうびに 何を あげましょうか。」<br>田中「花は どうですか。」<br>山下「いいですね。森さんは 花が 好きだから、きっと（　）。」", "choices": ["よろこぶそうです", "よろこんだんです", "よろこぶでしょう", "よろこんだようです"], "answer": 3, "explain": "句意：森小姐喜歡花，一定會很高興吧。「きっと～でしょう」表示推量；そうだ是傳聞、のだ是說明、ようだ是樣態。"}, {"n": 15, "stem": "（駅で）<br>A「飲み物が ほしいので、急いで 買ってきますね。」<br>B「わかりました。出発まで 時間は ありますから、（　）よ。」", "choices": ["急がなくなります", "急がなければなりません", "急いだほうが いいです", "急がなくてもいいです"], "answer": 4, "explain": "句意：離出發還有時間，不用急。「～なくてもいい」表示「不…也可以」；なければならない是必須、ほうがいい是最好。"}]}]}, {"no": 2, "instruction": "＿★＿に 入る ものは どれですか。1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 16, "stem": "中川「山下さん、駅から ホテルまで 行き方が わかりますか。」<br>山下「いいえ、わかりません。＿＿＿ ＿＿＿ ★ ＿＿＿ に 聞きましょう。」", "choices": ["で", "だれ", "駅", "か"], "answer": 2, "explain": "正確語序：駅 で だれ か に 聞きましょう（在車站找個人問問吧）。★處為「だれ」。「か」接在疑問詞後表示不確定。"}, {"n": 17, "stem": "最近、仕事が いそがしくて、＿＿＿ ＿＿＿ ★ ＿＿＿ 日が 多い。", "choices": ["帰る", "なる", "遅く", "のが"], "answer": 3, "explain": "正確語序：帰る のが 遅く なる 日が多い（最近常常很晚回家）。★處為「遅く」。「～くなる」表示變化。"}, {"n": 18, "stem": "両親と いっしょに ＿＿＿ ＿＿＿ ★ ＿＿＿ 貯金しています。", "choices": ["ために", "家を", "住める", "建てる"], "answer": 4, "explain": "正確語序：住める 家を 建てる ために 貯金しています（為了蓋能和父母一起住的房子而存錢）。★處為「建てる」。"}, {"n": 19, "stem": "明日は 朝早く 出かけない ＿＿＿ ＿＿＿ ★ ＿＿＿ かどうか 心配です。", "choices": ["が", "と", "早起きできる", "いけないのです"], "answer": 1, "explain": "正確語序：出かけない と いけないのです が 早起きできる かどうか（明天必須早出門，擔心能不能早起）。★處為「が」。"}, {"n": 20, "stem": "きのう パーティーで 丸い ＿＿＿ ＿＿＿ ★ ＿＿＿ くだものを 食べました。", "choices": ["あまい", "の", "赤くて", "形"], "answer": 3, "explain": "正確語序：丸い 形 の 赤くて あまい くだもの（圓形、紅色又甜的水果）。★處為「赤くて」。形容詞連用時前一個要變成「～くて」。"}]}]}, {"no": 3, "instruction": "21 から 25 に 何を 入れますか。文章の 意味を 考えて、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "下の文章は インさんが 田中さんに 書いた 手紙です。田中さんは インさんの 大学の 留学生でした。今は 日本の 大学で 勉強して います。<br><br>田中さん<br>　お元気ですか。もう 7月ですね。田中さんが 日本に 帰って、3か月です。たんじょうびに 田中さんが（ 21 ）日本の カードは とても きれいですね。ありがとうございました。<br>　私（ 22 ）先月大学を 卒業して、今は 貿易会社に 勤めています。私は ずっと 貿易の 仕事が したいと 思って いました。それで、貿易会社に（ 23 ）。仕事は いそがしいですが、楽しいです。<br>　田中さんは もう すぐ 夏休みですね。私は 日本に いる ともだちの けっこんしきが あるので、8月 27日から 東京に 行きます。31日まで 東京に いるのですが、会えませんか。（ 24 ）田中さんに 会いたいです。<br>　手紙と いっしょに お茶を 送ります。私は 会社で お茶の 輸出の 仕事をしています。（ 25 ）。おいしいですよ。<br>　それでは、また。<br>2014年7月3日<br>イン　レイクン", "image": null, "questions": [{"n": 21, "stem": "（ 21 ）", "choices": ["送ってあげた", "送ってくれた", "送ってやった", "送ってもらった"], "answer": 2, "explain": "卡片是田中送給作者的，主語用「が」提示給予者，應用「～てくれる」表示他人為我做某事。"}, {"n": 22, "stem": "（ 22 ）", "choices": ["なら", "と", "が", "は"], "answer": 4, "explain": "說明句的主題通常用「は」提示，後面對其進行說明。"}, {"n": 23, "stem": "（ 23 ）", "choices": ["入りそうです", "入るところです", "入りました", "入ったことがあります"], "answer": 3, "explain": "作者進入貿易公司是已發生的事實（現在已在上班），需用過去式「入りました」。"}, {"n": 24, "stem": "（ 24 ）", "choices": ["ぜひ", "では", "例えば", "そして"], "answer": 1, "explain": "作者詢問8月27日至31日能否見面，表達強烈願望，只有表示「一定、務必」的「ぜひ」符合。"}, {"n": 25, "stem": "（ 25 ）", "choices": ["飲んでみてもいいですか", "飲んでみてください", "飲んでみましょうか", "飲んでみようと思います"], "answer": 2, "explain": "作者隨信寄去自己公司的茶葉，邀請對方嘗嘗看，用「～てください」（請…）。"}]}]}, {"no": 4, "instruction": "つぎの (1) から (4) の 文章を 読んで、質問に 答えて ください。答えは、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "このお知らせがエレベーターにはってあります。<br><br><b>お知らせ<\/b><br><u>7月8日(火)<\/u>、安全チェックのため、エレベーターが止まります。<br><br>北側エレベーター　14時から15時15分まで<br>南側エレベーター　14時45分から16時まで<br><br>＊14時45分から15時15分までは、両方のエレベーターが止まりますので、注意してください。<br><br>よろしくお願いします。<br>第一ビルディング", "image": "img/2014-07_R4_1.jpg", "questions": [{"n": 26, "stem": "7月8日の15時半に荷物を運ばなければなりません。どのエレベーターが使えますか。", "choices": ["北側エレベーターだけ", "南側エレベーターだけ", "南側エレベーターと北側エレベーター", "どちらも使えない"], "answer": 1, "explain": "北側電梯停運時間為14:00～15:15，南側為14:45～16:00，所以15:30只有北側電梯可用。"}]}, {"passage": "私の家のそばに「元気たまご」という店があります。卵だけを売る店です。日本のスーパーでは大きすぎたり小さすぎたりする卵は売られていません。しかし、「元気たまご」では売っています。大きすぎたり小さすぎたりするので、どれでも1個10円で、スーパーより安いです。客は店で売っている紙の箱に卵を入れて、レジに持っていきます。箱は10円ですが、丈夫で何回も使えます。新しくて味もいいので、「元気たまご」の卵は人気があります。全部売れたら、店は閉まります。", "image": null, "questions": [{"n": 27, "stem": "「元気たまご」で売っている卵について、合っているものはどれですか。", "choices": ["スーパーでは、売っていない大きさです。", "1個10円で、どれもだいたい同じ大きさです。", "スーパーでも人気があって、おいしいです。", "味はあまりよくありませんが、とても安いです。"], "answer": 1, "explain": "文中說日本超市不賣過大或過小的蛋，而這家店有賣這類蛋，且蛋新鮮好吃、很受歡迎。"}, {"n": 28, "stem": "「元気たまご」では、どうやって卵を買いますか。", "choices": ["客が箱に卵を入れて、レジに持っていきます。", "客が卵の入っている箱を選んで、レジに持っていきます。", "客が店の人にお金を払って、箱に卵を入れてもらいます。", "客が店に置いてある箱にお金を入れて、好きな卵を持っていきます。"], "answer": 1, "explain": "文中說客人把蛋裝進店內販售的紙盒中，拿到收銀台結帳（盒子10日圓）。"}]}, {"passage": "（会社で）山口さんの机の上にこのメモがあります。<br><br>山口さん<br>　東山さんから電話がありました。<br>　電車が止まってしまったそうです。30分ぐらい遅れますが、予定の時間になったら、会議を始めてくださいと言っていました。<br>　それから、東山さんの作った会議の資料を持っていって、みなさんに渡しておいてもらいたいそうです。<br>ルイス<br>6月28日 10:32", "image": null, "questions": [{"n": 29, "stem": "このメモを読んで、山口さんは何をしなければなりませんか。", "choices": ["資料を会議に持っていって、東山さんが来るまで待ちます。", "資料をみんなに渡して、予定の時間になったら会議を始めます。", "会議を30分遅く始めることをみんなに伝えて、資料を渡します。", "30分待って東山さんが来なかったら、資料を持っていって、会議を始めます。"], "answer": 2, "explain": "東山先生因電車停駛會遲到約30分鐘，但會議仍照原定時間開始，並希望山口先生把資料帶去發給大家。"}]}]}, {"no": 5, "instruction": "つぎの 文章を 読んで、質問に 答えて ください。答えは、1・2・3・4から いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": "大学1年の冬休みに大学の本売り場で、「読んでみよう。4年で100冊！」と書いてあるポスターを見ました。<u>①本を読んで<\/u>、決められた紙に本の紹介文を書いて出すと、本売り場で使えるチケットがもらえるのだそうです。ポスターの周りには、学生が書いた紹介文もたくさんはってありました。<br>　学生はまず、レジでカードを作ります。そして、本を1冊読んで紹介文を1枚出すと、売り場の人がカードにはんこを1個押してくれます。本は、雑誌とマンガと授業のテキスト以外なら何でも良くて、大学の本売り場で買った本でなくてもいいそうです。そして、はんこを10個集めたら500円のチケットが1枚もらえます。学生にいろいろな本を読んでもらうために考えたアイデアだそうですが、面白そうなので、私もやってみることにしました。<br>　私はあまり本を読まない学生だったので、初めは、10冊の本を読むのに半年もかかったし、紹介文を書くのも大変でした。でも、だんだん速く読めるようになって、今ではいつも本を持って歩くようになりました。もらったチケットで新しい本を買うこともできたし、とても<u>②いいやり方だと思いました<\/u>。始めたのはおととしの冬でスタートは遅れましたが、まだ卒業まで2年ありますから、頑張れば<u>③できる<\/u>と思っています。", "image": null, "questions": [{"n": 30, "stem": "<u>①本を読んで<\/u>とありますが、どんな本を読みますか。", "choices": ["大学の ": [{"no": 1, "instruction": "もんだい1では、まず しつもんを 聞いて ください。それから 話を 聞いて、もんだいようしの 1から4の 中から、いちばん いい ものを 一つ えらんで ください。", "groups": [{"passage": null, "image": null, "questions": [{"n": 1, "stem": "1ばん<br>女の人はこれから、男の人とどこで会いますか。", "choices": ["バスてい", "えいがかん", "きっさてん", "ほんや"], "answer": 3, "explain": "男人說他在電影院附近的咖啡店喝咖啡，旁邊有書店；女人說馬上過去，所以在咖啡店見面。", "script": "携帯電話で、女の人と男の人が話しています。女の人はこれから、男の人とどこで会いますか。<br>女：もしもし、今バス停に着きました。遅くなってすみません。山田さん、今どこにいますか。<br>男：僕は映画館の近くの喫茶店でコーヒーを飲んでいます。隣に本屋があるから、すぐ分かりますよ。<br>女：分かりました。すぐ行きます。<br>女の人はこれから、男の人とどこで会いますか。"}]}, {"passage": null, "image": "img/2014-07_L1_2.jpg", "questions": [{"n": 2, "stem": "2ばん<br>学生は明日、何を持ってこなければなりませんか。", "choices": ["1", "2", "3", "4"], "answer": 3, "explain": "肉、魚、茶由學校準備，筷子和盤子用學校的，不用帶課本；老師說會常洗手，別忘了帶毛巾。", "script": "日本語学校で、先生が話しています。学生は明日、何を持ってこなければなりませんか。<br>男：明日のクラスで日本の料理を作ります。料理に使う肉や魚などは、学校で用意します。お茶も用意します。箸やお皿などは学校のものを使います。手を洗うことが多いので、タオルを忘れないでください。明日は日本語の授業はないので、テキストは持ってこなくてもいいですよ。<br>学生は明日、何を持ってこなければなりませんか。"}]}, {"passage": null, "image": null, "questions": [{"n": 3, "stem": "3ばん<br>男の人はこのあとどこへ行きますか。", "choices": ["コンビニ", "スーパー", "やおや", "デパート"], "answer": 1, "explain": "超市今天休息，蔬果店上個月關了，百貨公司太遠，所以男人去便利商店。", "script": "うちで女の人と男の人が話しています。男の人はこのあとどこへ行きますか。<br>女：ちょっとコンビニに行って、人参を買ってきてくれない？<br>男：うん、いいよ。でも、コンビニよりスーパーの方が近くない？<br>女：ああ、スーパーは今日は休み。<br>男：そうか。あ、近所の八百屋はどう？<br>女：あそこは先月店をやめたんだよ。便利だったのに、残念。本当はコンビニよりデパートの方が品物がいいけど、ちょっと遠いから、今日はいいよ。<br>男：そうか。じゃ、行ってくる。<br>男の人はこのあとどこへ行きますか。"}]}, {"passage": null, "image": null, "questions": [{"n": 4, "stem": "4ばん<br>学生は何時までに教室に来なければなりませんか。", "choices": ["12時55分", "1時", "1時5分", "1時10分"], "answer": 1, "explain": "預定1點出發，要在5分鐘前集合，所以要在12點55分前到教室。", "script": "教室で先生が話しています。学生は何時までに教室に来なければなりませんか。<br>女：皆さん、今日は午後美術館へ行って、日本の古い絵を見ます。1時にここを出る予定ですから、5分前にこの教室に集まってください。皆集まったらすぐ出ます。ええ、ここから美術館まで歩いて十分ぐらいです。じゃ、今から昼休みです。<br>学生は何時までに教室に来なければなりませんか。"}]}, {"passage": null, "image": null, "questions": [{"n": 5, "stem": "5ばん<br>女の学生は水を何本準備しなければなりませんか。", "choices": ["5本", "10本", "15本", "20本"], "answer": 4, "explai const save = () => store.set(S);
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

// theme
(function(){
  let t; try { t = localStorage.getItem('n5-theme'); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const n = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem('n5-theme', n); } catch(e){}
  };
})();

const SHORT = ['文字・語彙','文法・讀解','聽解'];
const allQ = []; // {key, sec, q, node}
const secNodes = [];

function render(){
  const main = $('#main');
  if (D.notes) main.appendChild(el('div','notes','<b>說明：</b>' + D.notes));
  D.sections.forEach((sec, si) => {
    const sn = el('section','sec-wrap'); sn.dataset.sec = si;
    sn.appendChild(el('h2','sec', sec.name));
    const isL = /聴解|聽解/.test(sec.name);
    if (isL && D.audio) sn.appendChild(player(D.audio, '整份聽解錄音（播放器會固定在上方，可邊聽邊作答）'));
    if (isL && !D.audio && !sec.mondai.some(m => m.audio)) sn.appendChild(el('div','notes', D.webNoAudio ? '線上版因版權因素不含聽解錄音；仍可作答，作答後可展開「聽力原文」閱讀。' : '此卷沒有聽解錄音檔，可作答後展開「聽力原文」閱讀。'));
    sec.mondai.forEach(m => {
      const mn = el('div','mondai');
      mn.appendChild(el('h3', null, 'もんだい ' + m.no));
      if (m.instruction) mn.appendChild(el('p','instr', m.instruction));
      if (m.audio) mn.appendChild(player(m.audio, 'もんだい ' + m.no + ' 錄音'));
      (m.groups || []).forEach(g => {
        const gn = el('div','group');
        if (g.image) { const im = el('img'); im.src = g.image; im.loading = 'lazy'; im.alt = ''; gn.appendChild(im); }
        if (g.passage) gn.appendChild(el('div','passage', g.passage));
        g.questions.forEach(q => {
          const key = si + '-' + m.no + '-' + q.n;
          const qn = el('div','q'); qn.dataset.key = key;
          qn.appendChild(el('p','stem', '<span class="qn">' + q.n + '</span>' + (q.stem || '')));
          const cs = el('div','choices');
          const longest = Math.max(...q.choices.map(c => c.replace(/<[^>]+>/g,'').length));
          if (longest > 14) cs.classList.add('long');
          q.choices.forEach((c, ci) => {
            const b = el('button','ch','<span class="k">' + (ci+1) + '</span><span>' + c + '</span>');
            b.onclick = () => pick(key, ci+1);
            cs.appendChild(b);
          });
          qn.appendChild(cs);
          const fb = el('div','fb');
          let inner = '<span class="verdict"></span>';
          if (q.explain) inner += '<div class="ex">' + q.explain + '</div>';
          fb.innerHTML = inner;
          if (q.script) { const d = el('details','script','<summary>聽力原文</summary><div>' + q.script + '</div>'); fb.appendChild(d); }
          qn.appendChild(fb);
          gn.appendChild(qn);
          allQ.push({key, sec: si, q, node: qn, group: gn, mondai: mn});
        });
        mn.appendChild(gn);
      });
      sn.appendChild(mn);
    });
    main.appendChild(sn);
    secNodes.push(sn);
  });
  main.appendChild(el('div','result hidden')).id = 'result';

  const tabs = $('#tabs');
  const mk = (id, label) => { const b = el('button','tab', label); b.dataset.tab = id; b.onclick = () => { S.tab = id; save(); refresh(); scrollTo(0,0); }; tabs.appendChild(b); };
  mk('all','全部');
  D.sections.forEach((s, i) => mk(String(i), SHORT[i] || s.name));
}

function player(src, hint){
  const a = el('div','audio');
  const au = document.createElement('audio');
  au.controls = true; au.preload = 'none'; au.src = encodeURI(src);
  a.appendChild(au);
  a.appendChild(el('span','hint', hint));
  au.onerror = () => { a.querySelector('.hint').textContent = '找不到錄音檔，請確認 mp3 仍在原資料夾：' + src; };
  return a;
}

function pick(key, v){
  if (S.submitted) return;
  if (S.mode === 'practice' && S.answers[key] != null) return; // 練習模式：作答後鎖定
  S.answers[key] = v; save(); refresh();
}

function refresh(){
  $('#mode').value = S.mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  secNodes.forEach((n, i) => n.classList.toggle('hidden', S.tab !== 'all' && String(i) !== S.tab));
  const reveal = S.mode === 'practice' || S.submitted;
  const wrongOnly = $('#wrongOnly').checked;
  let done = 0, right = 0, total = 0;
  allQ.forEach(o => {
    const a = S.answers[o.key];
    const inTab = S.tab === 'all' || String(o.sec) === S.tab;
    if (inTab) { total++; if (a != null) done++; if (a === o.q.answer) right++; }
    const show = a != null && reveal;
    o.node.querySelectorAll('.ch').forEach((b, i) => {
      b.classList.remove('picked','right','wrong');
      if (show) {
        if (i+1 === o.q.answer) b.classList.add('right');
        else if (i+1 === a) b.classList.add('wrong');
      } else if (a === i+1) b.classList.add('picked');
    });
    const fb = o.node.querySelector('.fb');
    fb.classList.toggle('show', show);
    if (show) {
      const v = fb.querySelector('.verdict');
      const ok = a === o.q.answer;
      v.className = 'verdict ' + (ok ? 'ok' : 'ng');
      v.textContent = ok ? '✓ 正確' : '✗ 答錯了，正確答案是 ' + o.q.answer;
    }
    const hideIt = wrongOnly && reveal && (a === o.q.answer || a == null);
    o.node.classList.toggle('hidden', hideIt);
  });
  // 隱藏整組 / 整個 もんだい 若其中的題目都被隱藏
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('hidden', [...g.querySelectorAll('.q')].every(q => q.classList.contains('hidden'))));
  document.querySelectorAll('.mondai').forEach(m => m.classList.toggle('hidden', [...m.querySelectorAll('.group')].every(g => g.classList.contains('hidden'))));
  $('#score').innerHTML = reveal
    ? '已作答 <b>' + done + '</b> / ' + total + '　答對 <b>' + right + '</b>' + (done ? '（' + Math.round(right/done*100) + '%）' : '')
    : '已作答 <b>' + done + '</b> / ' + total + '（交卷後顯示成績）';
  $('#submit').classList.toggle('hidden', S.mode !== 'exam' || S.submitted);
  renderResult(reveal);
  const h = document.querySelector('header.top').offsetHeight;
  document.documentElement.style.setProperty('--hdr', (h + 8) + 'px');
}

function renderResult(reveal){
  const r = $('#result');
  if (!reveal || !Object.keys(S.answers).length) { r.classList.add('hidden'); return; }
  r.classList.remove('hidden');
  let rows = '';
  D.sections.forEach((s, i) => {
    const qs = allQ.filter(o => o.sec === i);
    const ok = qs.filter(o => S.answers[o.key] === o.q.answer).length;
    const dn = qs.filter(o => S.answers[o.key] != null).length;
    rows += '<tr><td>' + s.name + '</td><td class="num">' + ok + ' / ' + qs.length + '</td><td class="num">' + dn + ' 題已答</td></tr>';
  });
  const ok = allQ.filter(o => S.answers[o.key] === o.q.answer).length;
  r.innerHTML = '<b>成績統計</b><table>' + rows + '<tr><th>合計</th><th class="num">' + ok + ' / ' + allQ.length + '</th><th></th></tr></table>';
}

$('#mode').onchange = e => { S.mode = e.target.value; save(); refresh(); };
$('#wrongOnly').onchange = refresh;
$('#submit').onclick = () => {
  const left = allQ.filter(o => S.answers[o.key] == null).length;
  if (left && !confirm('還有 ' + left + ' 題未作答，確定要交卷嗎？')) return;
  S.submitted = true; save(); refresh(); scrollTo(0,0);
};
$('#reset').onclick = () => {
  if (!confirm('清除本卷所有作答紀錄？')) return;
  S.answers = {}; S.submitted = false; save(); $('#wrongOnly').checked = false; refresh();
};
render(); refresh();
</script>
</body>
</html>
